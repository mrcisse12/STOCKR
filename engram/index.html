  clearDemo: () => { const ex = S.profile.exam?.example; Store.leaveDemo(true); if (ex) S.profile.exam = null; Store.touch('profile'); App.render(); toast('Exemples effacés. À vous de jouer !', 'sparkles'); },
  wipe: el => {
    if (!el.dataset.sure) { el.dataset.sure = 1; el.innerHTML = icon('trash', 'i-sm') + 'Confirmer : tout supprimer'; return; }
    const ids = S.decks.map(d => d.id), imgs = Object.keys(S.images);
    S.decks = []; S.images = {}; Object.assign(S.profile, { log: {}, xp: 0, bestStreak: 0, badges: {}, flags: {}, exam: null });
    ids.forEach(id => Store.dirty.add('deck:' + id)); imgs.forEach(k => Store.dirty.add('img:' + k)); Store.touch('profile');
    App.go('today'); toast('Tout a été effacé', 'trash');
  }
};

function bootApp() {
  document.addEventListener('click', e => {
    if (e.target.closest('#onb')) { Onb.click(e); return; }
    const a = e.target.closest('[data-act]'); if (!a) return;
    if (a.tagName === 'A') e.preventDefault();
    const fn = Actions[a.dataset.act]; if (fn) fn(a, e); else Study.act(a.dataset.act, a, e);
  });
  document.addEventListener('keydown', e => {
    if (!$('#onb').hidden) return;
    if (e.key === 'Enter' && e.target.matches?.('[role="link"][data-act]')) { e.target.click(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (!Modal.stack.length) openPalette(); return; }
    if (e.key === 'Escape' && Modal.stack.length) { Modal.close(); e.preventDefault(); return; }
    if (Modal.stack.length) return;
    const typing = /input|textarea|select/i.test(e.target.tagName) || e.target.isContentEditable;
    if (Study.active) { Study.key(e, typing); return; }
    if (Game.key(e, typing)) return;
    if (!typing && e.key === ' ' && App.route.v === 'today' && todayCounts().total) { e.preventDefault(); Study.start(); }
  });
  const tip = $('#tip');
  document.addEventListener('pointerover', e => {
    const el = e.target.closest?.('[data-tip]'); if (!el) { tip.hidden = true; return; }
    const r = el.getBoundingClientRect(); tip.textContent = el.dataset.tip; tip.hidden = false;
    tip.style.left = clamp(r.left + r.width / 2, 90, innerWidth - 90) + 'px'; tip.style.top = r.top + 'px';
  });
  addEventListener('scroll', () => tip.hidden = true, { passive: true });
  $('#fileImport').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const parsed = parseImport(f.name, await f.text());
      const decks = parsed.decks.filter(d => d.cards.length);
      if (!decks.length) { toast('Aucune fiche reconnue. Format attendu : recto;verso par ligne.', 'file'); return; }
      if (S.demo) Store.leaveDemo(false);
      for (const [k, v] of Object.entries(parsed.images || {})) if (typeof v === 'string' && v.startsWith('data:image/')) { S.images[k] = v; Store.dirty.add('img:' + k); }
      let n = 0;
      for (const d of decks) { const nd = { id: d.id || uid('d'), name: d.name, desc: d.desc || '', color: d.color || pick(Object.keys(DECK_COLORS)), lang: d.lang || 'fr', created: Date.now(), updatedAt: Date.now(), cards: d.cards }; S.decks.unshift(nd); n += d.cards.length; Store.touchDeck(nd); }
      Store.touch('profile'); App.go('deck', S.decks[0].id); toast(plural(n, 'fiche importée', 'fiches importées'), 'upload');
    } catch { toast('Fichier illisible. Utilisez un JSON Engram, un CSV ou un TSV.', 'file'); }
  });
  addEventListener('beforeunload', () => { if (Store.dirty.size) Store.flush(); });
}

/* ════════════════════════════════════════════════════════════════════
   SÉANCE DE RÉVISION
   File d'attente façon Anki (apprentissage → révisions, nouvelles
   intercalées). Chaque note est tamponnée sur la fiche, puis la fiche
   s'envole vers son compartiment de la boîte. Correction par l'IA (ou
   locale), dictée, prof virtuel, annulation, bordereau de fin.
   ════════════════════════════════════════════════════════════════════ */
const Study = {
  active: false, queue: [], learn: [], cur: null, flipped: false, mode: 'flip', choice: null, verdict: null, typed: '',
  order: [], pool: [], t0: 0, stats: null, history: [], ctl: null, tutorCtl: null, fails: {}, wake: null, cram: false, busy: false, tok: 0, scope: [], summaryOn: false,

  build(deckId, cram) {
    const decks = deckId ? [deckById(deckId)].filter(Boolean) : S.decks;
    const cards = decks.flatMap(d => d.cards.map(c => [c, d])).filter(([c]) => !c.suspended);
    if (cram) {
      // Révision en avance : les fiches les plus fragiles d'abord.
      return cards.filter(([c]) => c.srs.state > 0).sort((a, b) => FSRS.retrievability(a[0].srs) - FSRS.retrievability(b[0].srs)).slice(0, 20)
        .concat(cards.filter(([c]) => c.srs.state === 0).slice(0, 5));
    }
    const now = Date.now();
    const newLeft = Math.max(0, S.profile.settings.newPerDay - (S.profile.log[dayKey()]?.n || 0));
    const learning = cards.filter(([c]) => (c.srs.state === 1 || c.srs.state === 3) && isDue(c, now)).sort((a, b) => a[0].srs.due - b[0].srs.due);
    const reviews = shuffle(cards.filter(([c]) => c.srs.state === 2 && isDue(c, now))).sort((a, b) => FSRS.retrievability(a[0].srs) - FSRS.retrievability(b[0].srs));
    const fresh = cards.filter(([c]) => c.srs.state === 0).slice(0, newLeft);
    // Une seule fiche « sœur » par note le même jour, comme dans Anki.
    const seen = new Set(); const dedupe = arr => arr.filter(([c]) => { if (!c.note) return true; if (seen.has(c.note)) return false; seen.add(c.note); return true; });
    const rev = dedupe(reviews), nw = dedupe(fresh);
    const mixed = []; let ni = 0;
    rev.forEach((x, i) => { mixed.push(x); if ((i + 1) % 4 === 0 && ni < nw.length) mixed.push(nw[ni++]); });
    while (ni < nw.length) mixed.push(nw[ni++]);
    return learning.concat(mixed);
  },
  start(o = {}) {
    const items = o.items || this.build(o.deckId, o.cram);
    if (!items.length) { toast(o.cram ? 'Aucune fiche à réviser dans ce paquet.' : 'Rien à réviser pour le moment. Revenez plus tard !', 'check'); return; }
    this.active = true; this.summaryOn = false; this.queue = items.slice(); this.learn = []; this.cram = !!o.cram;
    this.deckName = o.title || (o.deckId ? deckById(o.deckId)?.name : 'Toutes les fiches');
    this.scope = o.deckId ? [deckById(o.deckId)] : [...new Set(items.map(x => x[1]))];
    this.mode = S.profile.settings.answerMode; this.history = []; this.fails = {};
    this.stats = { n: 0, ok: 0, xp: 0, t0: Date.now(), g: [0, 0, 0, 0, 0] }; this.lvl0 = level().i;
    document.body.classList.add('studying');
    $('#study').hidden = false;
    if (S.profile.settings.ambient !== 'off') Ambient.set(S.profile.settings.ambient);
    try { navigator.wakeLock?.request('screen').then(w => this.wake = w).catch(() => { }); } catch { }
    this.next();
  },
  close(silent) {
    this.active = false; this.summaryOn = false; this.cur = null; this.busy = false; this.tok++;
    this.ctl?.abort(); this.tutorCtl?.abort(); Dictation.stop(); Ambient.stop();
    try { speechSynthesis.cancel(); } catch { }
    try { this.wake?.release(); } catch { } this.wake = null;
    const el = $('#study'); el.hidden = true; el.innerHTML = '';
    document.body.classList.remove('studying');
    if (!silent) App.render();
  },
  counts() {
    const m = { n: 0, l: 0, r: 0 };
    for (const [c] of [...this.queue, ...this.learn.map(l => l.item)]) { if (c.srs.state === 0) m.n++; else if (c.srs.state === 2) m.r++; else m.l++; }
    return m;
  },
  next() {
    this.busy = false;
    const now = Date.now();
    this.learn.sort((a, b) => a.due - b.due);
    let item = null;
    const li = this.learn.findIndex(l => l.due <= now);
    if (li >= 0) item = this.learn.splice(li, 1)[0].item;
    else if (this.queue.length) item = this.queue.shift();
    else if (this.learn.length) item = this.learn.shift().item; // on avance les fiches en apprentissage
    if (!item) return this.summary();
    this.cur = item; this.flipped = false; this.choice = null; this.verdict = null; this.typed = ''; this.t0 = Date.now();
    this.order = []; this.pool = item[0].type === 'order' ? shuffle((item[0].items || []).map((_, i) => i)) : [];
    this.render(true);
    if (S.profile.settings.tts) this.speakCur();
  },
  typeable(c, f) { return ['basic', 'cloze', 'occlusion'].includes(c.type) && !!f.expected; },
  miniBox() {
    const m = maturity(this.scope.filter(Boolean).flatMap(d => d.cards));
    return `<div class="mini-box" id="miniBox" aria-hidden="true">${COMP.map(k => `<div class="mini-comp" data-c="${k}" style="--c:${ST_COLORS[k]}">${m[k]}</div>`).join('')}</div>`;
  },
  render(enter = false) {
    const [c, d] = this.cur; const f = cardFaces(c, { choice: this.choice, order: this.order, pool: this.pool });
    const cnt = this.counts(); const kind = c.srs.state === 0 ? 'n' : c.srs.state === 2 ? 'r' : 'l';
    const done = this.stats.n; const prog = done / Math.max(1, done + this.queue.length + this.learn.length + 1);
    const leech = (c.srs.lapses || 0) >= 4;
    const typeable = this.typeable(c, f);
    const showInput = this.mode === 'type' && typeable && !this.flipped;
    const amb = S.profile.settings.ambient;
    $('#study').innerHTML = `
      <div class="st-top">
        <button class="icon-btn" data-act="st-close" aria-label="Quitter la séance">${icon('x')}</button>
        <div class="st-title"><b>${esc(this.deckName)}</b>
          <div class="st-counts tnum"><span style="color:var(--st-n)" class="${kind === 'n' ? 'cur' : ''}">Nouv. ${cnt.n + (kind === 'n' ? 1 : 0)}</span><span style="color:var(--st-l)" class="${kind === 'l' ? 'cur' : ''}">En cours ${cnt.l + (kind === 'l' ? 1 : 0)}</span><span style="color:var(--st-m)" class="${kind === 'r' ? 'cur' : ''}">À revoir ${cnt.r + (kind === 'r' ? 1 : 0)}</span></div></div>
        <div class="st-tools">
          ${typeable ? `<div class="seg" role="group" aria-label="Façon de répondre"><button class="${this.mode === 'flip' ? 'on' : ''}" data-act="st-mode" data-m="flip" data-tip="Retourner">${icon('flip', 'i-sm')}</button><button class="${this.mode === 'type' ? 'on' : ''}" data-act="st-mode" data-m="type" data-tip="Écrire la réponse">${icon('type', 'i-sm')}</button></div>` : ''}
          <button class="icon-btn ${amb !== 'off' ? 'on' : ''}" data-act="st-amb" data-tip="Ambiance : ${{ off: 'silence', library: 'bibliothèque', rain: 'pluie' }[amb]}">${icon('music')}</button>
          <button class="icon-btn" data-act="st-speak" data-tip="Lire à voix haute (T)">${icon('volume')}</button>
          <button class="icon-btn" data-act="st-undo" data-tip="Annuler la dernière note (Z)" ${this.history.length ? '' : 'disabled'}>${icon('undo')}</button>
          <button class="icon-btn" data-act="st-edit" data-tip="Modifier la fiche (E)">${icon('pen')}</button>
        </div>
      </div>
      <div class="st-prog"><i style="width:${prog * 100}%"></i></div>
      <div class="st-main">
        <div class="stage ${enter ? 'enter' : ''}" id="stage">
          <div class="card3d ${this.flipped ? 'flipped' : ''}" id="card3d">
            <div class="face front"><div class="face-head"><span>${esc(d.name)} · ${TYPE_LABEL[c.type] || 'Q/R'}${leech ? ' · <span style="color:var(--pen)">sangsue</span>' : ''}</span><span class="no">N° ${cardNo(c)}</span></div>
              <div class="face-body" id="frontBody">${f.front}</div>${!['mcq', 'tf', 'order'].includes(c.type) && !showInput ? '<div class="card-hint">Touchez pour retourner</div>' : ''}</div>
            <div class="face back"><div class="face-head"><span>Réponse · ${esc(d.name)}</span><span class="no">N° ${cardNo(c)}</span></div>
              <div class="face-body">${this.backHTML(f)}</div></div>
            <div class="swipe-tint" id="tint"></div>
          </div>
        </div>
        ${showInput ? `<form class="answer-box" id="ansForm" autocomplete="off"><input class="input" id="ans" placeholder="Votre réponse… (Entrée pour vérifier)" aria-label="Votre réponse">${Dictation.supported ? `<button type="button" class="icon-btn" id="micBtn" style="height:50px;width:50px" data-tip="Dicter la réponse">${icon('mic')}</button>` : ''}<button class="btn btn-brass" style="height:50px">${icon('check')}Vérifier</button></form>` : ''}
        <div id="verdictBox" style="display:contents">${this.verdictHTML() + this.tutorOfferHTML()}</div>
        <div id="tutorBox" style="display:contents"></div>
      </div>
      <div class="st-bottom">${this.bottomHTML(showInput)}</div>
      ${this.miniBox()}`;
    this.bindCard();
    if (showInput) setTimeout(() => $('#ans')?.focus(), 80);
    $('#ansForm')?.addEventListener('submit', e => { e.preventDefault(); this.check(); });
    $('#micBtn')?.addEventListener('click', () => this.dictate());
    requestAnimationFrame(() => $$('#study .rv').forEach(x => x.style.strokeDashoffset = x.dataset.off));
  },
  backHTML(f) {
    const v = this.verdict;
    return `${this.typed ? `<div class="your">Votre réponse : ${v && v.verdict === 'incorrect' ? `<s>${esc(this.typed)}</s>` : esc(this.typed)}</div>` : ''}${f.back}${v?.comment ? `<div class="pen pen-in">${esc(v.comment)}</div>` : ''}`;
  },
  bottomHTML(showInput) {
    const [c] = this.cur;
    if (this.flipped) {
      const prev = FSRS.preview(c.srs, Date.now(), S.profile.settings.retention);
      return `<div class="grades">${[['À revoir', 1], ['Difficile', 2], ['Acquis', 3], ['Facile', 4]].map(([l, g]) => `<button class="grade ${this.verdict && this.verdict.grade === g ? 'sugg' : ''}" data-act="st-grade" data-g="${g}"><kbd>${g}</kbd><b>${l}</b><span>${fmtIvl(prev[g - 1])}</span></button>`).join('')}</div>`;
    }
    if (c.type === 'order') return `<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><span class="muted" style="font-size:13.5px;align-self:center">Touchez les éléments dans le bon ordre.</span><button class="btn btn-ghost btn-sm" data-act="st-flip">Afficher la réponse</button></div>`;
    if (['mcq', 'tf'].includes(c.type)) return `<div class="muted" style="text-align:center;font-size:13.5px">Choisissez une réponse sur la fiche${c.type === 'mcq' ? ' (touches A à D)' : ' (V ou F)'}.</div>`;
    if (showInput) return `<button class="btn btn-ghost reveal" data-act="st-flip">Je ne sais pas — afficher la réponse</button>`;
    return `<button class="btn btn-brass btn-lg reveal" data-act="st-flip">Retourner la fiche <kbd>Espace</kbd></button>`;
  },
  tutorOfferHTML() {
    if (!AI.on || !this.flipped || this.verdict || !this.cur) return '';
    const [c] = this.cur;
    if (!((this.fails[c.id] || 0) >= 1 || (c.srs.lapses || 0) >= 4)) return '';
    return `<div class="verdict">${icon('bulb', 'i-lg')}<div style="flex:1;min-width:0"><b>Cette fiche vous résiste</b><small>Le prof virtuel peut l'expliquer autrement, avec une analogie.</small></div><button class="btn btn-sm" data-act="st-tutor">${icon('sparkles', 'i-sm')}Expliquer</button></div>`;
  },
  verdictHTML() {
    const v = this.verdict; if (!v) return '';
    if (v.pending) return `<div class="verdict"><span class="thinking"><i></i><i></i><i></i></span><div><b>L'IA relit votre réponse…</b><small>Correction ${STRICT[S.profile.settings.strict].label.toLowerCase()} · synonymes acceptés</small></div></div>`;
    const col = v.verdict === 'correct' ? 'var(--good)' : v.verdict === 'partiel' ? 'var(--hard)' : 'var(--again)';
    const label = v.verdict === 'correct' ? (v.score >= 97 ? 'Parfait' : 'Correct') : v.verdict === 'partiel' ? 'Presque' : 'Pas tout à fait';
    return `<div class="verdict" style="border-color:color-mix(in srgb,${col} 50%,transparent)">
      ${ring(v.score / 100, 56, 5, v.score + '%').replace('class="rv"', `class="rv" style="stroke:${col}"`)}
      <div style="flex:1;min-width:0"><b style="color:${col}">${label}</b><small>${v.ai ? icon('sparkles', 'i-sm') + 'Correction IA · ' : 'Vérification locale · '}${STRICT[S.profile.settings.strict].label}${v.note ? ' · ' + esc(v.note) : ''}</small>
      ${v.missing?.length ? `<div class="chips">${v.missing.map(x => `<span class="chip" style="font-size:12px">manque : ${esc(x)}</span>`).join('')}</div>` : ''}</div>
      ${v.verdict !== 'correct' && AI.on ? `<button class="btn btn-sm" data-act="st-tutor">${icon('bulb', 'i-sm')}Expliquer</button>` : ''}
    </div>`;
  },
  // Après le retournement : on met à jour le verso et les boutons sans recréer la fiche (l'animation continue).
  patch() {
    if (!this.cur) return;
    const f = cardFaces(this.cur[0], { choice: this.choice, order: this.order, pool: this.pool });
    const back = $('#card3d .back .face-body'); if (back) back.innerHTML = this.backHTML(f);
    const vb = $('#verdictBox'); if (vb) vb.innerHTML = this.verdictHTML() + this.tutorOfferHTML();
    const bt = $('#study .st-bottom'); if (bt) bt.innerHTML = this.bottomHTML(false);
    $('#ansForm')?.remove(); $('#card3d .card-hint')?.remove();
    requestAnimationFrame(() => $$('#verdictBox .rv').forEach(x => x.style.strokeDashoffset = x.dataset.off));
  },
  bindCard() {
    const stage = $('#stage'), card = $('#card3d'); if (!stage || !card) return;
    stage.addEventListener('pointermove', e => {
      if (card.classList.contains('dragging') || REDUCED || this.busy) return;
      const r = card.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      card.style.setProperty('--rx', ((.5 - py) * 7).toFixed(2) + 'deg'); card.style.setProperty('--ry', ((px - .5) * 9).toFixed(2) + 'deg');
      card.querySelectorAll('.face').forEach(fc => { fc.style.setProperty('--hx', (this.flipped ? 100 - px * 100 : px * 100) + '%'); fc.style.setProperty('--hy', py * 100 + '%'); });
    });
    stage.addEventListener('pointerleave', () => { card.style.setProperty('--rx', '0deg'); card.style.setProperty('--ry', '0deg'); });
    // Glisser : droite = Acquis, gauche = À revoir (une fois la fiche retournée).
    let sx = null, sy = 0, moved = false;
    card.addEventListener('pointerdown', e => { if (e.target.closest('button,input,a')) return; sx = e.clientX; sy = e.clientY; moved = false; });
    card.addEventListener('pointermove', e => {
      if (sx === null || !this.flipped || this.busy) return;
      const dx = e.clientX - sx; if (Math.abs(dx) < 8 && !moved) return;
      if (!moved && Math.abs(e.clientY - sy) > Math.abs(dx)) { sx = null; return; }
      moved = true; card.classList.add('dragging'); card.setPointerCapture?.(e.pointerId);
      card.style.setProperty('--dx', dx + 'px'); card.style.setProperty('--rz', (dx / 28).toFixed(2) + 'deg');
      const t = $('#tint'); t.style.opacity = Math.min(.5, Math.abs(dx) / 260); t.style.background = dx > 0 ? '#1F7A52' : '#B8352A';
    });
    const end = e => {
      if (sx === null) return;
      const dx = e.clientX - sx; sx = null;
      if (moved) {
        card.classList.remove('dragging'); card.style.setProperty('--dx', '0px'); card.style.setProperty('--rz', '0deg'); $('#tint').style.opacity = 0;
        if (Math.abs(dx) > 110) this.grade(dx > 0 ? 3 : 1);
        return;
      }
      if (!this.flipped && !e.target.closest('button,input') && !['mcq', 'tf', 'order'].includes(this.cur[0].type) && !(this.mode === 'type' && $('#ans'))) this.flip();
    };
    card.addEventListener('pointerup', end); card.addEventListener('pointercancel', () => { sx = null; card.classList.remove('dragging'); });
  },
  flip() {
    if (this.flipped || !this.cur) return;
    this.flipped = true; Sound.play('flip'); haptic(8); Dictation.stop();
    $('#card3d')?.classList.add('flipped');
    this.patch();
  },
  choose(i) {
    const [c] = this.cur; if (this.flipped) return;
    this.choice = i;
    const isRight = bi => c.type === 'tf' ? (bi === 1) === !!c.answer : bi === c.answer;
    $$('#card3d .front .opt').forEach(b => { const bi = +b.dataset.i; if (isRight(bi)) b.classList.add('right'); else if (bi === i) b.classList.add('wrong'); });
    const right = isRight(i);
    this.verdict = { score: right ? 100 : 0, verdict: right ? 'correct' : 'incorrect', grade: right ? 3 : 1, ai: false, missing: [], comment: '', note: right ? 'bonne réponse' : 'mauvaise réponse' };
    Sound.play(right ? 'good' : 'again'); haptic(right ? 10 : 30);
    setTimeout(() => this.flip(), 650);
  },
  orderPick(i) {
    const [c] = this.cur; if (this.flipped || this.order.includes(i)) return;
    this.order.push(i); Sound.play('flip');
    const body = $('#frontBody'); if (body) body.innerHTML = cardFaces(c, { order: this.order, pool: this.pool }).front;
    if (this.order.length === (c.items || []).length) {
      const n = this.order.length, ok = this.order.filter((v, k) => v === k).length, score = Math.round(ok / n * 100);
      this.verdict = { score, verdict: ok === n ? 'correct' : score >= 50 ? 'partiel' : 'incorrect', grade: ok === n ? 3 : score >= 50 ? 2 : 1, ai: false, missing: [], comment: '', note: `${ok} / ${n} à la bonne place` };
      Sound.play(ok === n ? 'good' : 'again');
      setTimeout(() => this.flip(), 500);
    }
  },
  dictate() {
    const btn = $('#micBtn'), inp = $('#ans'); if (!btn || !inp) return;
    if (Dictation.rec) { Dictation.stop(); return; }
    const [c, d] = this.cur; const lang = c.dir === 'en→fr' ? 'fr-FR' : c.dir === 'fr→en' ? 'en-US' : TTS_LANG[d.lang] || 'fr-FR';
    btn.classList.add('on');
    Dictation.start(lang, (t, fin) => { inp.value = t; if (fin) { Dictation.stop(); btn.classList.remove('on'); this.check(); } }, err => {
      btn.classList.remove('on'); Dictation.rec = null;
      if (err && !Dictation.supported) { btn.remove(); toast("Le micro n'est pas accessible ici : écrivez votre réponse.", 'mic'); }
    });
  },
  async check() {
    const inp = $('#ans'); if (!inp || this.flipped) return;
    const ans = inp.value.trim(); if (!ans) { this.flip(); return; }
    Dictation.stop();
    const [c] = this.cur; const f = cardFaces(c); this.typed = ans;
    const strict = S.profile.settings.strict;
    const local = localGrade(ans, f.expected, strict);
    if (!AI.on || local.score >= 97) { this.verdict = { ...local, note: AI.on ? 'correspondance exacte' : '' }; return this.afterCheck(); }
    this.verdict = { pending: true };
    $('#verdictBox').innerHTML = this.verdictHTML(); inp.disabled = true;
    const card = this.cur; this.ctl?.abort(); this.ctl = new AbortController();
    try {
      const r = await aiGrade(f.question, f.expected, ans, strict);
      if (this.cur !== card) return;
      this.verdict = r;
    } catch (e) {
      if (this.cur !== card || e?.code === 'cancelled') return;
      this.verdict = { ...local, note: AI.fail(e) ? 'IA indisponible' : '' };
    }
    this.afterCheck();
  },
  afterCheck() {
    const v = this.verdict;
    Sound.play(v.verdict === 'correct' ? 'good' : v.verdict === 'partiel' ? 'hard' : 'again');
    this.flip();
  },
  grade(g) {
    if (!this.cur || !this.flipped || this.busy) return;
    this.busy = true;
    const [c, d] = this.cur; const now = Date.now();
    const before = JSON.parse(JSON.stringify(c.srs)); const wasNew = c.srs.state === 0;
    const logBefore = JSON.parse(JSON.stringify(S.profile.log[dayKey()] || null)); const xpBefore = S.profile.xp, flagsBefore = { ...S.profile.flags };
    c.srs = FSRS.schedule(c.srs, g, now, S.profile.settings.retention);
    if (g === 1) { this.fails[c.id] = (this.fails[c.id] || 0) + 1; if ((c.srs.lapses || 0) >= 4 && !c.tags.includes('sangsue')) c.tags.push('sangsue'); }
    const xp = logReview(g, now - this.t0, wasNew);
    this.stats.n++; this.stats.g[g]++; if (g >= 2) this.stats.ok++; this.stats.xp += xp;
    this.history.push({ item: this.cur, before, logBefore, xpBefore, flagsBefore, g, queue: this.queue.slice(), learn: this.learn.slice() });
    if (c.srs.due - now < 60 * MIN) this.learn.push({ item: this.cur, due: c.srs.due });
    Store.touchDeck(d); Store.touch('profile');
    haptic(g === 1 ? 25 : 12);
    const tok = ++this.tok, alive = () => tok === this.tok && this.active;
    const fast = REDUCED || S.profile.settings.anim === 'fast';
    const comp = compOf(c);
    if (fast) { Sound.play(['', 'again', 'hard', 'good', 'easy'][g]); const st = $('#stage'); if (st) { st.style.transition = 'opacity .18s'; st.style.opacity = 0; } setTimeout(() => alive() && this.next(), 180); return; }
    // 1. Le tampon s'abat sur la fiche.
    $('#card3d .back')?.insertAdjacentHTML('beforeend', `<div class="stampmark">${stampSVG(GRADE_STAMP[g], INK[g])}</div>`);
    Sound.play('stamp');
    // 2. La fiche s'envole vers son compartiment de la boîte.
    setTimeout(() => {
      if (!alive()) return;
      if (g >= 3) Sound.play(g === 4 ? 'easy' : 'good');
      const stage = $('#stage'), target = $(`#miniBox [data-c="${comp}"]`);
      if (!stage) return this.next();
      const a = stage.querySelector('.card3d').getBoundingClientRect();
      stage.style.transition = 'transform .6s cubic-bezier(.55,0,.2,1), opacity .6s';
      if (target && target.offsetParent) {
        const b = target.getBoundingClientRect();
        const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
        stage.style.transform = `translate(${dx}px, ${dy}px) scale(${Math.max(.04, b.width / a.width)}) rotate(${g === 1 ? -14 : 10}deg)`; stage.style.opacity = .2;
        setTimeout(() => { if (!alive()) return; target.textContent = +target.textContent + 1; target.classList.remove('bump'); void target.offsetWidth; target.classList.add('bump'); }, 520);
      } else { stage.style.transform = `translateX(${g === 1 ? -60 : 60}vw) rotate(${g === 1 ? -12 : 12}deg)`; stage.style.opacity = 0; }
      setTimeout(() => alive() && this.next(), 600);
    }, 430);
  },
  skip() { if (this.busy) { this.tok++; this.next(); } },
  undo() {
    const h = this.history.pop(); if (!h) return;
    const [c, d] = h.item;
    c.srs = h.before; S.profile.xp = h.xpBefore; S.profile.flags = h.flagsBefore;
    if (h.logBefore) S.profile.log[dayKey()] = h.logBefore; else delete S.profile.log[dayKey()];
    this.stats.n--; this.stats.g[h.g]--; if (h.g >= 2) this.stats.ok--;
    this.queue = h.queue; this.learn = h.learn; this.busy = false; this.tok++;
    this.cur = h.item; this.flipped = false; this.choice = null; this.verdict = null; this.typed = ''; this.t0 = Date.now();
    this.order = []; this.pool = c.type === 'order' ? shuffle((c.items || []).map((_, i) => i)) : [];
    Store.touchDeck(d); Store.touch('profile');
    this.render(true); toast('Dernière note annulée', 'undo');
  },
  async tutor() {
    const [c] = this.cur; const f = cardFaces(c);
    const box = $('#tutorBox'); if (!box || !AI.on) return;
    box.innerHTML = `<div class="tutor"><div class="tutor-h">${icon('bulb', 'i-sm')}Prof virtuel</div><p id="tutorTxt"><span class="thinking"><i></i><i></i><i></i></span></p></div>`;
    this.tutorCtl?.abort(); this.tutorCtl = new AbortController(); const card = this.cur;
    S.profile.flags.curious = 1;
    const prompt = `Tu es un professeur particulier chaleureux. Un élève révise une flashcard et bute dessus.
Question : ${plain(f.question)}
Bonne réponse : ${plain(f.expected)}${this.typed ? `\nSa réponse : ${this.typed}` : ''}${c.extra ? `\nComplément : ${c.extra}` : ''}

Explique la notion autrement, en 4 phrases au maximum, avec une analogie concrète de la vie quotidienne. Termine par une ligne qui commence par « Astuce : » avec un moyen mnémotechnique court. Français simple, pas de titre, pas de liste, pas de markdown.`;
    try {
      await AI.ask(prompt, { signal: this.tutorCtl.signal, onText: ({ text }) => { if (this.cur === card) { const p = $('#tutorTxt'); if (p) p.textContent = text; } } });
    } catch (e) { const p = $('#tutorTxt'); if (p && this.cur === card) p.textContent = e?.text || AI.fail(e) || ''; }
  },
  speakCur() {
    const [c, d] = this.cur; const f = cardFaces(c);
    const lang = c.dir === 'fr→en' ? 'fr-FR' : TTS_LANG[d.lang] || 'fr-FR';
    const alang = c.dir === 'en→fr' ? 'fr-FR' : c.dir === 'fr→en' ? 'en-US' : lang;
    speak(this.flipped ? f.expected : f.question, this.flipped ? alang : lang);
  },
  refreshCard() { if (this.cur) { const [nc, nd] = findCard(this.cur[0].id); if (nc) this.cur = [nc, nd]; this.render(); } },
  act(name, el) {
    if (!this.active) return;
    if (name === 'st-close') this.stats.n ? this.summary() : this.close();
    else if (name === 'st-flip') { if (this.mode === 'type' && $('#ans')?.value.trim()) this.check(); else this.flip(); }
    else if (name === 'st-grade') this.grade(+el.dataset.g);
    else if (name === 'st-mode') { this.mode = el.dataset.m; S.profile.settings.answerMode = this.mode; Store.touch('profile'); if (!this.flipped) this.render(); }
    else if (name === 'st-amb') { const s = S.profile.settings; s.ambient = { off: 'library', library: 'rain', rain: 'off' }[s.ambient]; Ambient.set(s.ambient); Store.touch('profile'); el.classList.toggle('on', s.ambient !== 'off'); el.dataset.tip = 'Ambiance : ' + { off: 'silence', library: 'bibliothèque', rain: 'pluie' }[s.ambient]; toast('Ambiance : ' + { off: 'silence', library: 'bibliothèque', rain: 'pluie' }[s.ambient], 'music'); }
    else if (name === 'st-speak') this.speakCur();
    else if (name === 'st-undo') this.undo();
    else if (name === 'st-edit') openEditor(this.cur[0].id);
    else if (name === 'st-tutor') this.tutor();
    else if (name === 'choose') this.choose(+el.dataset.i);
    else if (name === 'orderPick') this.orderPick(+el.dataset.i);
    else if (name === 'st-again') { const items = this.lastItems, title = this.deckName; this.close(true); Study.start({ items, title }); }
    else if (name === 'st-share') shareProgress();
    else if (name === 'st-done') this.close();
  },
  key(e, typing) {
    if (!this.cur && !this.summaryOn) return;
    if (e.key === 'Escape') { e.preventDefault(); if (this.summaryOn) this.close(); else this.act('st-close'); return; }
    if (typing) return;
    const k = e.key.toLowerCase();
    if (this.summaryOn) { if (k === ' ' || k === 'enter') { e.preventDefault(); this.close(); } return; }
    if (this.busy) { if ([' ', 'enter', '1', '2', '3', '4'].includes(k)) { e.preventDefault(); this.skip(); } return; }
    const [c] = this.cur;
    if ((k === ' ' || k === 'enter') && !this.flipped) { e.preventDefault(); if (!['mcq', 'tf', 'order'].includes(c.type)) this.act('st-flip'); return; }
    if (this.flipped && ['1', '2', '3', '4'].includes(k)) { e.preventDefault(); this.grade(+k); return; }
    if (this.flipped && (k === ' ' || k === 'enter')) { e.preventDefault(); this.grade(this.verdict?.grade || 3); return; }
    if (!this.flipped && c.type === 'mcq' && k.length === 1 && 'abcd'.includes(k)) { this.choose('abcd'.indexOf(k)); return; }
    if (!this.flipped && c.type === 'tf' && (k === 'v' || k === 'f')) { this.choose(k === 'v' ? 1 : 0); return; }
    if (k === 'z') { e.preventDefault(); this.undo(); return; }
    if (k === 'e') { e.preventDefault(); openEditor(c.id); return; }
    if (k === 't') { this.speakCur(); return; }
  },
  // Fin de séance : un bordereau s'imprime, puis le tampon « séance validée ».
  summary() {
    this.summaryOn = true; this.cur = null; this.busy = false; Ambient.stop();
    const s = this.stats; const mins = Math.max(1, Math.round((Date.now() - s.t0) / 60000));
    const acc = s.n ? Math.round(s.ok / s.n * 100) : 0;
    if (s.n >= 10 && s.g[1] === 0) S.profile.flags.perfect = 1;
    const tomorrow = S.decks.flatMap(d => d.cards).filter(c => c.srs.state > 0 && c.srs.due >= endOfToday() && c.srs.due < endOfToday() + DAY).length;
    this.lastItems = [...new Map(this.history.map(h => [h.item[0].id, h.item])).values()];
    const L = level(), now = new Date();
    const ln = (k, v) => `<div class="ln"><span>${k}</span><span></span><span>${v}</span></div>`;
    const title = acc >= 90 ? 'Magistral.' : acc >= 75 ? 'Beau travail.' : acc >= 50 ? 'Ça rentre.' : 'Chaque erreur compte.';
    $('#study').innerHTML = `<div class="st-top"><span style="flex:1"></span><button class="icon-btn" data-act="st-done" aria-label="Fermer">${icon('x')}</button></div>
      <div class="receipt-wrap">
        <h1 class="display" style="font-size:clamp(34px,5vw,58px);text-align:center">${words(title)}</h1>
        <div class="slot" aria-hidden="true"></div>
        <div class="receipt">
          <h4>Engram — bordereau de séance</h4>
          <div class="c">${String(now.getDate()).padStart(2, '0')}.${String(now.getMonth() + 1).padStart(2, '0')}.${now.getFullYear()} · ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}</div>
          <div class="c">${esc(this.deckName)}</div>
          <hr>
          ${ln('Fiches révisées', s.n)}${ln('Réussite', acc + ' %')}${ln('Durée', mins + ' min')}${ln('XP gagnés', '+' + s.xp)}${ln('Série', plural(streak(), 'jour', 'jours'))}
          <hr>
          <div class="c" style="color:var(--p-ink)">À REVOIR ${s.g[1]} · DIFFICILE ${s.g[2]}<br>ACQUIS ${s.g[3]} · FACILE ${s.g[4]}</div>
          <hr>
          <div>Prochaine séance : ${tomorrow ? `demain, ${plural(tomorrow, 'fiche', 'fiches')}` : 'rien de prévu demain'}.</div>
          <div>Niveau ${L.i + 1} · ${L.name}${L.next ? ` — encore ${L.left} XP` : ''}.</div>
          <div class="stampzone"><div class="stampmark">${stampSVG('SÉANCE VALIDÉE', '#B8352A', `${String(now.getDate()).padStart(2, '0')} ${FR_MON[now.getMonth()].toUpperCase()} ${now.getFullYear()}`)}</div></div>
        </div>
        <div class="sum-actions">
          <button class="btn btn-brass btn-lg" data-act="st-done">${icon('check')}Terminer <kbd>Espace</kbd></button>
          ${this.lastItems.length ? `<button class="btn btn-lg" data-act="st-again">${icon('flip')}Revoir ces fiches</button>` : ''}
          <button class="btn btn-lg btn-ghost" data-act="st-share">${icon('share')}Partager</button>
        </div>
      </div>`;
    if (s.n) { Sound.play('print'); setTimeout(() => this.summaryOn && Sound.play('stamp'), 1550); }
    Store.touch('profile');
    setTimeout(() => checkBadges(), 1900);
    if (L.i > this.lvl0 && !S.demo) setTimeout(() => { Sound.play('seal'); toast(`Niveau ${L.i + 1} atteint : ${L.name}`, null, waxSeal({ id: 'lvl' + L.i, glyph: String(L.i + 1), color: '#7A4E14' }, 40, 'wax')); }, 2300);
  }
};

Chlorophylle : pigment vert qui capte l'énergie lumineuse.
Stomates : petits orifices des feuilles qui permettent les échanges gazeux.
Chloroplaste : organite de la cellule végétale où se déroule la photosynthèse.
La photosynthèse se déroule dans les chloroplastes des cellules des feuilles.

function localGenerate(text, n, types) {
  let lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
  const hasTitle = lines[0] && lines[0].length < 70 && !/[:.!?]$/.test(lines[0]) && lines.length > 1;
  const title = hasTitle ? lines[0] : 'Cours';
  if (hasTitle) lines = lines.slice(1);
  const flat = lines.map(l => /[.!?]$/.test(l) ? l : l + '.').join(' ');
  const sentences = flat.split(/(?<=[.!?])\s+(?=[A-ZÀ-ÖØ-Ý0-9«])/).map(s => s.trim()).filter(s => s.length > 25 && s.length < 280);
  const defs = [];
  for (const l of lines) { const m = l.match(/^[-•*\d.)\s]*([^:–—]{2,60}?)\s*[:–—]\s+(.{8,})$/); if (m) defs.push([m[1].trim(), m[2].trim().replace(/\.$/, '')]); }
  const out = { basic: [], cloze: [], mcq: [], tf: [], order: [] };
  for (const [t, d] of defs) out.basic.push({ type: 'basic', front: `Que désigne le terme « ${t} » ?`, back: cap(d) });
  for (const s of sentences) {
    if (defs.some(([t]) => s.startsWith(t))) continue;
    const m = s.match(/^(.{3,70}?)\s+(est|sont|désigne|désignent|correspond à|correspondent à|signifie|permet de|permettent de|a lieu|se déroule|fixe|produit)\s+(.{6,})$/i);
    if (m) out.basic.push({ type: 'basic', front: `${cap(m[1])} ${m[2]}… ?`, back: cap(m[3].replace(/\.$/, '')) });
  }
  for (const s of sentences) {
    const num = s.match(/\b\d{1,4}(?:[.,]\d+)?\s?(?:%|°C|km|kg|ans|siècles?)?(?=[\s.,;]|$)/);
    let target = num?.[0]?.trim();
    if (!target) { const ws = s.split(/\s+/).map(w => w.replace(/^[«"(']+|[.,;:!?)»"']+$/g, '')).filter(w => w.length >= 7 && !STOP.has(normTxt(w))); target = ws.sort((a, b) => b.length - a.length)[0]; }
    if (target && s.includes(target)) out.cloze.push({ type: 'cloze', text: s.replace(target, `{{c1::${target}}}`) });
  }
  if (defs.length >= 4) for (const [t, d] of defs) { const opts = shuffle([t, ...shuffle(defs.filter(x => x[0] !== t)).slice(0, 3).map(x => x[0])]); out.mcq.push({ type: 'mcq', front: `Quel terme correspond à : « ${d} » ?`, options: opts, answer: opts.indexOf(t) }); }
  if (defs.length >= 2) defs.forEach(([t, d], i) => { const lie = i % 2 === 1; const other = defs[(i + 1) % defs.length]; out.tf.push({ type: 'tf', front: `${cap(t)} : ${lie ? other[1] : d}.`, answer: !lie, back: lie ? `${cap(t)} : ${d}.` : '' }); });
  const pools = [...types].map(t => out[t] || []);
  const res = []; let k = 0;
  while (res.length < n && pools.some(p => p.length)) { const p = pools[k++ % pools.length]; if (p.length) res.push(p.shift()); }
  return { meta: { title, subject: '', summary: `${plural(defs.length, 'définition repérée', 'définitions repérées')} et ${plural(sentences.length, 'phrase analysée', 'phrases analysées')}, sans IA.` }, cards: res };
}

function openGame(mode, deckId) { Game.deckId = deckId || Game.deckId || ''; Game.mode = mode === 'match' ? 'match-setup' : mode === 'exam' ? 'exam-setup' : 'hub'; App.go('games'); }
const gameDecks = () => S.decks.filter(d => d.cards.some(c => ['basic', 'cloze', 'mcq', 'tf'].includes(c.type)));
function deckSelect(id) { return `<div class="field"><label for="${id}">Paquet</label><select class="select" id="${id}"><option value="">Tous les paquets</option>${gameDecks().map(d => `<option value="${d.id}" ${Game.deckId === d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select></div>`; }
Views.games = () => {
  const G = Game;
  if (G.mode === 'match-setup' || G.mode === 'match' || G.mode === 'match-done') return matchView();
  if (G.mode.startsWith('exam')) return examView();
  const best = S.profile.matchBest[''] || Object.values(S.profile.matchBest).sort((a, b) => a - b)[0];
  return `
    <header class="rise"><div class="kicker">Jeux & examens</div><h1 class="display" style="margin-top:12px">${words('Jouer, <em>pour retenir</em>.')}</h1>
      <p class="lede" style="margin-top:14px">Se tester est la façon la plus efficace d'apprendre. Les jeux ne modifient pas le calendrier de vos fiches.</p></header>
    <div class="games">
      <button class="game rise" data-act="game" data-g="match">
        <div class="art" aria-hidden="true"><span style="left:6%;top:18px;transform:rotate(-8deg)"></span><span class="g" style="left:30%;top:6px;transform:rotate(3deg)"></span><span style="left:54%;top:26px;transform:rotate(-2deg)"></span><span class="g" style="left:24%;top:48px;transform:rotate(7deg)"></span></div>
        <div class="t">Jeu des paires</div><p>Associez chaque question à sa réponse, le plus vite possible. Une erreur coûte une seconde.</p>
        <div class="meta"><span>6 paires</span><span>chronométré</span>${best ? `<span>record ${(best / 1000).toFixed(1).replace('.', ',')} s</span>` : ''}</div>
      </button>
      <button class="game rise" style="animation-delay:.06s" data-act="game" data-g="exam">
        <div class="art" aria-hidden="true"><span style="left:14%;top:4px;width:150px;height:108px;transform:rotate(-3deg);background-image:repeating-linear-gradient(180deg,transparent 0 13px,rgba(46,78,158,.18) 13px 14px)"></span><svg viewBox="0 0 120 70" style="position:absolute;left:52%;top:30px;width:110px;overflow:visible"><path d="M8,38 C8,12 108,4 114,32 C120,62 22,70 12,48 C6,36 26,18 50,14" fill="none" stroke="#C3342A" stroke-width="3" stroke-linecap="round"/><text x="60" y="44" text-anchor="middle" font-family="Caveat,cursive" font-weight="700" font-size="28" fill="#C3342A">16/20</text></svg></div>
        <div class="t">Examen blanc</div><p>Un QCM chronométré tiré de vos fiches, noté sur 20 avec mention, comme le jour J.</p>
        <div class="meta"><span>10 à 30 questions</span><span>30 s / question</span></div>
      </button>
      <button class="game rise" style="animation-delay:.12s" data-act="cram">
        <div class="art" aria-hidden="true"><span style="left:10%;top:30px;transform:rotate(-12deg)"></span><span style="left:26%;top:20px;transform:rotate(-4deg)"></span><span style="left:42%;top:12px;transform:rotate(5deg)"></span><span style="left:58%;top:6px;transform:rotate(12deg)"></span></div>
        <div class="t">Révision éclair</div><p>Les vingt fiches que vous êtes le plus près d'oublier, même si elles ne sont pas encore dues.</p>
        <div class="meta"><span>20 fiches</span><span>compte dans le calendrier</span></div>
      </button>
    </div>`;
};
/* Jeu des paires */
function matchBuild() {
  const decks = Game.deckId ? [deckById(Game.deckId)].filter(Boolean) : S.decks;
  const pool = shuffle(decks.flatMap(d => d.cards).filter(c => ['basic', 'cloze', 'mcq'].includes(c.type)).map(c => { const f = cardFaces(c); return [plain(f.question), plain(f.expected)]; }).filter(([q, a]) => q && a && q.length < 110 && a.length < 70));
  const seen = new Set(); const pairs = [];
  for (const [q, a] of pool) { const k = normTxt(a); if (seen.has(k)) continue; seen.add(k); pairs.push([q, a]); if (pairs.length === 6) break; }
  Game.tiles = shuffle(pairs.flatMap(([q, a], k) => [{ k, t: q, ans: false }, { k, t: a, ans: true }]));
  Game.sel = null; Game.found = 0; Game.penalty = 0; Game.result = null; Game.pairs = pairs.length;
}
function matchView() {
  const G = Game;
  if (G.mode === 'match-setup') return `
    <button class="btn btn-ghost btn-sm rise" style="align-self:flex-start" data-act="game" data-g="hub">${icon('back', 'i-sm')}Jeux</button>
    <header class="rise"><div class="kicker">Jeu des paires</div><h1 class="display" style="margin-top:12px">${words('Six paires, un chrono.')}</h1><p class="lede" style="margin-top:14px">Touchez une question, puis sa réponse. Chaque erreur ajoute une seconde.</p></header>
    <article class="panel rise" style="max-width:640px"><div class="form">${deckSelect('mDeck')}<button class="btn btn-brass btn-lg" data-act="match-start">${icon('play')}Distribuer les fiches</button></div></article>`;
  if (G.mode === 'match-done') {
    const r = G.result;
    return `<header class="rise" style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px">
      <div class="kicker">Jeu des paires · ${esc(r.deck)}</div>
      <div style="position:relative;display:inline-block"><div class="display tnum" style="font-size:clamp(70px,12vw,140px)">${(r.ms / 1000).toFixed(1).replace('.', ',')} s</div>${r.record ? `<div class="stampmark" style="right:-40px;top:20%;">${stampSVG('RECORD', '#B8352A')}</div>` : ''}</div>
      <p class="lede" style="margin:0">${r.errors ? plural(r.errors, 'erreur', 'erreurs') + ' (+' + r.errors + ' s)' : 'Aucune erreur'}. Record : ${(r.best / 1000).toFixed(1).replace('.', ',')} s.</p>
      <div class="hero-actions" style="justify-content:center"><button class="btn btn-brass btn-lg" data-act="match-start">${icon('flip')}Rejouer</button><button class="btn btn-lg" data-act="game" data-g="hub">Autres jeux</button></div></header>`;
  }
  return `<div style="display:flex;align-items:center;gap:14px" class="rise"><button class="icon-btn" data-act="game" data-g="match" aria-label="Arrêter">${icon('x')}</button><div style="flex:1"><div class="kicker">Jeu des paires · ${G.found} / ${G.pairs}</div></div><div class="big tnum" id="mTime">0,0 s</div></div>
    <div class="match" id="match">${G.tiles.map((t, i) => `<button class="tile ${t.ans ? 'ans' : ''}" data-tile="${i}" style="animation-delay:${i * 40}ms">${esc(t.t)}</button>`).join('')}</div>`;
}
Hooks.games = () => {
  $('#mDeck')?.addEventListener('change', e => Game.deckId = e.target.value);
  $('#xDeck2')?.addEventListener('change', e => Game.deckId = e.target.value);
  $('#exN')?.addEventListener('click', e => { const b = e.target.closest('[data-n]'); if (!b) return; Game.n = +b.dataset.n; $$('#exN button').forEach(x => x.classList.toggle('on', x === b)); });
  $('#exT')?.addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (!b) return; Game.timed = b.dataset.t === '1'; $$('#exT button').forEach(x => x.classList.toggle('on', x === b)); });
  if (Game.mode === 'match') {
    cancelAnimationFrame(Game.raf);
    const tick = () => { if (Game.mode !== 'match' || App.route.v !== 'games') return; const el = $('#mTime'); if (el) el.textContent = ((Date.now() - Game.t0 + Game.penalty) / 1000).toFixed(1).replace('.', ',') + ' s'; Game.raf = requestAnimationFrame(tick); };
    tick();
    $('#match')?.addEventListener('click', e => {
      const b = e.target.closest('[data-tile]'); if (!b || b.classList.contains('done')) return;
      const i = +b.dataset.tile, t = Game.tiles[i];
      if (Game.sel === null) { Game.sel = i; b.classList.add('sel'); Sound.play('flip'); return; }
      if (Game.sel === i) { Game.sel = null; b.classList.remove('sel'); return; }
      const a = Game.tiles[Game.sel], ea = $(`[data-tile="${Game.sel}"]`); Game.sel = null; ea?.classList.remove('sel');
      if (a.k === t.k && a.ans !== t.ans) {
        Sound.play('good'); haptic(10); b.classList.add('done'); ea?.classList.add('done'); Game.found++;
        const k = $('.kicker', $('#view')); if (k) k.textContent = `Jeu des paires · ${Game.found} / ${Game.pairs}`;
        if (Game.found === Game.pairs) setTimeout(matchFinish, 350);
      } else { Sound.play('again'); haptic(30); Game.penalty += 1000; [b, ea].forEach(x => { x?.classList.remove('bad'); void x?.offsetWidth; x?.classList.add('bad'); }); }
    });
  }
  if (Game.mode === 'exam-run' && Game.timed && Game.picked === null) examTick();
};
function matchFinish() {
  const ms = Date.now() - Game.t0 + Game.penalty, key = Game.deckId || '';
  const prev = S.profile.matchBest[key]; const record = !prev || ms < prev;
  if (record) S.profile.matchBest[key] = ms;
  if (ms < 30000 && !S.demo) S.profile.flags.match30 = 1;
  Game.result = { ms, best: Math.min(ms, prev || ms), record, errors: Game.penalty / 1000, deck: Game.deckId ? deckById(Game.deckId)?.name : 'Tous les paquets' };
  Game.mode = 'match-done'; Store.touch('profile'); cancelAnimationFrame(Game.raf);
  App.render(); Sound.play(record ? 'stamp' : 'done'); checkBadges();
}
/* Examen blanc */
function buildExam() {
  const decks = Game.deckId ? [deckById(Game.deckId)].filter(Boolean) : S.decks;
  const pool = decks.flatMap(d => d.cards.map(c => [c, d])).filter(([c]) => !['occlusion', 'order'].includes(c.type));
  const ans = pool.filter(([c]) => !['mcq', 'tf'].includes(c.type)).map(([c, d]) => [plain(cardFaces(c).expected), d]).filter(([t]) => t && t.length < 120);
  const qs = [];
  for (const [c, d] of shuffle(pool)) {
    if (qs.length >= Game.n) break;
    if (c.type === 'mcq') { qs.push({ c, d, q: c.front, opts: shuffle(c.options.map((t, i) => ({ t, ok: i === c.answer }))), expl: c.back }); continue; }
    if (c.type === 'tf') { qs.push({ c, d, q: c.front, opts: [{ t: 'Vrai', ok: !!c.answer }, { t: 'Faux', ok: !c.answer }], expl: c.back }); continue; }
    const f = cardFaces(c); const right = plain(f.expected); if (!right || right.length > 120) continue;
    // Distracteurs crédibles : même paquet d'abord, même nature (date/chiffre ou texte), longueur proche.
    const seen = new Set([normTxt(right)]); const digits = /\d/.test(right);
    const score = ([t, dd]) => (dd === d ? 0 : 1000) + (/\d/.test(t) === digits ? 0 : 200) + Math.abs(t.length - right.length);
    const others = ans.filter(([t]) => { const k = normTxt(t); if (seen.has(k)) return false; seen.add(k); return true; }).sort((a, b) => score(a) - score(b)).slice(0, 5).map(([t]) => t);
    const picks = shuffle(others).slice(0, 3); if (!picks.length) continue;
    qs.push({ c, d, q: plain(f.question), opts: shuffle([{ t: right, ok: true }, ...picks.map(t => ({ t, ok: false }))]), expl: c.extra || '' });
  }
  return qs;
}
function examView() {
  const G = Game;
  if (G.mode === 'exam-run') {
    const q = G.qs[G.i], done = G.picked !== null, ok = done && G.picked >= 0 && q.opts[G.picked].ok;
    return `<div style="display:flex;align-items:center;gap:14px" class="rise">
        <button class="icon-btn" data-act="exam-quit" aria-label="Abandonner">${icon('x')}</button>
        <div style="flex:1"><div class="kicker tnum">Question ${G.i + 1} / ${G.qs.length} · ${esc(q.d.name)}</div><div class="st-prog" style="margin:10px 0 0;max-width:none"><i style="width:${G.i / G.qs.length * 100}%"></i></div></div>
        ${G.timed ? `<div id="exTimer" style="position:relative;width:54px;height:54px">${ring(1, 54, 4)}<b class="tnum" id="exLeft" style="position:absolute;inset:0;display:grid;place-items:center;font:700 14px var(--f-type)">${G.left}</b></div>` : ''}
      </div>
      <article class="exam-paper rise">
        <div class="kick">Épreuve · ${esc(q.d.name)} · question ${G.i + 1}</div>
        <div class="q">${esc(q.q)}</div>
        ${q.opts.map((o, k) => `<button class="exam-opt ${done ? (o.ok ? 'right' : k === G.picked ? 'wrong' : '') : ''}" data-act="exam-pick" data-k="${k}" ${done ? 'disabled' : ''}><b>${'ABCD'[k]}</b><span>${esc(o.t)}</span></button>`).join('')}
        ${done ? `<div class="exam-fb ${ok ? 'ok' : ''}">${G.picked === -1 ? 'Temps écoulé.' : ok ? 'Bien vu.' : 'Non.'} ${q.expl ? esc(plain(q.expl)) : ''}</div>` : ''}
      </article>
      ${done ? `<div style="display:flex;justify-content:flex-end"><button class="btn btn-brass btn-lg" data-act="exam-next">${G.i + 1 < G.qs.length ? 'Question suivante' : 'Voir ma note'} <kbd>Entrée</kbd></button></div>` : ''}`;
  }
  if (G.mode === 'exam-result') {
    const ok = G.results.filter(r => r.ok).length, tot = G.results.length;
    const note = Math.round(ok / tot * 20 * 2) / 2;
    const mention = note >= 16 ? 'Très bien' : note >= 14 ? 'Bien' : note >= 12 ? 'Assez bien' : note >= 10 ? 'Passable' : 'Insuffisant — on retravaille';
    const errs = G.results.filter(r => !r.ok);
    return `<article class="exam-paper rise" style="text-align:center">
        <div class="kick">Résultat de l'examen blanc · ${esc(G.deckId ? deckById(G.deckId)?.name || '' : 'tous les paquets')}</div>
        <div class="note20 tnum"><svg viewBox="0 0 220 120" preserveAspectRatio="none"><path d="M18,64 C14,22 200,6 206,52 C212,98 40,116 22,82 C12,62 40,34 92,24"/></svg>${String(note).replace('.', ',')}<small style="font-size:.42em">/20</small></div>
        <div style="font:700 30px/1.2 var(--f-pen);color:var(--pen)">Mention ${mention}</div>
        <p style="margin:10px 0 0;font:400 14px var(--f-type);color:var(--p-muted)">${plural(ok, 'bonne réponse', 'bonnes réponses')} sur ${tot}.</p>
      </article>
      ${errs.length ? `<article class="panel rise"><div class="panel-h"><h3 class="h3">À retravailler</h3><span class="kicker">${plural(errs.length, 'erreur', 'erreurs')}</span></div>
        <div style="display:flex;flex-direction:column;gap:12px">${errs.map(r => `<div style="padding-top:12px;border-top:1px solid var(--hair)"><div style="font-weight:600">${esc(r.q.q)}</div><div style="font-size:14px;margin-top:4px"><span style="color:var(--good)">✓ ${esc(r.q.opts.find(o => o.ok).t)}</span>${r.pick >= 0 ? ` <span class="muted">· votre choix : ${esc(r.q.opts[r.pick].t)}</span>` : ' <span class="muted">· temps écoulé</span>'}</div></div>`).join('')}</div></article>` : ''}
      <div class="hero-actions rise" style="justify-content:center">${errs.length ? `<button class="btn btn-brass btn-lg" data-act="exam-review">${icon('flip')}Réviser mes erreurs</button>` : ''}<button class="btn btn-lg" data-act="game" data-g="exam">${icon('timer')}Nouvel examen</button></div>`;
  }
  return `
    <button class="btn btn-ghost btn-sm rise" style="align-self:flex-start" data-act="game" data-g="hub">${icon('back', 'i-sm')}Jeux</button>
    <header class="rise"><div class="kicker">Conditions d'examen</div><h1 class="display" style="margin-top:12px">${words('Examen <em>blanc</em>.')}</h1>
      <p class="lede" style="margin-top:14px">Un QCM chronométré tiré de vos fiches, noté sur 20 avec mention. Les mauvaises réponses proposées viennent de vos autres fiches : elles sont crédibles.</p></header>
    <article class="panel rise" style="max-width:720px"><div class="form">
      ${deckSelect('xDeck2')}
      <div class="two">
        <div class="field"><span class="flabel">Questions</span><div class="seg" id="exN">${[10, 20, 30].map(n => `<button class="${G.n === n ? 'on' : ''}" data-n="${n}">${n}</button>`).join('')}</div></div>
        <div class="field"><span class="flabel">Chronomètre</span><div class="seg" id="exT"><button class="${G.timed ? 'on' : ''}" data-t="1">30 s par question</button><button class="${!G.timed ? 'on' : ''}" data-t="0">Sans limite</button></div></div>
      </div>
      <button class="btn btn-brass btn-lg" data-act="exam-start" ${gameDecks().length ? '' : 'disabled'}>${icon('timer')}Retourner la copie</button>
    </div></article>`;
}
function examTick() {
  clearInterval(Game.timer);
  const t0 = Date.now(), start = Game.left;
  Game.timer = setInterval(() => {
    if (App.route.v !== 'games' || Game.mode !== 'exam-run' || Game.picked !== null) return clearInterval(Game.timer);
    Game.left = Math.max(0, start - Math.floor((Date.now() - t0) / 1000));
    const el = $('#exLeft'); if (el) el.textContent = Game.left;
    const rv = $('#exTimer .rv'); if (rv) { rv.style.strokeDashoffset = 2 * Math.PI * 25 * (1 - Game.left / Game.per); rv.style.stroke = Game.left <= 5 ? 'var(--again)' : ''; }
    if (Game.left <= 0) { clearInterval(Game.timer); examPick(-1); }
  }, 250);
}
function examPick(k) {
  if (Game.picked !== null) return;
  clearInterval(Game.timer);
  const q = Game.qs[Game.i]; Game.picked = k; const ok = k >= 0 && q.opts[k].ok;
  Game.results.push({ q, pick: k, ok });
  Sound.play(ok ? 'good' : 'again'); haptic(ok ? 10 : 30);
  App.render();
}
Object.assign(Actions, {
  'match-start': () => { matchBuild(); if (Game.pairs < 3) { toast('Pas assez de fiches courtes dans ce paquet pour jouer.', 'grid'); return; } Game.mode = 'match'; Game.t0 = Date.now(); App.render(); },
  'exam-start': () => { Game.qs = buildExam(); if (Game.qs.length < 3) { toast('Pas assez de fiches pour un examen : il en faut au moins 4.', 'timer'); return; } Object.assign(Game, { mode: 'exam-run', i: 0, picked: null, results: [], left: Game.per }); App.render(); },
  'exam-pick': el => examPick(+el.dataset.k),
  'exam-next': () => {
    if (Game.i + 1 >= Game.qs.length) {
      Game.mode = 'exam-result'; App.render(true);
      const ok = Game.results.filter(r => r.ok).length / Game.results.length;
      if (ok * 20 >= 16 && !S.demo) { S.profile.flags.exam16 = 1; Store.touch('profile'); }
      setTimeout(() => { Sound.play(ok >= .8 ? 'done' : 'print'); checkBadges(); }, 400);
      return;
    }
    Game.i++; Game.picked = null; Game.left = Game.per; App.render();
  },
  'exam-quit': () => { clearInterval(Game.timer); Game.mode = 'exam-setup'; App.render(); },
  'exam-review': () => { const items = Game.results.filter(r => !r.ok).map(r => [r.q.c, r.q.d]); Study.start({ items, title: "Erreurs de l'examen" }); }
});

/* ── Démarrage ─────────────────────────────────────────────────────── */
function boot() {
  Store.load();
  bootApp();
  App.render();
  if (!S.profile.onboarded) Onb.open();
  AI.init();
  Store.connect();
}
boot();
</script>
