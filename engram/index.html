Ligne 1 : {"title":"titre court du chapitre","subject":"matière","summary":"résumé du cours en 2 phrases"}
Puis exactement une carte par ligne, sur le modèle :
${types.map(t => ex[t]).join('\n')}${photo ? '' : `\n\nTEXTE DU COURS :\n"""\n${Scan.text.slice(0, 45000)}\n"""`}`;
}
async function runScan() {
  if (Scan.running) return;
  const photo = Scan.tab === 'photo' && Scan.files.length;
  Scan.results = []; Scan.meta = null; Scan.err = ''; Scan.local = !AI.on;
  if (!AI.on) {
    if (photo) { Scan.err = "La lecture de photos nécessite l'IA. Collez le texte du cours à la place."; App.render(); return; }
    Scan.phase = 'running'; Scan.running = true; App.render();
    const { meta, cards } = localGenerate(Scan.text, Scan.n, Scan.types);
    Scan.meta = meta; $('#scOut').innerHTML = scanOutHTML(); bindScanOut();
    for (const c of cards) { await sleep(REDUCED ? 0 : 140); addGen(c); }
    await sleep(REDUCED ? 0 : 500);
    Scan.running = false; Scan.phase = 'review';
    if (!Scan.results.length) Scan.err = 'Aucune carte trouvée : le texte doit contenir des définitions (« terme : explication »), des phrases avec « est / sont », des dates ou des chiffres.';
    App.render(); return;
  }
  Scan.phase = 'running'; Scan.running = true; App.render();
  const msgs = photo ? ['Lecture de la page…', "Déchiffrage de l'écriture…", 'Repérage des titres et des encadrés…', 'Identification des définitions et des dates…', 'Choix des mots-clés à masquer…', 'Rédaction des questions…']
    : ['Lecture du texte…', 'Repérage des notions clés…', 'Identification des définitions et des dates…', 'Choix des mots-clés à masquer…', 'Rédaction des questions…'];
  let mi = 0; clearInterval(Scan.statusTimer);
  Scan.statusTimer = setInterval(() => { if (Scan.results.length) return clearInterval(Scan.statusTimer); const st = $('#scStatus'); if (st) st.textContent = msgs[++mi % msgs.length]; }, 2600);
  Scan.ctl = new AbortController();
  let pending = '';
  const eat = line => {
    line = line.trim().replace(/^```(json)?|```$/g, '').replace(/,\s*$/, ''); if (!line || line[0] !== '{') return;
    let o; try { o = JSON.parse(line); } catch { return; }
    if (!o.type && (o.title || o.summary)) { Scan.meta = { title: String(o.title || ''), subject: String(o.subject || ''), summary: String(o.summary || '') }; const out = $('#scOut'); if (out && !out.querySelector('.panel')) { const list = $('#genList').innerHTML; out.innerHTML = scanOutHTML(); $('#genList').innerHTML = list; } return; }
    addGen(o);
  };
  try {
    const opts = { signal: Scan.ctl.signal, cache: false, onText: ({ delta }) => { const lines = (pending + delta).split('\n'); pending = lines.pop(); lines.forEach(eat); } };
    if (photo) opts.images = Scan.files.slice();
    await AI.ask(buildScanPrompt(), opts);
    eat(pending);
  } catch (e) {
    if (e?.text) { (pending + '').split('\n').forEach(eat); }
    const msg = AI.fail(e); if (msg) Scan.err = msg;
  } finally {
    clearInterval(Scan.statusTimer); Scan.running = false; Scan.phase = 'review';
    if (!Scan.results.length && !Scan.err) Scan.err = "L'IA n'a pas trouvé de contenu à transformer en cartes. Essayez une photo plus nette ou un autre passage.";
    App.render();
    if (Scan.results.length) { Neural.wave(); Sound.play('done'); }
  }
}
function commitScan() {
  const chosen = Scan.results.filter(r => r.on); if (!chosen.length) return;
  const title = Scan.meta?.title?.trim();
  const deck = Scan.dest !== 'new' && deckById(Scan.dest) ? deckById(Scan.dest) : createDeck({ name: title || 'Cours scanné du ' + new Date().toLocaleDateString('fr-FR'), desc: Scan.meta?.summary || '' });
  const tag = Scan.meta?.subject ? [normTxt(Scan.meta.subject).replace(/\s+/g, '-')] : [];
  const src = Scan.local ? 'local' : 'ia';
  const cards = chosen.flatMap(r => r.type === 'cloze' ? clozeCards(r.text, { extra: r.extra || undefined, tags: tag, src })
    : [mkCard(r.type, { front: r.front, back: r.back || '', extra: r.extra || undefined, options: r.options, answer: r.answer, tags: tag, src })]);
  cards.forEach(c => { if (c.type === 'basic') { delete c.options; delete c.answer; } });
  deck.cards.push(...cards); Store.touchDeck(deck); Store.touch('profile');
  Scan.reset(); App.go('deck', deck.id);
  toast(`${plural(cards.length, 'carte ajoutée', 'cartes ajoutées')} à « ${deck.name} »`, 'sparkles');
}

/* Génération locale (sans IA) à partir d'un texte */
function localGenerate(text, n, types) {
  const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
  const hasTitle = lines[0] && lines[0].length < 70 && !/[:.!?]$/.test(lines[0]) && lines.length > 1;
  const title = hasTitle ? lines[0] : 'Cours';
  if (hasTitle) lines.shift();
  const flat = lines.map(l => /[.!?]$/.test(l) ? l : l + '.').join(' ');
  const sentences = flat.split(/(?<=[.!?])\s+(?=[A-ZÀ-ÖØ-Ý0-9«])/).map(s => s.trim()).filter(s => s.length > 25 && s.length < 280);
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const defs = [];
  for (const l of lines) {
    const m = l.match(/^[-•*\d.)\s]*([^:–—]{2,60}?)\s*[:–—]\s+(.{8,})$/);
    if (m) defs.push([m[1].trim(), m[2].trim().replace(/\.$/, '')]);
  }
  const out = { basic: [], cloze: [], mcq: [], tf: [] };
  for (const [t, d] of defs) out.basic.push({ type: 'basic', front: `Que désigne le terme « ${t} » ?`, back: cap(d) });
  for (const s of sentences) {
    if (defs.some(([t]) => s.startsWith(t))) continue;
    const m = s.match(/^(.{3,70}?)\s+(est|sont|désigne|désignent|correspond à|correspondent à|signifie|permet de|permettent de|a lieu|se déroule)\s+(.{6,})$/i);
    if (m) out.basic.push({ type: 'basic', front: `${cap(m[1])} ${m[2]}… ?`, back: cap(m[3].replace(/\.$/, '')) });
  }
  for (const s of [...sentences, ...lines.filter(l => !defs.some(([t]) => l.startsWith(t)) && l.length > 25)]) {
    const num = s.match(/\b\d{1,4}(?:[.,]\d+)?\s?(?:%|°C|km|kg|ans|siècles?)?(?=[\s.,;]|$)/);
    let target = num?.[0]?.trim();
    if (!target) { const words = s.split(/\s+/).map(w => w.replace(/^[«"(']+|[.,;:!?)»"']+$/g, '')).filter(w => w.length >= 7 && !STOP.has(normTxt(w))); target = words.sort((a, b) => b.length - a.length)[0]; }
    if (target && s.includes(target)) out.cloze.push({ type: 'cloze', text: s.replace(target, `{{c1::${target}}}`) });
  }
  if (defs.length >= 4) {
    for (const [t, d] of defs) {
      const others = shuffle(defs.filter(x => x[0] !== t)).slice(0, 3).map(x => x[0]);
      const opts = shuffle([t, ...others]);
      out.mcq.push({ type: 'mcq', front: `Quel terme correspond à : « ${d} » ?`, options: opts, answer: opts.indexOf(t) });
    }
  }
  if (defs.length >= 2) defs.forEach(([t, d], i) => {
    const lie = Math.random() < .5; const other = defs[(i + 1) % defs.length];
    out.tf.push({ type: 'tf', front: `${cap(t)} : ${lie ? other[1] : d}.`, answer: !lie, back: lie ? `${cap(t)} : ${d}.` : '' });
  });
  const pools = [...types].map(t => out[t] || []);
  const res = []; let k = 0;
  while (res.length < n && pools.some(p => p.length)) { const p = pools[k++ % pools.length]; if (p.length) res.push(p.shift()); }
  return { meta: { title, subject: '', summary: `${plural(defs.length, 'définition repérée', 'définitions repérées')} et ${plural(sentences.length, 'phrase analysée', 'phrases analysées')}, sans IA.` }, cards: res };
}

/* ════════════════════════════════════════════════════════════════════
   EXAMEN BLANC — QCM chronométré tiré de vos cartes, noté sur 20.
   ════════════════════════════════════════════════════════════════════ */
const Exam = { phase: 'setup', deckId: '', n: 10, timed: true, qs: [], i: 0, picked: null, results: [], timer: 0, left: 0, per: 30 };
function buildExam() {
  const decks = Exam.deckId ? [deckById(Exam.deckId)].filter(Boolean) : S.decks;
  const pool = decks.flatMap(d => d.cards.map(c => [c, d])).filter(([c]) => c.type !== 'occlusion');
  const ans = pool.filter(([c]) => !['mcq', 'tf'].includes(c.type)).map(([c, d]) => [plain(cardFaces(c).expected), d]).filter(([t]) => t && t.length < 120);
  const qs = [];
  for (const [c, d] of shuffle(pool)) {
    if (qs.length >= Exam.n) break;
    if (c.type === 'mcq') { qs.push({ c, d, q: c.front, opts: shuffle(c.options.map((t, i) => ({ t, ok: i === c.answer }))), expl: c.back }); continue; }
    if (c.type === 'tf') { qs.push({ c, d, q: c.front, opts: [{ t: 'Vrai', ok: !!c.answer }, { t: 'Faux', ok: !c.answer }], expl: c.back }); continue; }
    const f = cardFaces(c); const right = plain(f.expected); if (!right || right.length > 120) continue;
    // Distracteurs crédibles : même paquet d'abord, même nature (date/chiffre ou texte), longueur proche.
    const seen = new Set([normTxt(right)]); const digits = /\d/.test(right);
    const score = ([t, dd]) => (dd === d ? 0 : 1000) + (/\d/.test(t) === digits ? 0 : 200) + Math.abs(t.length - right.length);
    const others = ans.filter(([t]) => { const k = normTxt(t); if (seen.has(k)) return false; seen.add(k); return true; })
      .sort((a, b) => score(a) - score(b)).slice(0, 5).map(([t]) => t);
    const pickd = shuffle(others).slice(0, 3); if (!pickd.length) continue;
    qs.push({ c, d, q: plain(f.question), opts: shuffle([{ t: right, ok: true }, ...pickd.map(t => ({ t, ok: false }))]), expl: c.extra || '' });
  }
  return qs;
}
Views.exam = () => {
  if (Exam.phase === 'run') {
    const q = Exam.qs[Exam.i]; const done = Exam.picked !== null;
    return `<section class="view" style="max-width:820px">
      <div style="display:flex;align-items:center;gap:14px" class="rise">
        <button class="icon-btn" data-act="exam-quit" aria-label="Abandonner">${icon('x')}</button>
        <div style="flex:1"><div class="eyebrow tnum">Question ${Exam.i + 1} / ${Exam.qs.length} · ${esc(q.d.name)}</div><div class="st-prog" style="margin:10px 0 0;max-width:none"><i style="width:${Exam.i / Exam.qs.length * 100}%"></i></div></div>
        ${Exam.timed ? `<div id="exTimer" style="position:relative;width:54px;height:54px">${ring(1, 54, 4)}<b class="tnum" id="exLeft" style="position:absolute;inset:0;display:grid;place-items:center;font:600 14px var(--f-mono)">${Exam.left}</b></div>` : ''}
      </div>
      <article class="panel rise" style="padding:30px;animation-delay:60ms"><div class="exam-q">${esc(q.q)}</div></article>
      <div class="exam-opts rise" style="animation-delay:120ms">${q.opts.map((o, k) => `<button class="exam-opt ${done ? (o.ok ? 'right' : k === Exam.picked ? 'wrong' : '') : ''}" data-act="exam-pick" data-k="${k}" ${done ? 'disabled' : ''}><b>${'ABCD'[k]}</b><span>${esc(o.t)}</span></button>`).join('')}</div>
      ${done ? `<div class="verdict" style="width:100%">${icon(q.opts[Exam.picked]?.ok ? 'check' : 'x')}<div style="flex:1"><b>${Exam.picked === -1 ? 'Temps écoulé' : q.opts[Exam.picked].ok ? 'Bonne réponse' : 'Mauvaise réponse'}</b>${q.expl ? `<small style="font-family:var(--f-body);font-size:13px">${esc(plain(q.expl))}</small>` : ''}</div><button class="btn btn-primary" data-act="exam-next">${Exam.i + 1 < Exam.qs.length ? 'Suivante' : 'Voir ma note'} <kbd>Entrée</kbd></button></div>` : ''}
    </section>`;
  }
  if (Exam.phase === 'result') {
    const ok = Exam.results.filter(r => r.ok).length, tot = Exam.results.length;
    const note = Math.round(ok / tot * 20 * 2) / 2;
    const mention = note >= 16 ? 'Très bien' : note >= 14 ? 'Bien' : note >= 12 ? 'Assez bien' : note >= 10 ? 'Passable' : 'Insuffisant — on retravaille';
    const errs = Exam.results.filter(r => !r.ok);
    return `<section class="view" style="max-width:820px">
      <header class="rise" style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px">
        <div class="eyebrow">Résultat de l'examen blanc</div>
        <div class="grade-big tnum"><span class="count" data-to="${note}" data-dec="${note % 1 ? 1 : 0}">0</span><small>/20</small></div>
        <div style="font:italic 500 26px/1.2 var(--f-display);color:var(--accent-text)">Mention ${mention}</div>
        <p class="muted" style="margin:0">${ok} bonnes réponses sur ${tot}.</p>
      </header>
      ${errs.length ? `<article class="panel rise" style="animation-delay:80ms"><div class="panel-head"><h3 class="h3">À retravailler</h3><span class="eyebrow">${plural(errs.length, 'erreur', 'erreurs')}</span></div>
        <div style="display:flex;flex-direction:column;gap:12px">${errs.map(r => `<div style="padding-top:12px;border-top:1px solid var(--line)"><div style="font-weight:600">${esc(r.q.q)}</div><div style="font-size:14px;margin-top:4px"><span style="color:var(--good)">✓ ${esc(r.q.opts.find(o => o.ok).t)}</span>${r.pick >= 0 ? ` <span class="muted">· votre choix : ${esc(r.q.opts[r.pick].t)}</span>` : ' <span class="muted">· temps écoulé</span>'}</div></div>`).join('')}</div></article>` : ''}
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center" class="rise">
        ${errs.length ? `<button class="btn btn-primary btn-xl" data-act="exam-review">${icon('flip')}Réviser mes erreurs</button>` : ''}
        <button class="btn btn-xl" data-act="exam-restart">${icon('timer')}Nouvel examen</button>
      </div>
    </section>`;
  }
  const decksWith = S.decks.filter(d => d.cards.some(c => c.type !== 'occlusion'));
  return `<section class="view" style="max-width:860px">
    <header class="rise"><div class="eyebrow">Conditions d'examen</div><h1 class="display">Examen <em>blanc</em><span class="dot">.</span></h1>
      <p class="lede">Un QCM chronométré tiré de vos propres cartes, noté sur 20 avec mention. Les mauvaises réponses proposées viennent de vos autres cartes : elles sont crédibles.</p></header>
    <article class="panel rise" style="animation-delay:60ms"><div class="form">
      <div class="field"><label for="exDeck">Paquet</label><select class="select" id="exDeck"><option value="">Tous les paquets</option>${decksWith.map(d => `<option value="${d.id}" ${Exam.deckId === d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select></div>
      <div class="opt-grid">
        <div class="field"><span class="flabel">Questions</span><div class="seg" id="exN">${[10, 20, 30].map(n => `<button class="${Exam.n === n ? 'on' : ''}" data-n="${n}">${n}</button>`).join('')}</div></div>
        <div class="field"><span class="flabel">Chronomètre</span><div class="seg" id="exT"><button class="${Exam.timed ? 'on' : ''}" data-t="1">30 s par question</button><button class="${!Exam.timed ? 'on' : ''}" data-t="0">Sans limite</button></div></div>
      </div>
      <button class="btn btn-primary btn-xl" data-act="exam-start" ${decksWith.length ? '' : 'disabled'}>${icon('timer')}Commencer l'examen</button>
    </div></article>
  </section>`;
};
Hooks.exam = () => {
  $('#exDeck')?.addEventListener('change', e => Exam.deckId = e.target.value);
  $('#exN')?.addEventListener('click', e => { const b = e.target.closest('[data-n]'); if (!b) return; Exam.n = +b.dataset.n; $$('#exN button').forEach(x => x.classList.toggle('on', x === b)); });
  $('#exT')?.addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (!b) return; Exam.timed = b.dataset.t === '1'; $$('#exT button').forEach(x => x.classList.toggle('on', x === b)); });
  if (Exam.phase === 'run' && Exam.timed && Exam.picked === null) examTick();
};
function examTick() {
  clearInterval(Exam.timer);
  const t0 = Date.now(), start = Exam.left;
  Exam.timer = setInterval(() => {
    if (App.route.v !== 'exam' || Exam.phase !== 'run' || Exam.picked !== null) return clearInterval(Exam.timer);
    Exam.left = Math.max(0, start - Math.floor((Date.now() - t0) / 1000));
    const el = $('#exLeft'); if (el) el.textContent = Exam.left;
    const rv = $('#exTimer .rv'); if (rv) { const c = 2 * Math.PI * 25; rv.style.strokeDashoffset = c * (1 - Exam.left / Exam.per); rv.style.stroke = Exam.left <= 5 ? 'var(--again)' : ''; }
    if (Exam.left <= 0) { clearInterval(Exam.timer); examPick(-1); }
  }, 250);
}
function examPick(k) {
  if (Exam.picked !== null) return;
  clearInterval(Exam.timer);
  const q = Exam.qs[Exam.i]; Exam.picked = k; const ok = k >= 0 && q.opts[k].ok;
  Exam.results.push({ q, pick: k, ok });
  Sound.play(ok ? 'good' : 'again'); haptic(ok ? 10 : 30);
  App.render();
}
Object.assign(Actions, {
  'exam-start': () => { Exam.qs = buildExam(); if (Exam.qs.length < 3) { toast('Pas assez de cartes pour un examen : il en faut au moins 4 dans ce paquet.', 'timer'); return; } Object.assign(Exam, { phase: 'run', i: 0, picked: null, results: [], left: Exam.per }); App.go('exam'); },
  'exam-pick': el => examPick(+el.dataset.k),
  'exam-next': () => { if (Exam.i + 1 >= Exam.qs.length) { Exam.phase = 'result'; App.render(true); const ok = Exam.results.filter(r => r.ok).length / Exam.results.length; if (ok >= .8) { Sound.play('done'); Neural.wave(); burst(); } return; } Exam.i++; Exam.picked = null; Exam.left = Exam.per; App.render(); },
  'exam-quit': () => { clearInterval(Exam.timer); Exam.phase = 'setup'; App.render(); },
  'exam-restart': () => { Exam.phase = 'setup'; App.render(); },
  'exam-review': () => { const items = Exam.results.filter(r => !r.ok).map(r => [r.q.c, r.q.d]); Study.start({ items, title: "Erreurs de l'examen" }); }
});
document.addEventListener('keydown', e => {
  if (App.route.v !== 'exam' || Exam.phase !== 'run' || Modal.stack.length || Study.active || /input|textarea|select/i.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (Exam.picked === null && 'abcd'.includes(k) && k.length === 1 && Exam.qs[Exam.i].opts['abcd'.indexOf(k)]) examPick('abcd'.indexOf(k));
  else if (Exam.picked !== null && (k === 'enter' || k === ' ')) { e.preventDefault(); Actions['exam-next'](); }
});

function boot() {
  Store.load();
  bootApp();
  App.render();
  Neural.init();
  AI.init();
  Store.connect();
}
boot();
