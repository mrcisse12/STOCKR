/* ── Éditeur de fiches ─────────────────────────────────────────────── */
const EDIT_TYPES = [['basic', N_('Question / réponse')], ['reverse', N_('Recto-verso')], ['cloze', N_('Texte à trous')], ['mcq', N_('QCM')], ['tf', N_('Vrai / faux')], ['order', N_('Ordre')]];
function openEditor(cardId, deckId, preset) {
  let [card, deck] = cardId ? findCard(cardId) : [null, deckById(deckId) || S.decks[0]];
  if (card && card.type === 'occlusion') return openOcclusion(deck.id, card);
  if (!deck) { openNewDeck(d => openEditor(null, d.id)); return; }
  const st = { type: card ? card.type : (preset || 'basic'), front: card?.front || '', back: card?.back || '', extra: card?.extra || '', text: card?.text || '', options: card?.options ? [...card.options] : ['', '', '', ''], answer: card?.answer ?? 0, items: (card?.items || []).join('\n'), tags: (card?.tags || []).join(', '), fimg: card?.fimg || '', bimg: card?.bimg || '' };
  const sk = side => { const id = st[side], src = id && S.images[id];
    return `<div class="sk-row">${src ? `<img class="sk-thumb ${/^ink/.test(id) ? 'sketch' : ''}" src="${src}" alt=""><button class="btn btn-ghost btn-sm" data-sk-draw="${side}">${icon('nib', 'i-sm')}${t('Redessiner')}</button><button class="btn btn-ghost btn-sm" data-sk-rm="${side}">${icon('x', 'i-sm')}${t('Retirer')}</button>` : `<button class="btn btn-ghost btn-sm" data-sk-draw="${side}">${icon('nib', 'i-sm')}${t('Ajouter un schéma dessiné')}</button>`}</div>`; };
  if (st.type === 'tf' && typeof st.answer !== 'boolean') st.answer = true;
  const m = Modal.open('<div id="edRoot"></div>', 'wide');
  const fields = () => {
    const ty = st.type;
    if (ty === 'cloze') return `<div class="field"><label for="eText">${t('Texte')}</label><textarea class="textarea" id="eText" placeholder="${esc(t("La {{c1::mitochondrie}} produit l'{{c2::ATP}}."))}">${esc(st.text)}</textarea>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn btn-sm" id="eWrap">${icon('eye', 'i-sm')}${t('Masquer la sélection')}</button><span class="muted" style="font-size:12.5px">${t('Sélectionnez un mot puis cliquez : il devient un trou. Chaque trou numéroté donne une fiche.')}</span></div></div>
      <div class="field"><label for="eExtra">${t('Complément (facultatif)')}</label><input class="input" id="eExtra" value="${esc(st.extra)}"></div>`;
    if (ty === 'mcq') return `<div class="field"><label for="eFront">${t('Question')}</label><textarea class="textarea" id="eFront" style="min-height:80px">${esc(st.front)}</textarea></div>
      <div class="field"><span class="flabel">${t('Choix — cochez la bonne réponse')}</span>${st.options.map((o, i) => `<div style="display:flex;gap:8px;align-items:center"><button class="check dark ${st.answer === i ? 'on' : ''}" data-ans="${i}" aria-label="${esc(t('Bonne réponse {n}', { n: i + 1 }))}">${icon('check')}</button><input class="input" data-opt="${i}" value="${esc(o)}" placeholder="${esc(t('Choix {x}', { x: 'ABCD'[i] }))}"></div>`).join('')}</div>
      <div class="field"><label for="eBack">${t('Explication (facultatif)')}</label><input class="input" id="eBack" value="${esc(st.back)}"></div>`;
    if (ty === 'tf') return `<div class="field"><label for="eFront">${t('Affirmation')}</label><textarea class="textarea" id="eFront" style="min-height:80px">${esc(st.front)}</textarea></div>
      <div class="field"><span class="flabel">${t('Elle est…')}</span><div class="seg" id="eTF"><button class="${st.answer ? 'on' : ''}" data-v="1">${t('Vraie')}</button><button class="${!st.answer ? 'on' : ''}" data-v="0">${t('Fausse')}</button></div></div>
      <div class="field"><label for="eBack">${t('Explication (facultatif)')}</label><input class="input" id="eBack" value="${esc(st.back)}"></div>`;
    if (ty === 'order') return `<div class="field"><label for="eFront">${t('Consigne')}</label><input class="input" id="eFront" value="${esc(st.front)}" placeholder="${esc(t("Remettez dans l'ordre…"))}"></div>
      <div class="field"><label for="eItems">${t('Éléments, dans le bon ordre (un par ligne)')}</label><textarea class="textarea" id="eItems">${esc(st.items)}</textarea></div>
      <div class="field"><label for="eBack">${t('Explication (facultatif)')}</label><input class="input" id="eBack" value="${esc(st.back)}"></div>`;
    return `<div class="field"><label for="eFront">${ty === 'reverse' ? t('Recto') : t('Question')}</label><textarea class="textarea" id="eFront" style="min-height:80px" autofocus>${esc(st.front)}</textarea>${sk('fimg')}</div>
      <div class="field"><label for="eBack">${ty === 'reverse' ? t('Verso') : t('Réponse')}</label><textarea class="textarea" id="eBack" style="min-height:80px">${esc(st.back)}</textarea>${sk('bimg')}</div>
      <div class="field"><label for="eExtra">${t('Complément (facultatif)')}</label><input class="input" id="eExtra" value="${esc(st.extra)}" placeholder="${esc(t('Contexte, exemple, moyen mnémotechnique…'))}"></div>`;
  };
  const sample = () => {
    const items = st.items.split('\n').map(x => x.trim()).filter(Boolean);
    const c = { type: st.type === 'reverse' ? 'basic' : st.type, fimg: st.fimg, bimg: st.bimg, front: st.front || t('Votre question…'), back: st.back || (st.type === 'basic' || st.type === 'reverse' ? t('Votre réponse…') : ''), extra: st.extra, text: st.text || t('Votre {{c1::texte à trous}}…'), n: 1, options: st.options.map((o, i) => o || t('Choix {x}', { x: 'ABCD'[i] })), answer: st.answer, items: items.length ? items : [t('Premier'), t('Deuxième'), t('Troisième')] };
    const f = cardFaces(c);
    return `<div class="mini-card">${f.front}</div><div class="mini-card" style="min-height:130px">${f.back}</div>`;
  };
  const draw = () => {
    m.querySelector('#edRoot').innerHTML = mh(card ? t('Modifier la fiche') : t('Nouvelle fiche'), esc(deck.name)) + `
      ${card ? '' : `<div class="seg" id="eType" style="margin-bottom:18px">${EDIT_TYPES.map(([k, l]) => `<button class="${st.type === k ? 'on' : ''}" data-t="${k}">${t(l)}</button>`).join('')}</div>`}
      <div class="editor-grid"><div class="form" id="eForm">${fields()}
        <div class="field"><label for="eTags">${t('Étiquettes')}</label><input class="input" id="eTags" value="${esc(st.tags)}" placeholder="${esc(t('chapitre-3, examen'))}"></div>
        ${S.decks.length > 1 ? `<div class="field"><label for="eDeck">${t('Paquet')}</label><select class="select" id="eDeck">${S.decks.map(d => `<option value="${d.id}" ${d === deck ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select></div>` : ''}
      </div>
      <div style="display:flex;flex-direction:column;gap:12px"><div class="flabel">${t('Aperçu')}</div><div id="ePrev" style="display:flex;flex-direction:column;gap:12px">${sample()}</div>
        ${AI.on && st.type !== 'reverse' ? `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="eAI">${icon('sparkles')}${t("Améliorer avec l'IA")}</button>${card ? `<button class="btn" id="eMnemo">${icon('bulb')}${t('Moyen mnémotechnique')}</button>` : ''}</div><div class="muted" id="eAIout" style="font-size:13px"></div>` : ''}
        ${card ? `<div class="muted" style="font:400 11.5px/1.6 var(--f-type)">${t(FSRS.STATE[card.srs.state])} · ${plural(card.srs.reps, 'révision|révisions')} · ${plural(card.srs.lapses, 'oubli|oublis')}${card.srs.state ? ` · ${t('stabilité {s} j', { s: num(card.srs.s, 1) })} · ${t('difficulté {d}/10', { d: num(card.srs.d, 1) })}` : ''}</div>` : ''}
      </div></div>
      <div class="modal-f" style="justify-content:space-between">
        <div>${card ? `<button class="btn btn-sm btn-danger" id="eDel">${icon('trash', 'i-sm')}${t('Supprimer')}</button>` : ''}</div>
        <div style="display:flex;gap:8px"><button class="btn btn-ghost" data-act="close">${card ? t('Annuler') : t('Fermer')}</button><button class="btn btn-brass" id="eSave">${icon('check')}${card ? t('Enregistrer') : t('Ajouter')}</button></div>
      </div>`;
    const root = m.querySelector('#edRoot');
    root.querySelector('#eType')?.addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (!b) return; read(); st.type = b.dataset.t; if (st.type === 'tf') st.answer = true; if (st.type === 'mcq') st.answer = 0; draw(); });
    const prev = () => { root.querySelector('#ePrev').innerHTML = sample(); Ruling.scan(root.querySelector('#ePrev')); };
    requestAnimationFrame(() => Ruling.scan(root.querySelector('#ePrev')));
    root.querySelector('#eForm').addEventListener('input', () => { read(); prev(); });
    root.querySelectorAll('[data-ans]').forEach(b => b.onclick = () => { read(); st.answer = +b.dataset.ans; draw(); });
    root.querySelectorAll('[data-sk-draw]').forEach(b => b.onclick = () => {
      read(); const side = b.dataset.skDraw;
      openSketch({ title: side === 'fimg' ? t('Schéma du recto') : t('Schéma du verso'), done: im => { const id = uid('ink'); S.images[id] = im.url; Store.dirty.add('img:' + id); st[side] = id; draw(); } });
    });
    root.querySelectorAll('[data-sk-rm]').forEach(b => b.onclick = () => { read(); st[b.dataset.skRm] = ''; draw(); });
    root.querySelector('#eTF')?.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; read(); st.answer = b.dataset.v === '1'; draw(); });
    root.querySelector('#eWrap')?.addEventListener('click', () => {
      const ta = root.querySelector('#eText'); const a = ta.selectionStart, b = ta.selectionEnd; if (a === b) { ta.focus(); return; }
      const n = Math.max(0, ...[...ta.value.matchAll(/\{\{c(\d+)::/g)].map(x => +x[1])) + 1;
      ta.value = ta.value.slice(0, a) + `{{c${n}::${ta.value.slice(a, b)}}}` + ta.value.slice(b); read(); prev();
    });
    const srcTxt = () => st.type === 'cloze' ? `Cloze text (syntax {{c1::…}}): ${st.text}` : st.type === 'mcq' ? `Multiple choice. Question: ${st.front}. Options: ${st.options.join(' | ')}. Right answer: ${st.options[st.answer]}` : st.type === 'order' ? `Instruction: ${st.front}\nItems in order: ${st.items.split('\n').join(' | ')}` : `Question: ${st.front}\nAnswer: ${st.back}`;
    root.querySelector('#eAI')?.addEventListener('click', async ev => {
      read(); const btn = ev.currentTarget, out = root.querySelector('#eAIout');
      btn.disabled = true; out.innerHTML = `<span class="thinking"><i></i><i></i><i></i></span> ${t("L'IA relit votre fiche…")}`;
      const fmt = st.type === 'cloze' ? '{"text": "...", "why": "one sentence"}' : st.type === 'mcq' ? '{"front": "...", "options": ["...","...","...","..."], "answer": 0, "why": "one sentence"}' : st.type === 'order' ? '{"front": "...", "items": ["...", "..."], "why": "one sentence"}' : '{"front": "...", "back": "...", "why": "one sentence"}';
      try {
        const r = await AI.json(`You are an expert in long-term memorisation (spaced repetition). Improve this flashcard: a single idea, precise and unambiguous wording, short answer. Keep the same language and meaning as the card, invent nothing. Write "why" in ${aiLang()}.\n\n${srcTxt()}\n\nReply with only a JSON ${fmt}`, { modelTier: 'quick', cache: false });
        if (st.type === 'cloze' && r.text) st.text = String(r.text);
        else {
          if (r.front) st.front = String(r.front);
          if (r.back && !['mcq', 'order'].includes(st.type)) st.back = String(r.back);
          if (Array.isArray(r.options) && r.options.length === 4) { st.options = r.options.map(String); st.answer = clamp(+r.answer || 0, 0, 3); }
          if (Array.isArray(r.items) && r.items.length > 1) st.items = r.items.map(String).join('\n');
        }
        draw(); const o2 = root.querySelector('#eAIout'); if (o2) o2.textContent = r.why ? '✓ ' + r.why : t("✓ Fiche reformulée. Vérifiez avant d'enregistrer.");
      } catch (e) { out.textContent = AI.fail(e); btn.disabled = false; }
    });
    root.querySelector('#eMnemo')?.addEventListener('click', async ev => {
      read(); const btn = ev.currentTarget, out = root.querySelector('#eAIout');
      btn.disabled = true; out.innerHTML = `<span class="thinking"><i></i><i></i><i></i></span> ${t('Recherche d\'une image mentale…')}`;
      try {
        const r = await AI.json(`Invent ONE memorable mnemonic (vivid image, acronym, rhyme or story) to remember this flashcard. At most 30 words, written in ${aiLang()} unless the card is a language-learning card (then keep the target words as they are).\n\n${srcTxt()}\n\nReply with only {"mnemonic": "..."}`, { modelTier: 'quick', cache: false });
        if (r?.mnemonic) { st.extra = (st.extra ? st.extra + '\n' : '') + '💡 ' + String(r.mnemonic); draw(); const o2 = root.querySelector('#eAIout'); if (o2) o2.textContent = t('✓ Ajouté au complément de la fiche.'); }
      } catch (e) { out.textContent = AI.fail(e); btn.disabled = false; }
    });
    const del = root.querySelector('#eDel');
    if (del) del.onclick = () => {
      if (!del.dataset.sure) { del.dataset.sure = 1; del.innerHTML = icon('trash', 'i-sm') + t('Confirmer la suppression'); return; }
      deck.cards = deck.cards.filter(x => card.type === 'cloze' && card.note ? x.note !== card.note : x !== card);
      Store.touchDeck(deck); Modal.close(); App.render(); toast(t('Fiche supprimée'), 'trash');
    };
    root.querySelector('#eSave').onclick = save;
  };
  const read = () => {
    const f = m.querySelector('#eForm'); if (!f) return;

    if (v('eFront') !== undefined) st.front = v('eFront');

    const imgs = hasImg ? { fimg: st.fimg || undefined, bimg: st.bimg || undefined } : {};
    if (ty === 'mcq' && st.options.filter(o => o.trim()).length < 2) { toast(t('Donnez au moins deux choix.'), 'eye'); return; }
    if (ty === 'order' && items.length < 2) { toast(t('Donnez au moins deux éléments à ordonner.'), 'list'); return; }
    const base = { tags, extra: st.extra.trim() || undefined };
    if (card) {
      if (ty === 'cloze') {
        const sibs = deck.cards.filter(x => x.note && x.note === card.note);
        const kept = clozeCards(st.text, base).map(f => { const old = sibs.find(s => s.n === f.n); return old ? Object.assign(old, { text: st.text, ...base }) : { ...f, note: card.note || f.note, src: 'manuel' }; });
        deck.cards = deck.cards.filter(x => !(x.note && x.note === card.note) && x !== card);
        target.cards.push(...kept);
      } else {
        const olds = [card.fimg, card.bimg];
        Object.assign(card, { front: st.front.trim(), back: st.back.trim(), ...base, ...imgs });
        if (hasImg) { if (!card.fimg) delete card.fimg; if (!card.bimg) delete card.bimg; olds.forEach(dropSketch); }
        if (ty === 'mcq') { card.options = st.options.map(o => o.trim()).filter(Boolean); card.answer = clamp(st.answer, 0, card.options.length - 1); }
        if (ty === 'tf') card.answer = !!st.answer;
        if (ty === 'order') card.items = items;
        if (target !== deck) { deck.cards = deck.cards.filter(x => x !== card); target.cards.push(card); }
      }
      Store.touchDeck(deck); if (target !== deck) Store.touchDeck(target);
      Modal.close(); if (!Study.active) App.render(); toast(t('Fiche enregistrée'));
      if (Study.active) Study.refreshCard();
      return;
    }
    let made;
    if (ty === 'cloze') made = clozeCards(st.text, base);
    else if (ty === 'reverse') { const note = uid('n'); made = [mkCard('basic', { front: st.front.trim(), back: st.back.trim(), note, ...base, ...imgs }), mkCard('basic', { front: st.back.trim(), back: st.front.trim(), note, ...base, fimg: imgs.bimg, bimg: imgs.fimg })]; }
    else if (ty === 'mcq') { const opts = st.options.map(o => o.trim()).filter(Boolean); made = [mkCard('mcq', { front: st.front.trim(), options: opts, answer: clamp(st.answer, 0, opts.length - 1), back: st.back.trim(), ...base })]; }

    else if (ty === 'order') made = [mkCard('order', { front: st.front.trim(), items, back: st.back.trim(), ...base })];
    else made = [mkCard('basic', { front: st.front.trim(), back: st.back.trim(), ...base, ...imgs })];
    made.forEach(c => { if (!c.fimg) delete c.fimg; if (!c.bimg) delete c.bimg; });

    toast(made.length > 1 ? plural(made.length, 'fiche ajoutée|fiches ajoutées') : t('Fiche ajoutée'));
    Object.assign(st, { front: '', back: '', extra: '', text: '', options: ['', '', '', ''], items: '', answer: ty === 'tf' ? true : 0, fimg: '', bimg: '' });
    draw(); m.querySelector('#eFront, #eText')?.focus();
  };
  Modal.onClose(m, () => { if (!Study.active && ['deck', 'today', 'library'].includes(App.route.v)) App.render(); });
  draw();
}

async function compressImage(file, max = 1100) {

      out = cv.toDataURL('image/jpeg', q);

}

/* ════════════════════════════════════════════════════════════════════
   ENGRAM PRO
   · Trois formules : Découverte (gratuite), Pro, Pro Expert, et un essai
     de 14 jours où tout est inclus.
   · La formule gratuite a des quotas sur ce qui coûte de l'IA : scans,

   · Prototype : aucun paiement. Choisir une formule l'active sur l'appareil.
   ════════════════════════════════════════════════════════════════════ */
const PLANS = {
  free: { name: N_('Découverte'), sub: N_('Pour réviser chaque jour et essayer l\'IA.'), m: 0, y: 0 },
  pro: { name: 'Pro', sub: N_('Scans, corrections et assistants sans limite.'), m: 7.99, y: 79.9 },
  expert: { name: 'Pro Expert', sub: N_('Le modèle d\'IA le plus puissant, pour les concours et les longues études.'), m: 14.99, y: 149.9 }
};
const QUOTA = { scan: 3, mentor: 20, agent: 3, grade: 30 }; // par mois, sauf les corrections (par jour)
const money = v => new Intl.NumberFormat(locale(), { style: 'currency', currency: 'EUR', minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 }).format(v);
function ago(ts) {
  const s = (ts - Date.now()) / 1000, rtf = new Intl.RelativeTimeFormat(locale(), { numeric: 'auto' });
  if (s > -60) return t('à l\'instant');
  if (s > -3600) return rtf.format(Math.round(s / 60), 'minute');
  if (s > -86400) return rtf.format(Math.round(s / 3600), 'hour');

}
const Pro = {
  bill: 'year',
  get plan() { const p = S.profile.pro; if (!p || !PLANS[p.plan] || p.plan === 'free') return 'free'; if (p.until && p.until < Date.now()) return 'free'; return p.plan; },
  get on() { return this.plan !== 'free'; },
  get expert() { return this.plan === 'expert'; },
  get trial() { return this.on && !!S.profile.pro.trial; },
  get canTrial() { return !S.profile.flags.proTrial; },
  daysLeft() { const u = S.profile.pro?.until; return u ? Math.max(1, Math.ceil((u - Date.now()) / DAY)) : 0; },
  name(k = this.plan) { return t(PLANS[k].name); },
  usage() {
    const u = S.profile.usage, m = dayKey().slice(0, 7), d = dayKey();
    if (u.month !== m) Object.assign(u, { month: m, scan: 0, mentor: 0, agent: 0 });
    if (u.day !== d) Object.assign(u, { day: d, grade: 0 });
    return u;
  },
  left(kind) { return this.on ? Infinity : Math.max(0, QUOTA[kind] - (this.usage()[kind] || 0)); },
  /** Décompte une utilisation ; faux si le quota gratuit est atteint. */
  use(kind) {
    if (this.on) return true;
    const u = this.usage(); if ((u[kind] || 0) >= QUOTA[kind]) return false;
    u[kind] = (u[kind] || 0) + 1; Store.touch('profile'); return true;
  },
  start(plan, o = {}) {
    const prev = S.profile.pro || {};
    S.profile.pro = { plan, trial: !!o.trial, since: prev.plan && prev.plan !== 'free' && prev.since ? prev.since : Date.now(), until: o.trial ? Date.now() + 14 * DAY : null, billing: o.trial ? null : this.bill };
    if (o.trial) S.profile.flags.proTrial = 1;
    Store.touch('profile');
    this.welcome(!!o.trial);
  },
  stop() {
    S.profile.pro = { plan: 'free' }; S.profile.agents.autopilot = false;
    Store.touch('profile'); App.render(); toast(t('Vous êtes revenu à la formule Découverte. Rien n\'est perdu.'), 'check');
  },

/* La carte suit le doigt ou la souris : légère inclinaison, reflet de la dorure. */
function bindCardTilt(root) {
  if (REDUCED) return;
  $$('.lcard', root).forEach(c => {
    let raf = 0;
    c.addEventListener('pointermove', e => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0; const r = c.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
        c.classList.add('live');
        c.style.setProperty('--ry', ((x - .5) * 14).toFixed(2) + 'deg'); c.style.setProperty('--rx', ((.5 - y) * 10).toFixed(2) + 'deg');
        c.style.setProperty('--mx', (x * 100).toFixed(1) + '%'); c.style.setProperty('--my', (y * 100).toFixed(1) + '%');
        c.style.setProperty('--sx', (140 - x * 180).toFixed(1) + '%');
        $$('.foil', c).forEach(f => f.style.setProperty('--fx', (x * 100).toFixed(1) + '%'));
      });
    });
    c.addEventListener('pointerleave', () => { c.classList.remove('live'); ['--rx', '--ry', '--sx'].forEach(k => c.style.removeProperty(k)); $$('.foil', c).forEach(f => f.style.removeProperty('--fx')); });
  });
}

  const rep = A.report && Date.now() - A.report.at < 7 * DAY ? A.report : null;
  const status = a => {
    if (a.id === 'planner' && b) return t('Séance prête');
    if (a.id === 'chronicler' && rep) return t('Bilan prêt');
    const r = A.runs.find(x => x.id === a.id); return r ? ago(r.at) : t(a.job);
  };
  const ids = b ? b.ids.filter(id => findCard(id)[0]) : [];
  return `<section class="crew">
    ${b ? `<div class="brief rise"><div class="pen-letter"><div class="pl-h">${agentSeal(AGENT.planner, 28)}${t('Le mot du Planificateur')} · ${esc(fmtDate(b.at, { hour: '2-digit', minute: '2-digit' }))}</div>${md(b.text)}</div>
      <div class="brief-actions">${ids.length ? `<button class="btn btn-brass" data-act="briefGo">${icon('play', 'i-sm')}${t('Lancer la séance préparée')} · ${num(ids.length)}</button>` : ''}<button class="btn btn-sm btn-ghost" data-act="briefHide">${t('Masquer')}</button></div></div>` : ''}
    <div class="sec-h rise" style="padding-bottom:10px"><div><h2 class="h3" style="font:400 24px/1.1 var(--f-display)">${t('Vos assistants')}</h2></div><button class="btn btn-sm btn-ghost" data-act="go" data-v="agents">${Pro.on ? '' : `<span class="tag gilt">Pro</span>`}${t('Tout voir')}${icon('arrow', 'i-sm')}</button></div>
    <div class="crew-row rise">${AGENTS.map(a => `<button class="crew-b" data-act="agent" data-id="${a.id}">${(a.id === 'planner' && b) || (a.id === 'chronicler' && rep) ? '<i class="dot"></i>' : ''}${agentSeal(a, 48)}<b>${t(a.name)}</b><small>${esc(status(a))}</small></button>`).join('')}</div>
  </section>`;
}

/* ── Une mission : journal de bord, note, propositions ─────────────── */
class Mission {
  constructor(a, deck) { Object.assign(this, { a, deck, props: [], actions: [], snap: null, ctl: new AbortController(), applied: 0, ai: false, text: '', brief: null, rec: null }); }
  q(s) { return this.m?.querySelector(s); }
  open() {
    const a = this.a;
    this.m = Modal.open(`<div class="ms-head"><span class="ms-seal">${agentSeal(a, 60)}</span>
      <div><div class="kicker">${t('Mission')} · ${t(a.job)}</div><h2>${t(a.name)}</h2><div class="muted ms-sub" data-r="sub">${this.deck ? esc(this.deck.name) : ''}</div></div>
      <button class="icon-btn" data-act="close" aria-label="${esc(t('Fermer'))}">${icon('x')}</button></div><div data-r="main" style="display:contents"></div>`, 'mission');
    Modal.onClose(this.m, () => { this.ctl.abort(); if (this.applied && !Study.active) App.render(); });
    Sound.play('stamp');
  }
  sub(x) { const el = this.q('[data-r="sub"]'); if (el) el.textContent = x; }
  pick() {
    const decks = S.decks.filter(d => d.cards.length), main = this.q('[data-r="main"]');
    main.innerHTML = `<div style="padding:18px 24px 0" class="kicker">${t('Sur quel paquet ?')}</div><div class="ms-pick">${decks.map(d => { const lee = d.cards.filter(c => (c.srs.lapses || 0) >= 2).length; return `<button data-deck="${d.id}" style="--c:${DECK_COLORS[d.color] || DECK_COLORS.brass}"><i class="d"></i><b>${esc(d.name)}</b><small>${plural(d.cards.length, 'fiche|fiches')}${lee ? ' · ' + plural(lee, 'souvent oubliée|souvent oubliées') : ''}</small></button>`; }).join('') || `<div class="muted">${t('Aucun paquet pour le moment.')}</div>`}</div>`;
    main.onclick = e => { const b = e.target.closest('[data-deck]'); if (!b) return; this.deck = deckById(b.dataset.deck); this.sub(this.deck.name); main.onclick = null; this.go(); };
  }
  need() {
    this.sub(t('A besoin de l\'IA'));
    this.q('[data-r="main"]').innerHTML = `<div class="ms-need"><p class="lede" style="font-size:15.5px">${t('Cet assistant rédige : il a besoin de l\'IA. Ouvrez Engram dans l\'app Claude, ou branchez le serveur Engram (Réglages → IA et Mentor).')}</p><button class="btn" data-act="close">${t('Compris')}</button></div>`;
  }
  layout() {
    this.q('[data-r="main"]').innerHTML = `<div class="ms-body"><div class="ms-log-w"><div class="kicker">${t('Journal de bord')}</div><ol class="ms-log" data-r="log"></ol></div>
      <div class="ms-out"><div class="ms-letter wait" data-r="letter"><div class="ml-h">${t(this.a.note)}</div><div data-r="txt"><span class="thinking"><i></i><i></i><i></i></span></div></div><div class="ms-props" data-r="props"></div></div></div>
      <div class="ms-foot" data-r="foot"><button class="btn btn-ghost" data-r="stop">${icon('stop', 'i-sm')}${t('Arrêter')}</button></div>`;
    this.q('[data-r="stop"]').onclick = () => this.ctl.abort();
    this.q('[data-r="props"]').addEventListener('click', e => { const b = e.target.closest('[data-pact]'); if (!b) return; const i = +b.closest('.prop').dataset.p; b.dataset.pact === 'ok' ? this.apply(i) : this.skip(i); this.foot(); });
  }
  nap(ms = 380) { return sleep(REDUCED ? 0 : ms); }
  step(text, sub = '') {
    const li = document.createElement('li'); li.className = 'run';
    const d = new Date(), p2 = n => String(n).padStart(2, '0');
    li.innerHTML = `<span class="d"></span><span><span class="tx">${esc(text)}</span><small>${esc(sub)}</small></span><time>${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}</time>`;
    const log = this.q('[data-r="log"]'); log?.append(li); const w = log?.closest('.ms-log-w'); if (w && w.scrollHeight > w.clientHeight) w.scrollTop = w.scrollHeight;
    const end = (cls, s) => { li.className = cls; li.querySelector('.d').innerHTML = cls === 'done' ? icon('check') : ''; if (s != null) li.querySelector('small').textContent = s; };
    return { done: s => end('done', s), err: s => end('err', s) };
  }
  write(mdText) {
    this.text = mdText;
    const el = this.q('[data-r="txt"]'); if (!el) return;
    this.q('[data-r="letter"]').classList.remove('wait'); el.innerHTML = md(mdText);
  }
  propose(p) {
    if (p.kind === 'edit' || p.kind === 'mnemo') {
      const [c, d] = findCard(p.cardId); if (!c) return false;
      // Seuls les champs que ce type de fiche affiche : le texte pour un texte à trous, recto et verso sinon (pas de verso pour un QCM).
      const fits = k => k === 'extra' || (c.type === 'cloze' ? k === 'text' : k === 'front' || (k === 'back' && c.type !== 'mcq'));
      const ch = Object.entries(p.patch).filter(([k, v]) => v != null && String(v).trim() && String(c[k] || '').trim() !== String(v).trim() && fits(k));
      if (!ch.length) return false;
      p.patch = Object.fromEntries(ch); p.deckId = d.id;
    }
    if (p.kind === 'delete' && !p.cardIds.some(id => findCard(id)[0])) return false;
    if (p.kind === 'add' && !(p.cards || []).length) return false;
    if (p.cardId && this.props.some(x => x.cardId === p.cardId && x.kind === p.kind)) return false;
    p.state = 'open'; p.i = this.props.length; this.props.push(p);
    this.q('[data-r="props"]')?.insertAdjacentHTML('beforeend', this.propHTML(p)); this.head(); Sound.play('pop');
    return true;
  }
  propHTML(p) {
    const lab = { edit: t('Reformulation'), mnemo: t('Moyen mnémotechnique'), delete: t('Doublon'), add: t('Nouvelles fiches') }[p.kind];
    const deck = deckById(p.deckId);
    const face = c => { const f = cardFaces(c); return `<span class="lbl">${esc(plain(f.question).slice(0, 220))}</span><br>${esc(plain(f.expected || '').slice(0, 220))}${c.extra ? `<em class="ex">${esc(plain(c.extra).slice(0, 240))}</em>` : ''}`; };
    let body;
    if (p.kind === 'edit' || p.kind === 'mnemo') {
      const [c] = findCard(p.cardId); const after = { ...c, ...p.patch };
      body = `<div class="pd"><div class="pd-old"><small>${t('Avant')}</small><div class="x">${face(c)}</div></div><div class="pd-arrow">${icon('arrow')}</div><div class="pd-new"><small>${t('Après')}</small>${face(after)}</div></div>`;
    } else if (p.kind === 'delete') {
      body = `<div class="pd one"><div class="pd-old"><small>${t('À retirer')}</small><div class="x">${p.cardIds.map(id => findCard(id)[0]).filter(Boolean).map(face).join('<br>')}</div></div></div>`;
    } else {
      const ans = r => r.type === 'mcq' ? r.options?.[r.answer] : r.type === 'tf' ? (r.answer ? trueLbl() : falseLbl()) : r.back;
      body = `<div class="pd one"><div class="pd-new"><small>${plural(p.cards.length, 'fiche proposée|fiches proposées')}</small>${p.cards.map(r => `<div class="nc"><span class="lbl">${esc(plain(r.type === 'cloze' ? r.text : r.front))}</span>${r.type === 'cloze' ? '' : `<br>${esc(plain(ans(r) || ''))}`}</div>`).join('')}</div></div>`;
    }
    return `<article class="prop" data-p="${p.i}"><header><span class="tag ai">${lab}</span>${deck ? `<span class="tag">${esc(deck.name)}</span>` : ''}<span class="why">${esc(p.reason || '')}</span></header>${body}
      <footer><button class="btn btn-sm btn-ghost" data-pact="skip">${t('Ignorer')}</button><button class="btn btn-sm btn-brass" data-pact="ok">${icon('check', 'i-sm')}${t('Appliquer')}</button></footer></article>`;
  }
  head() {
    const box = this.q('[data-r="props"]'); if (!box) return;
    if (!box.querySelector('.ms-props-h')) box.insertAdjacentHTML('afterbegin', `<div class="ms-props-h"><h3 class="h3" style="font:400 22px/1.1 var(--f-display)">${t('Propositions')}</h3><span class="kicker" data-r="count"></span></div>`);
    const open = this.props.filter(p => p.state === 'open').length;
    this.q('[data-r="count"]').textContent = open ? t('{n} en attente', { n: open }) : t('Tout est traité');
  }
  apply(i) {
    const p = this.props[i]; if (!p || p.state !== 'open') return;
    const d = deckById(p.deckId); if (S.demo && d?.example) Store.leaveDemo(false);
    if (p.kind === 'add') {
      if (!d) return;
      const made = [];
      for (const r of p.cards) {
        if (r.type === 'cloze') made.push(...clozeCards(r.text, { extra: r.extra || undefined, src: 'agent' }));
        else made.push(mkCard(r.type, { front: r.front, back: r.back || '', extra: r.extra || undefined, ...(r.type === 'mcq' ? { options: r.options, answer: r.answer } : {}), ...(r.type === 'tf' ? { answer: r.answer } : {}), ...(r.type === 'order' ? { items: r.items } : {}), src: 'agent' }));
      }
      d.cards.push(...made); Store.touchDeck(d);
    } else if (p.kind === 'delete') {
      const ids = new Set(p.cardIds);
      for (const dd of S.decks) { const n = dd.cards.length; dd.cards = dd.cards.filter(c => !ids.has(c.id)); if (dd.cards.length !== n) Store.touchDeck(dd); }
    } else {
      const [c, dd] = findCard(p.cardId); if (!c) { p.state = 'skip'; return; }
      const P = p.patch;
      if (c.type === 'cloze' && P.text && /\{\{c\d+::.+?\}\}/.test(P.text)) { dd.cards.filter(x => x.note && x.note === c.note).forEach(x => x.text = P.text); c.text = P.text; }
      if (P.front) c.front = P.front;
      if (P.back != null && c.type !== 'mcq') c.back = P.back;
      if (P.extra != null) c.extra = P.extra || undefined;
      Store.touchDeck(dd);
    }
    p.state = 'done'; this.applied++;
    if (this.rec) { this.rec.applied = this.applied; Store.touch('profile'); }
    const el = this.q(`.prop[data-p="${i}"]`); if (el) { el.classList.add('done'); el.insertAdjacentHTML('beforeend', `<span class="pstamp">${stampSVG(t('APPLIQUÉ'), 'var(--good)')}</span>`); }
    Sound.play('stamp'); haptic(12); this.head();
  }
  skip(i) { const p = this.props[i]; if (!p || p.state !== 'open') return; p.state = 'skip'; this.q(`.prop[data-p="${i}"]`)?.classList.add('skip'); this.head(); }
  action(o) { if (o.kind) this.actions = this.actions.filter(x => x.kind !== o.kind); this.actions.push(o); }
  foot() {
    const f = this.q('[data-r="foot"]'); if (!f) return;
    const open = this.props.filter(p => p.state === 'open').length;
    f.innerHTML = `${this.applied ? `<button class="btn btn-ghost" data-r="undo">${icon('undo', 'i-sm')}${t('Annuler les changements')}</button>` : ''}<span class="sp"></span>
      ${open > 1 ? `<button class="btn" data-r="all">${icon('check', 'i-sm')}${t('Tout appliquer')} · ${num(open)}</button>` : ''}
      ${this.actions.map((a, k) => `<button class="btn ${a.primary ? 'btn-brass' : ''}" data-mact="${k}">${icon(a.icon || 'play', 'i-sm')}${esc(a.label)}</button>`).join('')}
      <button class="btn ${this.actions.some(a => a.primary) ? 'btn-ghost' : 'btn-brass'}" data-act="close">${t('Terminer')}</button>`;
    this.q('[data-r="all"]')?.addEventListener('click', () => { this.props.forEach(p => p.state === 'open' && this.apply(p.i)); this.foot(); });
    this.q('[data-r="undo"]')?.addEventListener('click', () => {
      Store.restore(this.snap); this.applied = 0; if (this.rec) { this.rec.applied = 0; Store.touch('profile'); }
      this.props.forEach(p => { if (p.state === 'done') { p.state = 'open'; const el = this.q(`.prop[data-p="${p.i}"]`); el?.classList.remove('done'); el?.querySelector('.pstamp')?.remove(); } });
      this.head(); this.foot(); toast(t('Changements annulés'), 'undo');
    });
    $$('[data-mact]', f).forEach(b => b.addEventListener('click', () => this.actions[+b.dataset.mact]?.run()));
  }
  async go() {
    const a = this.a;
    if (!AI.on && !a.local) return this.need();
    if (AI.on && !Pro.on && !Pro.use('agent')) {
      if (a.local) { toast(t('Missions avec l\'IA épuisées ce mois-ci : analyse locale.'), 'crown'); return this.run(false); }
      Modal.close(); return Pro.upsell('agent');
    }
    return this.run(AI.on);
  }
  async run(useAI) {
    const a = this.a; this.ai = useAI;
    this.layout(); this.snap = Store.snapshot();
    this.sub([this.deck?.name, useAI ? t('avec l\'IA') : t('analyse locale')].filter(Boolean).join(' · '));
    try {
      if (useAI) await AgentAI.run(this); else await AgentLocal[a.id](this);
    } catch (e) {
      if (e?.code === 'cancelled' || this.ctl.signal.aborted) this.step(t('Mission arrêtée')).err('');
      else {
        this.step(t('L\'IA ne répond pas')).err(AI.fail(e) || '');
        if (a.local && useAI) { this.ai = false; this.props = []; this.q('[data-r="props"]')?.replaceChildren(); await AgentLocal[a.id](this); }
      }
    }
    if (!this.text) this.write(t('Rien à signaler pour cette fois.'));
    this.step(t('Mission terminée')).done(this.props.length ? plural(this.props.length, 'proposition|propositions') : '');
    const A = S.profile.agents;
    this.rec = { id: a.id, at: Date.now(), deck: this.deck?.name || '', n: this.props.length, applied: this.applied, ai: this.ai };
    A.runs.unshift(this.rec); A.runs = A.runs.slice(0, 30);
    if (a.id === 'planner') A.brief = { day: dayKey(), at: Date.now(), text: this.text, ids: this.brief?.ids || [] };
    if (a.id === 'chronicler' && this.text) A.report = { at: Date.now(), text: this.text };
    Store.touch('profile');
    this.foot();
    if (!this.ctl.signal.aborted) Sound.play('done');
  }
}

const Agents = {
  run(id, o = {}) {
    const a = AGENT[id]; if (!a) return;
    if (Study.active) Study.close(true);
    if (Mentor.isOpen) Mentor.close();
    while (Modal.stack.length) Modal.close();
    const deck = a.deck ? deckById(o.deckId || (App.route.v === 'deck' ? App.route.arg : '')) || null : null;
    const M = new Mission(a, deck); M.open();
    if (a.deck && !deck) M.pick(); else M.go();
    return M;
  }
};

/* Démarre l'examen blanc de l'Examinateur avec des fiches choisies. */
function startExamWith(items) {
  const n0 = Game.n; Game.only = items; Game.n = Math.min(items.length, 30);
  const qs = buildExam(); Game.only = null; Game.n = n0;
  if (qs.length < 3) { toast(t('Pas assez de fiches pour un examen : il en faut au moins 4.'), 'timer'); return; }
  Object.assign(Game, { qs, mode: 'exam-run', i: 0, picked: null, results: [], left: Game.per, timed: true });
  App.go('games');
}

/* Statistiques d'une semaine (0 = les 7 derniers jours, 1 = la semaine d'avant). */
function weekStats(w = 0) {
  const o = { r: 0, ok: 0, ms: 0, n: 0, days: 0 };
  for (let k = w * 7; k < w * 7 + 7; k++) { const l = S.profile.log[dayKey(Date.now() - k * DAY)]; if (l?.r) { o.r += l.r; o.ok += l.ok; o.ms += l.ms; o.n += l.n || 0; o.days++; } }
  o.acc = o.r ? o.ok / o.r : null; o.min = Math.round(o.ms / 60000);
  return o;
}
function fragileCards(exclude = new Set(), max = 8) {
  return allCards().filter(c => c.srs.state === 2 && !c.suspended && !exclude.has(c.id)).map(c => [c, FSRS.retrievability(c.srs)]).filter(([, r]) => r < 0.9).sort((a, b) => a[1] - b[1]).slice(0, max).map(([c]) => [c, c._deck]);
}
const QWORDS = {
  fr: /^(qui|que|qu'|quoi|quel|quelle|quels|quelles|quand|où|ou se|comment|pourquoi|combien|lequel|laquelle|lesquels|lesquelles|est-ce|citez|donnez)\b/i,
  en: /^(who|what|when|where|why|how|which|is|are|do|does|did|can|name)\b/i,
  es: /^(¿)?(qué|quién|quiénes|cuándo|dónde|cómo|por qué|cuál|cuáles|cuánto|cuántos|cuántas)\b/i,
  de: /^(wer|was|wann|wo|warum|wie|welche|welcher|welches|wieviel|wie viele)\b/i,
  pt: /^(quem|que|o que|quando|onde|como|por que|porque|qual|quais|quanto|quantos|quantas)\b/i
};

/* Les analyses sans IA : rapides, gratuites, illimitées. */
const AgentLocal = {
  async planner(M) {
    const s1 = M.step(t('Lecture de votre journée')); await M.nap();
    const due = Study.build(); s1.done(plural(due.length, 'fiche prévue|fiches prévues'));
    const s2 = M.step(t('Recherche des fiches fragiles')); await M.nap();
    const fr = fragileCards(new Set(due.map(([c]) => c.id)), 8); s2.done(plural(fr.length, 'fiche fragile|fiches fragiles'));
    const s3 = M.step(t('Lecture du programme et des examens')); await M.nap();
    const x = upcomingExams()[0], adv = Plan.advice()[0]; s3.done(x ? t('« {exam} » dans {n} j', { exam: x.name, n: daysUntil(x.date) }) : t('Aucun examen prévu'));
    const items = [...due, ...fr], mins = Math.max(1, Math.round(items.length * avgSecPerCard() / 60));
    const deckCount = {}; for (const [, d] of items) deckCount[d.name] = (deckCount[d.name] || 0) + 1;
    const top = Object.entries(deckCount).sort((a, b) => b[1] - a[1])[0];
    const txt = items.length
      ? [`**${t('Aujourd\'hui : {n}, environ {m}.', { n: plural(items.length, 'fiche|fiches'), m: tp(mins, '{n} minute|{n} minutes') })}**`,
        fr.length ? t('{a} prévues, et {b} que j\'ajoute pour les consolider avant qu\'elles ne s\'effacent.', { a: num(due.length), b: plural(fr.length, 'fiche fragile|fiches fragiles') }) : t('Tout ce qui est prévu, rien de plus.'),
        x ? t('Priorité à « {deck} » : « {exam} » est dans {n} jours.', { deck: top?.[0] || '', exam: x.name, n: daysUntil(x.date) }) : top ? t('Le gros morceau : « {deck} ».', { deck: top[0] }) : '',
        adv ? adv[1] : ''].filter(Boolean).join(' ')
      : t('**Rien d\'urgent aujourd\'hui.** Profitez-en pour scanner un nouveau cours ou lancer une partie.');
    M.write(txt);
    if (items.length) M.action({ label: t('Lancer la séance préparée'), icon: 'play', primary: true, run: () => { Modal.close(); Study.start({ items, title: t('Séance du Planificateur') }); } });
    M.brief = { ids: items.map(([c]) => c.id), text: txt };
  },
  async proof(M) {
    const d = M.deck, cards = d.cards.filter(c => c.type !== 'occlusion');
    const s1 = M.step(t('Lecture du paquet')); await M.nap(); s1.done(plural(cards.length, 'fiche|fiches'));
    const s2 = M.step(t('Recherche des doublons')); await M.nap();
    const seen = new Map(); let dup = 0;
    for (const c of cards) {
      const k = normTxt(plain(cardFaces(c).question)); if (k.length < 6) continue;
      const o = seen.get(k);
      if (!o || (o.note && o.note === c.note)) { if (!o) seen.set(k, c); continue; }
      const drop = (o.srs.reps || 0) >= (c.srs.reps || 0) ? c : o;
      if (M.propose({ kind: 'delete', deckId: d.id, cardIds: [drop.id], reason: t('La même question existe déjà dans ce paquet : je garde celle qui a le plus d\'historique.') })) dup++;
      if (drop === o) seen.set(k, c);
    }
    s2.done(dup ? plural(dup, 'doublon|doublons') : t('aucun'));
    const s3 = M.step(t('Longueur des réponses')); await M.nap(); let long = 0;
    for (const c of cards.filter(c => c.type === 'basic' && c.back)) {
      const b = plain(c.back).trim(); if (b.split(/\s+/).length <= 22) continue;
      const m = b.match(/^(.+?[.!?])\s+(.+)$/s); if (!m || m[1].split(/\s+/).length < 2) continue;
      if (M.propose({ kind: 'edit', cardId: c.id, patch: { back: m[1], extra: [m[2], c.extra].filter(Boolean).join(' ') }, reason: t('Réponse trop longue pour être retenue d\'un coup : l\'essentiel au verso, le détail en complément.') })) long++;
    }
    s3.done(long ? plural(long, 'réponse à alléger|réponses à alléger') : t('rien à redire'));
    const s4 = M.step(t('Forme des questions')); await M.nap(); let q = 0;
    const re = QWORDS[d.lang] || QWORDS[LANG];
    for (const c of cards.filter(c => c.type === 'basic' && c.front && !c.flang)) {
      const f = c.front.trim(); if (/[?？]$/.test(f) || !re?.test(f)) continue;
      const fixed = d.lang === 'fr' ? f.replace(/\s*$/, ' ?') : d.lang === 'es' ? (f.startsWith('¿') ? f : '¿' + f) + '?' : f + '?';
      if (M.propose({ kind: 'edit', cardId: c.id, patch: { front: fixed }, reason: t('C\'est une question : le point d\'interrogation aide à la lire comme telle.') })) q++;
      if (q >= 6) break;
    }
    s4.done(q ? plural(q, 'question à ponctuer|questions à ponctuer') : t('rien à redire'));
    const n = M.props.length;
    M.write(n ? `**${t('J\'ai relu {n} de « {deck} ».', { n: plural(cards.length, 'fiche|fiches'), deck: d.name })}** ${t('{x} à examiner ci-dessous. Appliquez ce qui vous convient, ignorez le reste.', { x: plural(n, 'proposition|propositions') })} ${AI.on ? '' : t('Avec l\'IA, je vérifie aussi le fond : questions ambiguës, erreurs, fiches à scinder.')}`
      : `**${t('Rien à redire sur « {deck} ».', { deck: d.name })}** ${t('Pas de doublon, des réponses courtes, des questions nettes.')} ${AI.on ? '' : t('Avec l\'IA, je vérifie aussi le fond : questions ambiguës, erreurs, fiches à scinder.')}`);
  },
  async examiner(M) {
    const x = upcomingExams()[0];
    const decks = M.deck ? [M.deck] : x?.deckIds?.length ? S.decks.filter(d => x.deckIds.includes(d.id)) : S.decks;
    const s1 = M.step(t('Lecture du programme')); await M.nap(); s1.done(x ? `${x.name} · ${t('J−{n}', { n: daysUntil(x.date) })}` : t('tous les paquets'));
    const pool = decks.flatMap(d => d.cards.map(c => [c, d])).filter(([c]) => !['occlusion', 'order'].includes(c.type) && !c.suspended);
    const s2 = M.step(t('Classement des fiches par fragilité')); await M.nap();
    const now = Date.now();
    const score = ([c]) => (c.srs.state === 0 ? .45 : 1 - FSRS.retrievability(c.srs)) + Math.min(.4, (c.srs.lapses || 0) * .1) + (c.srs.last && now - c.srs.last > 14 * DAY ? .15 : 0) + Math.random() * .08;
    const ranked = pool.map(it => [it, score(it)]).sort((a, b) => b[1] - a[1]).map(([it]) => it);
    const items = ranked.slice(0, Math.min(20, ranked.length)); s2.done(plural(items.length, 'question retenue|questions retenues'));
    const weak = items.filter(([c]) => c.srs.state > 0 && FSRS.retrievability(c.srs) < .85).length;
    const s3 = M.step(t('Réglage du chronomètre')); await M.nap(); s3.done(t('{n} s par question', { n: Game.per }));
    const mins = Math.max(1, Math.round(items.length * Game.per / 60));
    M.write(items.length >= 4 ? `**${t('Examen blanc : {n}, {m} au plus.', { n: plural(items.length, 'question|questions'), m: tp(mins, '{n} minute|{n} minutes') })}** ${weak ? t('Il vise d\'abord vos {n} les plus fragiles, puis ce que vous n\'avez pas revu depuis longtemps.', { n: plural(weak, 'fiche|fiches') }) : t('Il mélange les fiches du programme que vous avez le moins revues.')} ${x ? t('Le sujet suit le programme de « {exam} ».', { exam: x.name }) : ''}` : t('Il faut au moins quatre fiches pour composer un examen blanc.'));
    if (items.length >= 4) M.action({ label: t('Commencer l\'examen blanc'), icon: 'timer', primary: true, run: () => { Modal.close(); startExamWith(items); } });
  },
  async chronicler(M) {
    const s1 = M.step(t('Lecture du carnet de la semaine')); await M.nap();
    const w = weekStats(0), p = weekStats(1); s1.done(plural(w.r, 'révision|révisions'));
    const s2 = M.step(t('Comparaison avec la semaine d\'avant')); await M.nap(); s2.done(p.r ? pct(w.r / p.r - 1) : '—');
    const s3 = M.step(t('Préparation de l\'examen')); await M.nap();
    const x = upcomingExams()[0], rd = x ? Plan.readiness(x) : null; s3.done(x ? x.name : t('Aucun examen prévu'));
    const decks = S.decks.map(d => ({ d, lee: d.cards.filter(isLeech).length, m: maturity(d.cards) })).sort((a, b) => b.lee - a.lee);
    const lines = [];
    lines.push(`**${w.r ? t('Cette semaine : {r} en {d}, {m}.', { r: plural(w.r, 'révision|révisions'), d: plural(w.days, 'jour|jours'), m: tp(w.min, '{n} minute|{n} minutes') }) : t('Cette semaine, le fichier est resté fermé.')}**`);
    if (w.r && p.r) lines.push(w.r >= p.r ? t('C\'est {p} de plus que la semaine d\'avant.', { p: pct(w.r / p.r - 1) }) : t('C\'est {p} de moins que la semaine d\'avant : rien de grave, reprenez le fil.', { p: pct(1 - w.r / p.r) }));
    if (w.acc != null) lines.push(t('Réussite : {a}{b}.', { a: pct(w.acc), b: p.acc != null ? ' ' + t('(contre {x})', { x: pct(p.acc) }) : '' }));
    if (w.n) lines.push(t('{n} découvertes.', { n: plural(w.n, 'nouvelle fiche|nouvelles fiches') }));
    if (streak()) lines.push(t('Série en cours : {n}.', { n: plural(streak(), 'jour|jours') }));
    if (rd) lines.push(t('« {exam} » dans {n} jours : prêt à {p} si vous suivez le programme.', { exam: x.name, n: daysUntil(x.date), p: pct(rd.follow) }));
    const pri = [];
    if (decks[0]?.lee) pri.push(t('Passer « {deck} » au Répétiteur : {n}.', { deck: decks[0].d.name, n: plural(decks[0].lee, 'fiche oubliée souvent|fiches oubliées souvent') }));
    if (w.days < 5) pri.push(t('Viser cinq jours sur sept, même dix minutes.'));
    for (const a of Plan.advice().filter(a => a[0] !== 'check').slice(0, 2)) if (pri.length < 3) pri.push(a[1]);
    const txt = lines.join(' ') + (pri.length ? `\n\n**${t('Trois priorités')}**\n${pri.slice(0, 3).map(x => '- ' + x).join('\n')}` : '');
    M.write(txt);
    S.profile.agents.report = { at: Date.now(), text: txt };
    M.action({ label: t('Partager ma progression'), icon: 'share', run: () => { Modal.close(); shareProgress(); } });
  }
};

function agentRules(a) {
  const st = S.profile.settings;
  return `You are "${t(a.name)}", one of the six specialised assistants of Engram, a flashcard app (FSRS spaced repetition shown as a Leitner box, AI answer grading, exams, a personalised daily programme). You work autonomously with the tools provided, then write a note to the student.
Your tone: ${TONES[st.tone]?.ai || TONES.gentle.ai}.
Flashcard quality rules: one idea per card; precise, unambiguous question; short answer (under 20 words); useful detail in "extra"; cloze cards use {{c1::…}} on the most information-rich words (1–3 gaps); multiple-choice cards have 4 plausible options and exactly one correct; write cards in the language of the deck (see each deck's lang).

Current state of the app (JSON):
${JSON.stringify(Mentor.snapshot())}`;
}
const AgentAI = {
  labels(name, i) {

    return ({
      get_deck_cards: t('Lecture des fiches') + (d ? ' · ' + d : ''), get_stats: t('Lecture des statistiques'), get_plan: t('Lecture du programme'), get_week: t('Lecture du carnet de la semaine'),
      propose_edit: t('Rédaction d\'une proposition'), propose_delete: t('Repérage d\'un doublon'), propose_new_cards: t('Rédaction de nouvelles fiches') + (d ? ' · ' + d : ''),
      prepare_session: t('Préparation de la séance'), prepare_exam: t('Composition de l\'examen blanc')
    })[name] || name;
  },
  tools(M) {
    const str = v => (v == null ? '' : String(v)).trim();
    const base = Object.fromEntries(Mentor.toolDefs({ receipt() { }, confirm: async () => false, buttons: [], after: [], changed: false }).map(x => [x.name, x]));
    const pick = ['get_stats', 'get_plan'].map(n => base[n]).filter(Boolean);
    const lim = Pro.expert ? 150 : 60;
    const own = [
      { name: 'get_deck_cards', description: `List cards of a deck (id, type, question, answer, extra, tags, memory state). filter: all | due | new | weak (lowest memory first) | leech (often forgotten). Returns at most \`limit\` cards (max ${lim}).`,
        inputSchema: { type: 'object', properties: { deck_id: { type: 'string' }, filter: { type: 'string', enum: ['all', 'due', 'new', 'weak', 'leech'] }, limit: { type: 'number' } }, required: ['deck_id'] },
        execute: i => {
          const d = deckById(str(i.deck_id)); if (!d) throw new Error('Unknown deck_id. Use a deck id from the app state.');
          let list = d.cards.filter(c => c.type !== 'occlusion'); const f = str(i.filter) || 'all';
          if (f === 'due') list = list.filter(c => isDue(c)); else if (f === 'new') list = list.filter(c => c.srs.state === 0);
          else if (f === 'leech') list = list.filter(c => (c.srs.lapses || 0) >= 2).sort((a, b) => b.srs.lapses - a.srs.lapses);
          else if (f === 'weak') list = list.filter(c => c.srs.state > 0).sort((a, b) => FSRS.retrievability(a.srs) - FSRS.retrievability(b.srs) || b.srs.lapses - a.srs.lapses);
          return { deck: d.name, lang: d.lang, total: d.cards.length, cards: list.slice(0, clamp(+i.limit || lim, 1, lim)).map(c => ({ id: c.id, type: c.type, q: plain(cardTitle(c)).slice(0, 200), a: plain(cardAnswer(c) || '').slice(0, 180), extra: c.extra ? plain(c.extra).slice(0, 160) : undefined, tags: c.tags?.length ? c.tags : undefined, state: FSRS.STATE[c.srs.state], lapses: c.srs.lapses, memory: c.srs.state === 2 ? Math.round(FSRS.retrievability(c.srs) * 100) + '%' : null })) };
        } },
      { name: 'get_week', description: 'Reviews, accuracy, minutes, new cards and active days for the last 7 days and the 7 days before, plus the current streak and deck-level leeches.', inputSchema: { type: 'object', properties: {} },
        execute: () => ({ this_week: weekStats(0), previous_week: weekStats(1), streak_days: streak(), decks: S.decks.map(d => ({ id: d.id, name: d.name, cards: d.cards.length, leeches: d.cards.filter(isLeech).length, ...maturity(d.cards) })) }) },
      { name: 'propose_edit', description: 'Propose a change to one card (only the given fields change: front and back for most cards, front only for mcq, text for cloze cards keeping the {{c1::...}} gaps, extra for any card). The student sees before/after and decides. Give a short reason in the student\'s language.',
        inputSchema: { type: 'object', properties: { card_id: { type: 'string' }, front: { type: 'string' }, back: { type: 'string' }, text: { type: 'string' }, extra: { type: 'string' }, reason: { type: 'string' } }, required: ['card_id', 'reason'] },
        execute: i => { const ok = M.propose({ kind: M.a.id === 'coach' && str(i.extra) && !str(i.front) && !str(i.back) ? 'mnemo' : 'edit', cardId: str(i.card_id), patch: { front: str(i.front) || null, back: str(i.back) || null, text: str(i.text) || null, extra: str(i.extra) || null }, reason: str(i.reason) }); if (!ok) { const c = findCard(str(i.card_id))[0]; throw new Error(!c ? 'Unknown card_id.' : c.type === 'cloze' ? 'Nothing changes: this is a cloze card, edit its "text" (keep the {{c1::...}} gaps) or "extra".' : 'Nothing changes: give a new front, back (not for mcq) or extra.'); } return 'Shown to the student.'; } },
      { name: 'propose_delete', description: 'Propose to remove duplicate cards (only true duplicates). The student decides.',
        inputSchema: { type: 'object', properties: { card_ids: { type: 'array', items: { type: 'string' } }, reason: { type: 'string' } }, required: ['card_ids', 'reason'] },
        execute: i => { const ids = (i.card_ids || []).map(str).filter(id => findCard(id)[0]); if (!ids.length) throw new Error('No matching card.'); M.propose({ kind: 'delete', deckId: findCard(ids[0])[1].id, cardIds: ids, reason: str(i.reason) }); return 'Shown to the student.'; } },
      { name: 'propose_new_cards', description: 'Propose new flashcards for a deck. Types: basic {front, back, extra?}, cloze {text with {{c1::...}}}, mcq {front, options[4], answer (index), back?}, tf {front, answer (boolean), back?}. The student decides.',
        inputSchema: { type: 'object', properties: { deck_id: { type: 'string' }, reason: { type: 'string' }, cards: { type: 'array', maxItems: 12, items: { type: 'object', properties: { type: { type: 'string', enum: ['basic', 'cloze', 'mcq', 'tf'] }, front: { type: 'string' }, back: { type: 'string' }, text: { type: 'string' }, options: { type: 'array', items: { type: 'string' } }, answer: {}, extra: { type: 'string' } }, required: ['type'] } } }, required: ['deck_id', 'cards'] },
        execute: i => { const d = deckById(str(i.deck_id)); if (!d) throw new Error('Unknown deck_id.'); const cards = (i.cards || []).map(normGen).filter(Boolean).slice(0, 12); if (!cards.length) throw new Error('No valid card.'); M.propose({ kind: 'add', deckId: d.id, cards, reason: str(i.reason) }); return { proposed: cards.length }; } },
      { name: 'prepare_session', description: 'Prepare a review session with these card ids; the student gets a button to start it.',
        inputSchema: { type: 'object', properties: { card_ids: { type: 'array', items: { type: 'string' } } }, required: ['card_ids'] },
        execute: i => { const items = (i.card_ids || []).map(id => findCard(str(id))).filter(x => x[0]); if (!items.length) throw new Error('No matching card.'); M.actions = M.actions.filter(x => x.kind !== 'session'); M.action({ kind: 'session', label: t('Lancer la séance préparée'), icon: 'play', primary: true, run: () => { Modal.close(); Study.start({ items, title: t(M.a.session || 'Séance préparée') }); } }); M.brief = { ids: items.map(([c]) => c.id) }; return { cards: items.length }; } },
      { name: 'prepare_exam', description: 'Prepare a timed mock exam (multiple choice built from these cards, 30 s per question); the student gets a button to start it.',
        inputSchema: { type: 'object', properties: { card_ids: { type: 'array', items: { type: 'string' } } }, required: ['card_ids'] },
        execute: i => { const items = (i.card_ids || []).map(id => findCard(str(id))).filter(x => x[0] && !['occlusion', 'order'].includes(x[0].type)); if (items.length < 4) throw new Error('At least 4 valid cards are needed.'); M.actions = M.actions.filter(x => x.kind !== 'exam'); M.action({ kind: 'exam', label: t('Commencer l\'examen blanc'), icon: 'timer', primary: true, run: () => { Modal.close(); startExamWith(items); } }); return { questions: Math.min(items.length, 30) }; } }
    ];
    const want = { planner: ['get_plan', 'get_stats', 'get_deck_cards', 'prepare_session'], proof: ['get_deck_cards', 'propose_edit', 'propose_delete'], coach: ['get_deck_cards', 'propose_edit', 'prepare_session'],
      librarian: ['get_deck_cards', 'propose_new_cards'], examiner: ['get_deck_cards', 'get_stats', 'prepare_exam', 'propose_new_cards'], chronicler: ['get_week', 'get_stats', 'get_plan'] }[M.a.id];
    const all = [...pick, ...own].filter(x => want.includes(x.name));
    // Chaque appel d'outil apparaît dans le journal de bord.
    return all.map(x => ({ ...x, execute: async (i, c) => {

      try {
        const out = await x.execute(i, c);
        s.done(x.name === 'get_deck_cards' && out?.cards ? plural(out.cards.length, 'fiche lue|fiches lues') : x.name === 'propose_new_cards' ? plural(out.proposed, 'fiche proposée|fiches proposées') : '');
        return out;
      } catch (e) { s.err(''); throw e; }
    } }));
  },
  async run(M) {
    const s0 = M.step(t('Lecture de l\'état de l\'app')); await M.nap(250); s0.done(plural(S.decks.length, 'paquet|paquets'));
    const x = upcomingExams()[0];
    const brief = AGENT_BRIEF[M.a.id].replace(/\{deck\}/g, M.deck?.name || '').replace(/\{id\}/g, M.deck?.id || '').replace(/\{limit\}/g, Pro.expert ? 150 : 60)
      .replace('{deckHint}', M.deck ? ` (or the deck "${M.deck.name}", deck_id ${M.deck.id})` : x ? ` ("${x.name}")` : '');

    const s = M.step(t('Lecture des fiches'));
    const d = M.deck; const lim = Pro.expert ? 150 : 60;
    const cards = (d ? d.cards : allCards()).filter(c => c.type !== 'occlusion').slice(0, lim).map(c => ({ id: c.id, type: c.type, q: plain(cardTitle(c)).slice(0, 180), a: plain(cardAnswer(c) || '').slice(0, 160), extra: c.extra ? plain(c.extra).slice(0, 120) : undefined, lapses: c.srs.lapses, memory: c.srs.state === 2 ? Math.round(FSRS.retrievability(c.srs) * 100) : null }));

    const s2 = M.step(t('Rédaction des propositions'));
    const r = await AI.json([{ role: 'user', content: input[0].content + `\n\nCards (JSON): ${JSON.stringify(cards)}\nThis week: ${JSON.stringify(weekStats(0))}; previous week: ${JSON.stringify(weekStats(1))}\n\nReply with only a JSON object: {"note": "markdown note", "edits": [{"card_id": "...", "front"?: "...", "back"?: "...", "extra"?: "...", "reason": "..."}], "duplicates": [{"card_ids": ["..."], "reason": "..."}], "new_cards": [{"type": "basic|cloze|mcq|tf", ...}], "session_card_ids": ["..."], "exam_card_ids": ["..."]}` }], { signal: M.ctl.signal, modelTier: Pro.expert ? 'complex' : 'default' });

    for (const e of (r?.duplicates || []).slice(0, 5)) await Promise.resolve(call('propose_delete', e)).catch(() => { });
    if (d && r?.new_cards?.length) await Promise.resolve(call('propose_new_cards', { deck_id: d.id, cards: r.new_cards })).catch(() => { });
    if (r?.session_card_ids?.length) await Promise.resolve(call('prepare_session', { card_ids: r.session_card_ids })).catch(() => { });
    if (r?.exam_card_ids?.length) await Promise.resolve(call('prepare_exam', { card_ids: r.exam_card_ids })).catch(() => { });
    s2.done(plural(M.props.length, 'proposition|propositions'));
    M.write(String(r?.note || ''));
  }
};

/* L'autopilote : le mot du matin (chaque jour) et le bilan (chaque lundi), à l'ouverture de l'app. */
const Autopilot = {
  busy: false,
  async check(now = false) {
    const A = S.profile.agents;
    if (!A.autopilot || !Pro.on || this.busy || !S.profile.onboarded) return;
    const today = dayKey();
    const needBrief = !A.brief || A.brief.day !== today;
    const needReport = (new Date().getDay() === 1 || now) && (!A.report || Date.now() - A.report.at > 6 * DAY);
    if (!needBrief && !needReport) return;
    this.busy = true;
    try {
      if (needBrief) {
        const M = this.ghost(AGENT.planner);
        await AgentLocal.planner(M);
        // Avec l'IA, la note du matin est réécrite par le Planificateur (sans outils : rapide et bon marché).
        if (AI.on) {
          try {
            const r = await AI.ask(`${Mentor.rules()}\n\nYou are "${t('Le Planificateur')}", Engram's planning assistant. Rewrite this morning note for the student in ${aiLang()} (at most 80 words, Markdown, warm and concrete, keep every number exactly as given, add nothing invented):\n\n${M.text}`, { modelTier: 'quick' });
            if (r?.text?.trim()) M.text = r.text.trim();
          } catch { }
        }
        A.brief = { day: today, at: Date.now(), text: M.text, ids: M.brief?.ids || [] };
        A.runs.unshift({ id: 'planner', at: Date.now(), deck: '', n: 0, ai: AI.on, auto: true }); A.runs = A.runs.slice(0, 30);
      }
      if (needReport) {
        const M = this.ghost(AGENT.chronicler);
        await AgentLocal.chronicler(M);
        A.runs.unshift({ id: 'chronicler', at: Date.now(), deck: '', n: 0, ai: false, auto: true }); A.runs = A.runs.slice(0, 30);
      }
      Store.touch('profile');
      if (!Study.active && ['today', 'agents'].includes(App.route.v)) App.render();
    } finally { this.busy = false; }
  },
  /** Une mission sans fenêtre : mêmes analyses, rien à l'écran. */
  ghost(a) { return { a, deck: null, props: [], actions: [], text: '', brief: null, nap: () => Promise.resolve(), step: () => ({ done() { }, err() { } }), write(x) { this.text = x; }, propose() { return false; }, action() { } }; }
};

/* ── Mode écoute : un podcast de révision ──────────────────────────── */
function speak(text, lang = UI_LANG_META[LANG].speech) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(plain(text)); u.lang = lang; speechSynthesis.speak(u); } catch { } }
const cardLangs = (c, d) => { const q = speechLang(c.flang || d.lang); return [q, speechLang(c.blang || c.flang || d.lang)]; };
function openListen(deckId) {
  const d = deckById(deckId); if (!d) return;
  if (!('speechSynthesis' in window)) { toast(t("La synthèse vocale n'est pas disponible sur cet appareil."), 'volume'); return; }
  const cards = shuffle(d.cards.filter(c => c.type !== 'occlusion')).slice(0, 40);
  let i = 0, playing = false, stopped = false, rate = 1;
  const m = Modal.open(mh(t('Mode écoute'), esc(d.name)) + `<div style="display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;padding:10px 0 4px">
    <div class="kicker tnum" id="lsCount"></div><div id="lsQ" style="font:400 26px/1.25 var(--f-display);min-height:66px;text-wrap:balance"></div><div id="lsA" class="muted" style="min-height:24px;font:400 16px/1.4 var(--f-type)"></div>
    <div style="display:flex;gap:12px;align-items:center"><button class="icon-btn" id="lsRate" style="width:auto;padding:0 12px;font:700 12px var(--f-type)">1×</button><button class="btn btn-brass btn-lg" id="lsPlay" style="width:64px;padding:0;border-radius:50%" aria-label="${esc(t('Lecture'))}">${icon('play')}</button><button class="icon-btn" id="lsNext" aria-label="${esc(t('Suivante'))}">${icon('skip')}</button></div>
    <div class="muted" style="font-size:13px">${t('La question, quatre secondes pour répondre dans votre tête, puis la réponse.')}</div></div>`);
  const say = (text, lang) => new Promise(res => { const u = new SpeechSynthesisUtterance(plain(text)); u.lang = lang; u.rate = rate; u.onend = res; u.onerror = res; speechSynthesis.speak(u); });
  const show = () => { const c = cards[i]; if (!c) return; m.querySelector('#lsCount').textContent = `${i + 1} / ${cards.length}`; m.querySelector('#lsQ').textContent = plain(cardFaces(c).question); m.querySelector('#lsA').textContent = ''; };
  const loop = async () => {
    while (playing && i < cards.length && !stopped) {
      const c = cards[i]; show(); const f = cardFaces(c); const [lq, la] = cardLangs(c, d);
      await say(f.question, lq); if (!playing) break; await sleep(4000 / rate); if (!playing) break;
      m.querySelector('#lsA').textContent = plain(f.expected); await say(f.expected, la); if (!playing) break; await sleep(1200); i++;
    }
    if (i >= cards.length) { playing = false; m.querySelector('#lsPlay').innerHTML = icon('play'); m.querySelector('#lsQ').textContent = t('Écoute terminée. Bravo !'); i = 0; }
  };
  m.querySelector('#lsPlay').onclick = () => { playing = !playing; m.querySelector('#lsPlay').innerHTML = icon(playing ? 'pause' : 'play'); if (playing) loop(); else speechSynthesis.cancel(); };
  m.querySelector('#lsNext').onclick = () => { speechSynthesis.cancel(); i = Math.min(cards.length - 1, i + 1); show(); };
  m.querySelector('#lsRate').onclick = e => { rate = rate === 1 ? 1.25 : rate === 1.25 ? 1.5 : rate === 1.5 ? 0.85 : 1; e.currentTarget.textContent = num(rate, rate % 1 ? 2 : 0).replace(/0$/, '') + '×'; };
  Modal.onClose(m, () => { stopped = true; playing = false; speechSynthesis.cancel(); });
  show();
}

/* ── Demander au prof (discussion sur un paquet) ───────────────────── */
function deckContext(d, max = 14000) { return d.cards.filter(c => c.type !== 'occlusion').map(c => { const f = cardFaces(c); return `- ${plain(f.question)} → ${plain(f.expected)}`; }).join('\n').slice(0, max); }
function openChat(deckId) {
  const d = deckById(deckId); if (!d) return;
  if (!AI.on) { toast(t("Le prof virtuel a besoin de l'IA : ouvrez Engram dans l'app Claude."), 'chat'); return; }
  const RULES = `You are a private tutor who is ${TONES[S.profile.settings.tone]?.ai || TONES.gentle.ai}. The student is revising the deck "${d.name}". Here are their flashcards (question → answer):\n${deckContext(d)}\n\nAnswer in ${aiLang()}, simply, in 120 words at most unless the student asks for more. Rely on the flashcards; if you add information that is not in them, say so. No headings; short lists are allowed.`;
  const turns = []; let ctl = null;
  const m = Modal.open(mh(t('Demander au prof'), esc(d.name)) + `
    <div class="chat" id="chat"><div class="msg ai">${t('Bonjour ! Je connais les {n} fiches de « {name} ». Posez-moi une question, ou choisissez une idée ci-dessous.', { n: d.cards.length, name: esc(d.name) })}</div></div>
    <div class="chips" id="chatSugg" style="margin-top:12px">${[t('Explique-moi ce chapitre simplement'), t('Quels sont les pièges classiques ?'), t('Donne-moi un moyen mnémotechnique'), t('Pose-moi une question difficile')].map(x => `<button class="chip" data-s="${esc(x)}">${esc(x)}</button>`).join('')}</div>
    <form class="chat-in" id="chatForm" autocomplete="off"><input class="input" id="chatIn" placeholder="${esc(t('Votre question…'))}" autofocus><button class="btn btn-brass" aria-label="${esc(t('Envoyer'))}">${icon('arrow')}</button></form>`, 'wide');
  const box = m.querySelector('#chat');
  const add = (cls, html) => { const el = document.createElement('div'); el.className = 'msg ' + cls; el.innerHTML = html; box.append(el); box.scrollTop = box.scrollHeight; return el; };
  const send = async text => {
    text = text.trim(); if (!text || ctl) return;
    m.querySelector('#chatSugg').hidden = true;
    add('me', esc(text)); turns.push({ role: 'user', content: text });
    const bubble = add('ai', '<span class="thinking"><i></i><i></i><i></i></span>');
    ctl = new AbortController();
    S.profile.flags.curious = 1;
    try {
      const { text: out } = await AI.ask([{ role: 'user', content: RULES }, ...turns.slice(-12)], { cache: false, signal: ctl.signal, onText: ({ text: x }) => { bubble.innerHTML = md(x); box.scrollTop = box.scrollHeight; } });
      turns.push({ role: 'assistant', content: out });
      const mk = document.createElement('div'); mk.className = 'mk'; mk.innerHTML = `<button data-mk>${icon('plus', 'i-sm')} ${t('En faire une fiche')}</button>`; bubble.append(mk);
      mk.querySelector('[data-mk]').onclick = async ev => {
        const b = ev.currentTarget; b.disabled = true; b.textContent = t('Rédaction…');
        try {
          const r = await AI.json(`From this exchange, write ONE atomic flashcard (one idea, short answer) in the language of the deck.\nStudent's question: ${text}\nExplanation: ${out}\nReply with only {"front": "...", "back": "..."}`, { modelTier: 'quick', cache: false });
          if (r?.front && r?.back) { d.cards.push(mkCard('basic', { front: String(r.front), back: String(r.back), src: 'ia' })); Store.touchDeck(d); b.textContent = t('✓ Fiche ajoutée'); } else b.textContent = t('Réessayez');
        } catch (e) { b.textContent = AI.fail(e) || t('Réessayez'); b.disabled = false; }

    } catch (e) { bubble.textContent = e?.text || AI.fail(e) || '…'; if (turns[turns.length - 1]?.role === 'user') turns.pop(); }

  };
  m.querySelector('#chatForm').addEventListener('submit', e => { e.preventDefault(); const i = m.querySelector('#chatIn'); send(i.value); i.value = ''; });
  m.querySelector('#chatSugg').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (b) send(b.dataset.s); });

/* ── Fiche de synthèse ─────────────────────────────────────────────── */
function sheetHTML(src) {
  const lines = String(src).split('\n'); let html = '', inList = false;
  const close = () => { if (inList) { html += '</ul>'; inList = false; } };
  for (const raw of lines) {
    const l = raw.trim(); if (!l) { close(); continue; }
    if (/^#{1,2}\s/.test(l)) { close(); html += `<h3>${md(l.replace(/^#+\s/, ''))}</h3>`; }
    else if (/^#{3,}\s/.test(l)) { close(); html += `<h4>${md(l.replace(/^#+\s/, ''))}</h4>`; }
    else if (/^[-•*]\s/.test(l)) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${md(l.replace(/^[-•*]\s/, ''))}</li>`; }
    else { close(); html += `<p>${md(l)}</p>`; }
  }
  close(); return html;
}
function localSheet(d) {
  const by = {}; for (const c of d.cards) { if (c.type === 'occlusion') continue; (by[typeLabel(c.type)] = by[typeLabel(c.type)] || []).push(c); }
  let s = `## ${d.name}\n`;
  for (const [k, list] of Object.entries(by)) { s += `### ${k}\n`; for (const c of list) { const f = cardFaces(c); s += `- **${plain(f.question)}** — ${plain(f.expected)}\n`; } }
  return s;
}
function openSheet(deckId) {
  const d = deckById(deckId); if (!d) return;
  let src = '', ctl = null;
  const m = Modal.open(mh(t('Fiche de synthèse'), esc(d.name)) + `<div class="sheet" id="sheet"></div>
    <div class="modal-f"><span class="muted" id="shNote" style="margin-right:auto;font-size:13px"></span>${AI.on ? `<button class="btn" id="shAgain">${icon('flip')}${t('Régénérer')}</button>` : ''}<button class="btn" id="shKeep">${icon('bookmark')}${t('Garder dans le paquet')}</button><button class="btn btn-brass" id="shSave">${icon('download')}${t('Exporter (.md)')}</button></div>`, 'wide');
  const sheet = m.querySelector('#sheet');
  const run = async () => {
    if (!AI.on) { src = localSheet(d); sheet.innerHTML = sheetHTML(src); m.querySelector('#shNote').textContent = t('Sans IA : la fiche reprend vos fiches, rangées par type.'); return; }
    sheet.innerHTML = `<p><span class="thinking"><i></i><i></i><i></i></span> ${t('Rédaction de la fiche…')}</p>`;
    ctl?.abort(); ctl = new AbortController();
    const prompt = `Write a clear summary sheet of the chapter "${d.name}" from these flashcards (question → answer):\n${deckContext(d)}\n\nFormat: one line "## Title", then 3 to 6 sections "### Section title" with short bullet points ("- "), and finish with "### Must remember" (5 bullets) — translate that last heading into the sheet's language. Use **bold** for keywords. No other markdown. Write in the language of the flashcards, at student level, invent nothing.`;
    try {
      const r = await AI.ask(prompt, { cache: false, signal: ctl.signal, onText: ({ text }) => { src = text; sheet.innerHTML = sheetHTML(text); } });
      src = r.text; sheet.innerHTML = sheetHTML(src); m.querySelector('#shNote').textContent = t("Rédigée par l'IA à partir de vos fiches.");
    } catch (e) { if (e?.code !== 'cancelled') { src = localSheet(d); sheet.innerHTML = sheetHTML(src); m.querySelector('#shNote').textContent = AI.fail(e); } }
  };
  m.querySelector('#shAgain')?.addEventListener('click', run);
  m.querySelector('#shKeep').onclick = () => { if (!src) return; d.notes.unshift({ id: uid('note'), title: t('Synthèse — {name}', { name: d.name }), md: src, created: Date.now() }); Store.touchDeck(d); toast(t('Note enregistrée dans le paquet'), 'bookmark'); };
  m.querySelector('#shSave').onclick = () => saveFile(`${slug(t('synthese'))}-${slug(d.name)}.md`, src);
  Modal.onClose(m, () => { ctl?.abort(); if (App.route.v === 'deck') App.render(); });
  run();
}

function bootApp() {
  document.addEventListener('click', e => {
    if (e.target.closest('#onb')) { Onb.click(e); return; }
    const a = e.target.closest('[data-act]'); if (!a) return;
    if (a.tagName === 'A') e.preventDefault();
    const fn = Actions[a.dataset.act]; if (fn) fn(a, e); else Study.act(a.dataset.act, a, e);
  });
  document.addEventListener('keydown', e => {
    if (!$('#onb').hidden) return;
    if (e.key === 'Enter' && e.target.matches?.('[role="link"][data-act]')) { e.target.click(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (!Modal.stack.length) openPalette(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'j') { e.preventDefault(); Mentor.toggle(); return; }
    if (e.key === 'Escape' && Modal.stack.length) { Modal.close(); e.preventDefault(); return; }
    if (e.key === 'Escape' && Mentor.isOpen) { Mentor.close(); e.preventDefault(); return; }
    if (Modal.stack.length) return;
    const typing = /input|textarea|select/i.test(e.target.tagName) || e.target.isContentEditable;
    if (Study.active) { Study.key(e, typing); return; }
    if (!typing && e.key === '/' && !Mentor.isOpen) { e.preventDefault(); Mentor.open(); return; }
    if (Game.key(e, typing)) return;
    if (!typing && e.key === ' ' && App.route.v === 'today' && todayCounts().total) { e.preventDefault(); Study.start(); }
  });
  const tip = $('#tip');
  document.addEventListener('pointerover', e => {
    const el = e.target.closest?.('[data-tip]'); if (!el) { tip.hidden = true; return; }
    const r = el.getBoundingClientRect(); tip.textContent = el.dataset.tip; tip.hidden = false;
    tip.style.left = clamp(r.left + r.width / 2, 90, innerWidth - 90) + 'px'; tip.style.top = r.top + 'px';
  });
  addEventListener('scroll', () => tip.hidden = true, { passive: true });
  $('#fileImport').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    importFile(f);
  });
  addEventListener('beforeunload', () => { if (Store.dirty.size) Store.flush(); });
}

   ════════════════════════════════════════════════════════════════════ */
const AIMS = { school: N_('Cours et contrôles'), exam: N_('Un examen ou un concours'), uni: N_('Études supérieures'), languages: N_('Apprendre une langue'), pro: N_('Certification professionnelle'), curious: N_('Par curiosité') };
const SCHOOL_LEVELS = { college: N_('Collège'), lycee: N_('Lycée'), uni: N_('Université'), prepa: N_('Prépa / concours'), pro: N_('Formation pro'), adult: N_('Adulte') };
const STUDY_TIMES = { morning: N_('Le matin'), noon: N_('Le midi'), evening: N_('Le soir'), night: N_('Tard le soir') };
const MENTOR_TIERS = { quick: [N_('Rapide'), N_('Réponses instantanées, pour les petites tâches.')], default: [N_('Équilibré'), N_('Le bon réglage pour tous les jours.')], complex: [N_('Expert'), N_("Le modèle le plus puissant : plans, raisonnements, gros chantiers. Plus lent.")] };
const weekdayNames = style => Array.from({ length: 7 }, (_, i) => cap(dayName(new Date(2024, 0, 1 + i), style))); // 1er janvier 2024 = lundi

const setRow = (title, desc, ctl, id = '') => `<div class="set-row" ${id ? `id="${id}"` : ''}><div class="t"><b>${title}</b>${desc ? `<span>${desc}</span>` : ''}</div>${ctl}</div>`;
const segCtl = (key, opts, cur, attr = 'data-seg') => `<div class="seg" ${attr}="${key}">${opts.map(([k, l]) => `<button class="${String(cur) === String(k) ? 'on' : ''}" data-val="${k}">${l}</button>`).join('')}</div>`;
const sw = (key, on, label) => `<button class="switch ${on ? 'on' : ''}" data-toggle="${key}" aria-label="${esc(label)}" aria-pressed="${!!on}"></button>`;

Views.settings = arg => {
  const s = S.profile.settings, st = S.profile.study;

  const via = AI.via === 'claude' ? t('via votre compte Claude') : AI.via === 'server' ? t('via le serveur Engram') : '';

  const wd = weekdayNames('short');
  return `
    <header class="rise"><div class="kicker">${t('Préférences')}</div><h1 class="display" style="margin-top:12px">${words(t('Réglages.'))}</h1></header>

      ${setRow(t('Prénom'), t('Pour que Mentor vous appelle par votre nom. Facultatif.'), `<input class="input" id="stName" value="${esc(st.name)}" style="max-width:240px" autocomplete="given-name">`)}
      ${setRow(t('Objectif'), '', `<select class="select" id="stAim" style="max-width:280px">${Object.entries(AIMS).map(([k, v]) => `<option value="${k}" ${st.aim === k ? 'selected' : ''}>${t(v)}</option>`).join('')}</select>`)}
      ${setRow(t('Niveau'), t('Adapte la difficulté des fiches rédigées par l\'IA.'), `<select class="select" id="stLevel" style="max-width:280px">${Object.entries(SCHOOL_LEVELS).map(([k, v]) => `<option value="${k}" ${st.level === k ? 'selected' : ''}>${t(v)}</option>`).join('')}</select>`)}
      <div class="set-row col"><div class="t"><b>${t('Temps disponible par jour')}</b><span>${t('En minutes. Le programme répartit les nouvelles fiches sans jamais dépasser ce temps, sauf urgence avant un examen.')}</span></div>

        <div class="exam-list">${S.profile.exams.map(x => { const d = daysUntil(x.date); return `<button class="exam-chip ${d < 0 ? 'past' : ''}" data-act="examPlan" data-exam="${x.id}"><b>${esc(x.name)}</b><span class="tnum">${esc(fmtDate(keyToDate(x.date), { day: 'numeric', month: 'short', year: 'numeric' }))} · ${d < 0 ? t('passé') : t('J−{n}', { n: d })}</span></button>`; }).join('')}<button class="exam-chip add" data-act="examPlan">${icon('plus', 'i-sm')}${t('Ajouter un examen')}</button></div></div>

    <section class="sec" id="sLang"><div class="sec-h"><div><h2 class="h2">${t('Langue')}</h2><p>${t("Toute l'interface, les exemples et les réponses de l'IA passent dans la langue choisie.")}</p></div></div>
    <article class="panel rise"><div class="lang-list">${UI_LANGS.map(l => `<button class="lang-opt ${l === LANG ? 'on' : ''}" data-setlang="${l}"><b>${UI_LANG_META[l].name}</b><span class="kicker">${UI_LANG_META[l].flag}</span></button>`).join('')}</div></article></section>

    <section class="sec" id="sStudy"><div class="sec-h"><div><h2 class="h2">${t('Révision')}</h2></div></div>
    <article class="panel rise"><div class="settings">
      ${setRow(t('Objectif de rétention'), t("La probabilité visée de vous souvenir d'une fiche le jour où elle revient. Plus c'est haut, plus il y a de révisions."), `<div class="ctl"><input type="range" min="0.8" max="0.97" step="0.01" value="${s.retention}" id="setRet"><b class="tnum" id="retOut" style="width:56px">${pct(s.retention)}</b></div>`)}
      ${setRow(t('Nouvelles fiches par jour'), s.followPlan ? t("Avec le programme : plafond quotidien pour les paquets sans examen. Aujourd'hui, le programme prévoit {n} nouvelles fiches au total.", { n: Plan.todayNewTotal() }) : t('Au-delà, elles attendent le lendemain.'), `<div class="ctl"><input type="range" min="0" max="100" step="5" value="${s.newPerDay}" id="setNew"><b class="tnum" id="newOut" style="width:56px">${s.newPerDay}</b></div>`)}
      ${setRow(t('Objectif quotidien'), t('Nombre de révisions pour remplir la jauge du jour.'), `<div class="ctl"><input type="range" min="10" max="300" step="10" value="${s.goal}" id="setGoal"><b class="tnum" id="goalOut" style="width:56px">${s.goal}</b></div>`)}

      ${setRow(t('Exigence de la correction'), t(STRICT[s.strict].desc) + '. ' + t('La correction accepte synonymes et reformulations selon le niveau choisi.'), segCtl('strict', Object.entries(STRICT).map(([k, v]) => [k, t(v.label)]), s.strict))}
      ${setRow(t('Ambiance de travail'), t('Un fond sonore discret pendant la séance.'), segCtl('ambient', [['off', t('Silence')], ['library', t('Bibliothèque')], ['rain', t('Pluie')]], s.ambient))}

      ${setRow(t('Sons'), t('Tampon, papier, petites notes de réussite.'), sw('sound', s.sound, t('Sons')))}
