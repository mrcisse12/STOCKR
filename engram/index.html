  "Découverte reste gratuite et sans publicité. L'abonnement paie l'IA : chaque photo analysée, chaque correction et chaque mission a un coût.": ["Discovery stays free and ad-free. The subscription pays for the AI: every photo analysed, every check and every mission has a cost.","Descubrimiento sigue siendo gratis y sin publicidad. La suscripción paga la IA: cada foto analizada, cada corrección y cada misión tiene un coste.","Entdecken bleibt kostenlos und werbefrei. Das Abo bezahlt die KI: Jedes analysierte Foto, jede Korrektur und jeder Auftrag kostet etwas.","Descoberta continua grátis e sem anúncios. A assinatura paga a IA: cada foto analisada, cada correção e cada missão tem um custo."],

  "Formule Découverte : les analyses locales sont illimitées ; avec l'IA, 3 missions par mois.": ["Discovery plan: local analyses are unlimited; with AI, 3 missions a month.","Plan Descubrimiento: los análisis locales son ilimitados; con IA, 3 misiones al mes.","Tarif Entdecken: lokale Analysen sind unbegrenzt; mit KI 3 Aufträge pro Monat.","Plano Descoberta: as análises locais são ilimitadas; com IA, 3 missões por mês."],

  "Il compose un examen blanc sur vos points faibles et sur le programme du prochain examen, chronomètre compris.": ["It builds a mock exam on your weak spots and the syllabus of your next exam, timer included.","Prepara un simulacro sobre tus puntos débiles y el temario del próximo examen, con cronómetro.","Er stellt eine Probeprüfung zu deinen Schwachstellen und zum Stoff der nächsten Prüfung zusammen, mit Stoppuhr.","Ele monta um simulado com seus pontos fracos e o conteúdo da próxima prova, com cronômetro."],
  "Il faut au moins quatre fiches pour composer un examen blanc.": ["A mock exam needs at least four cards.","Hacen falta al menos cuatro tarjetas para preparar un simulacro.","Für eine Probeprüfung braucht es mindestens vier Karten.","São necessários pelo menos quatro cartões para montar um simulado."],
  "Il lit votre journée : fiches dues, examens, temps libre. Il prépare la séance idéale et vous l'explique en trois lignes.": ["It reads your day: cards due, exams, free time. It prepares the ideal session and explains it in three lines.","Lee tu día: tarjetas pendientes, exámenes, tiempo libre. Prepara la sesión ideal y te la explica en tres líneas.","Er liest deinen Tag: fällige Karten, Prüfungen, freie Zeit. Er bereitet die ideale Sitzung vor und erklärt sie dir in drei Zeilen.","Ele lê seu dia: cartões pendentes, provas, tempo livre. Prepara a sessão ideal e a explica em três linhas."],
  "Il mélange les fiches du programme que vous avez le moins revues.": ["It mixes the syllabus cards you have reviewed least.","Mezcla las tarjetas del temario que menos has repasado.","Er mischt die Karten aus dem Stoff, die du am wenigsten wiederholt hast.","Ele mistura os cartões do conteúdo que você menos revisou."],
  "Il relit un paquet comme un professeur : questions floues, réponses trop longues, doublons, erreurs. Il propose, vous validez.": ["It reads a deck like a teacher: vague questions, overlong answers, duplicates, mistakes. It suggests, you approve.","Revisa un mazo como un profesor: preguntas vagas, respuestas demasiado largas, duplicados, errores. Él propone, tú validas.","Er liest einen Stapel wie ein Lehrer: unklare Fragen, zu lange Antworten, Doppelte, Fehler. Er schlägt vor, du entscheidest.","Ele revisa um baralho como um professor: perguntas vagas, respostas longas demais, duplicados, erros. Ele propõe, você aprova."],
  "Il repère ce qui manque à un paquet pour couvrir le sujet, et rédige les fiches absentes.": ["It spots what a deck is missing to cover the subject, and writes the missing cards.","Detecta lo que le falta a un mazo para cubrir el tema y redacta las tarjetas ausentes.","Er erkennt, was einem Stapel fehlt, um das Thema abzudecken, und schreibt die fehlenden Karten.","Ele identifica o que falta num baralho para cobrir o assunto e escreve os cartões ausentes."],
  "Il vise d'abord vos {n} les plus fragiles, puis ce que vous n'avez pas revu depuis longtemps.": ["It goes first for your weakest ones ({n}), then what you have not reviewed for a long time.","Apunta primero a tus más frágiles ({n}) y luego a lo que no repasas desde hace tiempo.","Er nimmt sich zuerst deine anfälligsten vor ({n}), dann das, was du lange nicht wiederholt hast.","Ele mira primeiro os seus mais frágeis ({n}), depois o que você não revisa há muito tempo."],

  "Jamais. Ils lisent, analysent et proposent. Chaque changement attend votre accord, et un seul bouton annule tout ce qui a été appliqué.": ["Never. They read, analyse and suggest. Each change waits for your approval, and a single button undoes everything that was applied.","Nunca. Leen, analizan y proponen. Cada cambio espera tu permiso, y un solo botón deshace todo lo aplicado.","Nie. Sie lesen, analysieren und schlagen vor. Jede Änderung wartet auf dein Okay, und ein einziger Knopf macht alles Übernommene rückgängig.","Nunca. Eles leem, analisam e propõem. Cada alteração espera sua aprovação, e um único botão desfaz tudo o que foi aplicado."],

/* ── Démarrage ─────────────────────────────────────────────────────── */
function boot() {
  Store.load();
  Custom.apply(); applyStatic();
  Scan.level = S.profile.study.level || 'lycee';
  bootApp(); Mentor.mount(); bootDrop();
  App.render();
  if (!S.profile.onboarded) Onb.open();
  AI.init().then(() => setTimeout(() => Autopilot.check(), 1200));
  Store.connect();
  Dl.ready().then(() => { if (App.route.v === 'links') App.render(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Autopilot.check(); });
  // Les lignes des fiches dépendent des polices et de la taille de l'écran : on les recale quand l'une change.
  let relay = 0;
  const reRule = () => { clearTimeout(relay); relay = setTimeout(() => { if (Study.active) Study.layout(); Ruling.scan(); }, 120); };
  addEventListener('resize', reRule);
  document.fonts?.addEventListener?.('loadingdone', reRule);
  document.fonts?.ready?.then(reRule);
  // Raccourcis de l'app installée (appui long sur l'icône) : #scan, #study.
  const h = location.hash.slice(1);
  if (h === 'scan') App.go('scan'); else if (h === 'study' && S.profile.onboarded) setTimeout(() => Study.start(), 300);
  if (h) history.replaceState(null, '', location.pathname + location.search);
  // App installable et hors-ligne, quand la page est servie par un vrai site (pas dans l'app Claude).
  if ('serviceWorker' in navigator && !window.claude && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
  }
}
boot();
</script>
