<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Engram</title>
<meta name="description" content="Engram — photographiez votre cours, l'IA crée vos flashcards, la répétition espacée FSRS fait le reste.">
<meta name="theme-color" content="#0B0E16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Caveat:wght@500;600&family=Martian+Mono:wght@300;400;500&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* ───────────────────────── Tokens ─────────────────────────
   Dark-first "bibliothèque de nuit": encre bleu nuit, lumière de lampe ambrée,
   fiches bristol en papier. Le thème clair est la "salle d'étude en plein jour". */
:root{
  color-scheme: dark;
  --bg:#0B0E16; --bg-2:#10141F; --bg-3:#161B29; --bg-4:#1D2334;
  --glass:rgba(20,25,39,.66); --glass-brd:rgba(255,255,255,.075); --glass-hi:rgba(255,255,255,.05);
  --line:rgba(170,185,225,.10); --line-2:rgba(170,185,225,.18);
  --text:#EDEAE3; --text-2:#B9BBC8; --muted:#80859A;
  --accent:#FFB23F; --accent-2:#FF8A3D; --accent-text:#FFC266; --on-accent:#1B1204;
  --accent-soft:rgba(255,178,63,.13); --accent-glow:rgba(255,178,63,.42);
  --ice:#93B4FF; --ice-soft:rgba(147,180,255,.12);
  --again:#FF6B6B; --hard:#E9B949; --good:#4FD1A5; --easy:#93B4FF;
  --st-new:#5E86E8; --st-learn:#DE4E7A; --st-young:#C4821E; --st-mature:#27A27A;
  --heat-0:rgba(170,185,225,.07); --heat-1:rgba(255,178,63,.22); --heat-2:rgba(255,178,63,.42); --heat-3:rgba(255,178,63,.66); --heat-4:#FFB23F;
  --paper:#F3EFE4; --paper-2:#E8E1D0; --paper-ink:#1C1F2B; --paper-muted:#6E6B70;
  --paper-rule:rgba(64,110,190,.17); --paper-margin:rgba(214,69,61,.42); --pen:#C8372D;
  --shadow-lg:0 40px 90px -30px rgba(0,0,0,.75), 0 18px 36px -18px rgba(0,0,0,.6);
  --shadow-md:0 18px 40px -20px rgba(0,0,0,.65);
  --neural-line:150,170,230; --neural-node:190,202,238; --neural-fire:255,178,63; --neural-alpha:.55;
  --body-glow-1:rgba(255,160,60,.10); --body-glow-2:rgba(110,140,255,.09);
  --radius:22px; --radius-md:16px; --radius-sm:11px;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --f-pen:"Caveat","Segoe Print","Bradley Hand",cursive;
  --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.56,.64,1); --snap:cubic-bezier(.2,.9,.25,1.25);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#ECEEF3; --bg-2:#F6F7FA; --bg-3:#FFFFFF; --bg-4:#E3E6EE;
    --glass:rgba(255,255,255,.74); --glass-brd:rgba(20,28,55,.09); --glass-hi:rgba(255,255,255,.9);
    --line:rgba(20,28,55,.09); --line-2:rgba(20,28,55,.16);
    --text:#12151F; --text-2:#3A3F52; --muted:#667085;
    --accent:#F5A320; --accent-2:#E8791E; --accent-text:#9A5700; --on-accent:#1B1204;
    --accent-soft:rgba(245,163,32,.14); --accent-glow:rgba(232,140,20,.35);
    --ice:#3F6FE0; --ice-soft:rgba(63,111,224,.10);
    --again:#D9443F; --hard:#B7860F; --good:#138A63; --easy:#3F6FE0;
    --st-new:#3F6FE0; --st-learn:#D6336C; --st-young:#C98A12; --st-mature:#159A6E;
    --heat-0:rgba(20,28,55,.07); --heat-1:rgba(232,140,20,.22); --heat-2:rgba(232,140,20,.42); --heat-3:rgba(232,140,20,.66); --heat-4:#E08A12;
    --paper:#FFFDF7; --paper-2:#F3EEE1;
    --shadow-lg:0 40px 80px -34px rgba(30,40,80,.35), 0 14px 28px -16px rgba(30,40,80,.22);
    --shadow-md:0 16px 34px -20px rgba(30,40,80,.30);
    --neural-line:70,90,150; --neural-node:70,90,150; --neural-fire:226,132,16; --neural-alpha:.42;
    --body-glow-1:rgba(255,170,60,.16); --body-glow-2:rgba(90,130,255,.12);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#ECEEF3; --bg-2:#F6F7FA; --bg-3:#FFFFFF; --bg-4:#E3E6EE;
  --glass:rgba(255,255,255,.74); --glass-brd:rgba(20,28,55,.09); --glass-hi:rgba(255,255,255,.9);
  --line:rgba(20,28,55,.09); --line-2:rgba(20,28,55,.16);
  --text:#12151F; --text-2:#3A3F52; --muted:#667085;
  --accent:#F5A320; --accent-2:#E8791E; --accent-text:#9A5700; --on-accent:#1B1204;
  --accent-soft:rgba(245,163,32,.14); --accent-glow:rgba(232,140,20,.35);
  --ice:#3F6FE0; --ice-soft:rgba(63,111,224,.10);
  --again:#D9443F; --hard:#B7860F; --good:#138A63; --easy:#3F6FE0;
  --st-new:#3F6FE0; --st-learn:#D6336C; --st-young:#C98A12; --st-mature:#159A6E;
  --heat-0:rgba(20,28,55,.07); --heat-1:rgba(232,140,20,.22); --heat-2:rgba(232,140,20,.42); --heat-3:rgba(232,140,20,.66); --heat-4:#E08A12;
  --paper:#FFFDF7; --paper-2:#F3EEE1;
  --shadow-lg:0 40px 80px -34px rgba(30,40,80,.35), 0 14px 28px -16px rgba(30,40,80,.22);
  --shadow-md:0 16px 34px -20px rgba(30,40,80,.30);
  --neural-line:70,90,150; --neural-node:70,90,150; --neural-fire:226,132,16; --neural-alpha:.42;
  --body-glow-1:rgba(255,170,60,.16); --body-glow-2:rgba(90,130,255,.12);
}
:root[data-theme="dark"]{ color-scheme: dark; }

/* ───────────────────────── Base ───────────────────────── */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:400 15px/1.55 var(--f-body); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
  background-image:
    radial-gradient(1100px 700px at -8% -10%, var(--body-glow-1), transparent 60%),
    radial-gradient(900px 700px at 110% 110%, var(--body-glow-2), transparent 60%);
  background-attachment:fixed;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent-text)}
::selection{background:var(--accent);color:var(--on-accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.i-sm{width:16px;height:16px}.i-lg{width:26px;height:26px}
kbd{font:500 10px/1 var(--f-mono);padding:4px 6px;border-radius:6px;border:1px solid currentColor;opacity:.62;letter-spacing:.02em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums}

/* Neural field + grain */
#neural{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:var(--neural-alpha);transition:opacity .8s var(--ease)}
body.studying #neural{opacity:1}
body.studying .app{visibility:hidden}
.col{min-width:0;display:flex;flex-direction:column}
.ring text{fill:var(--text)}
.grain{position:fixed;inset:-50%;z-index:1;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}

/* ───────────────────────── Shell ───────────────────────── */
.app{position:relative;z-index:2;display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:22px;padding:26px 18px 20px;border-right:1px solid var(--line);
  background:linear-gradient(180deg,var(--glass),transparent 140%);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 10px 6px;text-decoration:none;color:var(--text)}
.brand-mark{width:34px;height:34px;flex:none}
.brand-mark .bm-path{stroke-dasharray:120;stroke-dashoffset:120;animation:draw 1.6s .15s var(--ease) forwards}
.brand-mark .bm-core{transform-origin:16px 16px;animation:corePulse 3.2s 1.2s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes corePulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.75}}
.wordmark{font:600 27px/1 var(--f-display);letter-spacing:-.01em;font-variation-settings:"opsz" 72}
.wordmark i{color:var(--accent);font-style:normal}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-label{font:500 9.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:14px 12px 8px}
.nav-btn{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--text-2);font-weight:500;text-align:left;transition:color .25s,background .25s}
.nav-btn:hover{color:var(--text);background:var(--glass-hi)}
.nav-btn.on{color:var(--text);background:linear-gradient(90deg,var(--accent-soft),transparent)}
.nav-btn.on::before{content:"";position:absolute;left:-18px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);box-shadow:0 0 18px var(--accent-glow)}
.nav-btn .badge{margin-left:auto;font:500 10.5px/1 var(--f-mono);padding:4px 7px;border-radius:99px;background:var(--accent);color:var(--on-accent)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.level{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1px solid var(--glass-brd);background:var(--glass)}
.level-ring{width:40px;height:40px;flex:none}
.level-name{font-weight:600;font-size:13.5px}
.level-sub{font:400 10.5px/1.3 var(--f-mono);color:var(--muted);letter-spacing:.02em}
.pro-card{position:relative;overflow:hidden;padding:16px;border-radius:18px;text-align:left;color:var(--text);
  background:radial-gradient(120% 140% at 100% 0%,rgba(255,178,63,.28),transparent 55%),linear-gradient(160deg,var(--bg-4),var(--bg-2));
  border:1px solid rgba(255,178,63,.28);transition:transform .4s var(--spring),box-shadow .4s}
.pro-card:hover{transform:translateY(-2px);box-shadow:0 20px 40px -20px var(--accent-glow)}
.pro-card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);transform:translateX(-100%);animation:sheen 5s 2s ease-in-out infinite}
@keyframes sheen{0%,70%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.pro-card b{font:600 17px/1.1 var(--f-display);display:flex;align-items:center;gap:7px}
.pro-card span{display:block;margin-top:5px;font-size:12.5px;color:var(--text-2)}
.sync{display:flex;align-items:center;gap:8px;font:400 10.5px/1 var(--f-mono);color:var(--muted);padding:0 10px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.sync.cloud i{background:var(--good);box-shadow:0 0 10px var(--good)}
.sync.saving i{background:var(--accent);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}

.topbar{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.topbar .wordmark{font-size:23px}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--text-2);border:1px solid var(--glass-brd);background:var(--glass);transition:all .25s var(--ease)}
.icon-btn:hover{color:var(--text);border-color:var(--line-2);transform:translateY(-1px)}
.icon-btn.on{color:var(--accent-text);border-color:rgba(255,178,63,.4);background:var(--accent-soft)}
.streak-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;font:600 13px/1 var(--f-body);background:var(--accent-soft);color:var(--accent-text);border:1px solid rgba(255,178,63,.25)}
.streak-pill .i{width:16px;height:16px}

.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;grid-template-columns:repeat(5,1fr);align-items:end;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--glass);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:10.5px;font-weight:500;color:var(--muted);transition:color .2s}
.tab.on{color:var(--accent-text)}
.tab-scan{justify-self:center;display:grid;place-items:center;width:58px;height:58px;margin-top:-26px;border-radius:20px;color:var(--on-accent);
  background:linear-gradient(145deg,var(--accent),var(--accent-2));box-shadow:0 12px 30px -8px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .35s var(--spring)}
.tab-scan:active{transform:scale(.92)}
.tab-scan .i{width:26px;height:26px;stroke-width:1.9}

main{position:relative;min-width:0;padding:34px clamp(16px,4vw,52px) 120px}
.view{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
@media (max-width: 900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .topbar{display:flex}
  .tabbar{display:grid}
  main{padding:22px 16px calc(120px + env(safe-area-inset-bottom,0px))}
}

/* ───────────────────────── Type ───────────────────────── */
.eyebrow{font:500 10.5px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.display{font:500 clamp(40px,6vw,72px)/.98 var(--f-display);letter-spacing:-.025em;margin:10px 0 0;text-wrap:balance;font-variation-settings:"opsz" 96}
.display em{font-style:italic;font-weight:400;color:var(--accent-text)}
.display .dot{color:var(--accent)}
.lede{margin:14px 0 0;font-size:17px;color:var(--text-2);max-width:60ch;text-wrap:pretty}
h2.h2{font:500 30px/1.1 var(--f-display);letter-spacing:-.015em;margin:0;text-wrap:balance}
h3.h3{font:600 15px/1.3 var(--f-body);margin:0;letter-spacing:-.005em}
.muted{color:var(--muted)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ───────────────────────── Surfaces ───────────────────────── */
.panel{position:relative;border-radius:var(--radius);padding:24px;background:var(--glass);border:1px solid var(--glass-brd);
  backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.spot{isolation:isolate;overflow:hidden}
.spot::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .4s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,190,90,.10),transparent 60%)}
.spot:hover::before{opacity:1}
.rise{animation:rise .7s var(--ease) both}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:44px;padding:0 18px;border-radius:13px;font-weight:600;font-size:14.5px;letter-spacing:-.005em;
  border:1px solid var(--glass-brd);background:var(--glass);color:var(--text);transition:transform .3s var(--spring),box-shadow .3s,background .25s,border-color .25s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);border-color:var(--line-2)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-primary{border:0;color:var(--on-accent);background:linear-gradient(145deg,#FFC45E,var(--accent) 45%,var(--accent-2));
  box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 -1px 0 rgba(0,0,0,.12) inset,0 12px 28px -12px var(--accent-glow)}
.btn-primary:hover{box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 18px 36px -12px var(--accent-glow)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--glass-hi);color:var(--text)}
.btn-xl{height:56px;padding:0 26px;font-size:16px;border-radius:16px}
.btn-sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn-danger{color:var(--again)}
.btn kbd{color:inherit}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:99px;font-size:12.5px;font-weight:500;border:1px solid var(--line);color:var(--text-2);background:var(--glass-hi)}
.chip .dotc{width:7px;height:7px;border-radius:50%}
button.chip{transition:all .2s var(--ease)}
button.chip:hover{border-color:var(--line-2);color:var(--text)}
button.chip.on{border-color:rgba(255,178,63,.5);color:var(--accent-text);background:var(--accent-soft)}
.tag{font:500 9.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 7px;border-radius:6px;background:var(--glass-hi);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ai{color:var(--accent-text);border-color:rgba(255,178,63,.3);background:var(--accent-soft)}
.tag.leech{color:var(--again);border-color:color-mix(in srgb,var(--again) 40%,transparent)}

/* Forms */
.field{display:flex;flex-direction:column;gap:7px}
.field label,.flabel{font:500 10.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.input,.textarea,.select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.textarea{min-height:110px;resize:vertical;line-height:1.5}
.seg{display:inline-flex;flex-wrap:wrap;padding:4px;gap:3px;border-radius:13px;background:var(--bg-2);border:1px solid var(--line)}
.seg button{padding:8px 13px;border-radius:9px;font-size:13px;font-weight:500;color:var(--text-2);transition:all .25s var(--ease)}
.seg button.on{background:var(--bg-4);color:var(--text);box-shadow:0 1px 0 var(--glass-hi) inset,0 4px 14px -6px rgba(0,0,0,.4)}
input[type=range]{width:100%;accent-color:var(--accent)}
.switch{position:relative;width:46px;height:28px;border-radius:99px;background:var(--bg-4);border:1px solid var(--line-2);transition:background .3s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--text-2);transition:transform .35s var(--spring),background .3s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px);background:var(--on-accent)}

/* ───────────────────────── Today ───────────────────────── */
.demo-banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;border-radius:14px;border:1px dashed var(--line-2);color:var(--text-2);font-size:13.5px}
.demo-banner b{color:var(--text)}
.demo-banner .btn{margin-left:auto}
.hero-grid{display:grid;grid-template-columns:1.35fr 1fr;grid-template-rows:auto auto;gap:18px}
.due-panel{grid-row:span 2;display:flex;flex-direction:column;gap:18px;padding:30px;min-height:360px;
  background:radial-gradient(90% 80% at 100% 100%,rgba(255,178,63,.12),transparent 60%),var(--glass)}
.due-top{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.due-num{font:500 clamp(84px,11vw,136px)/.8 var(--f-display);letter-spacing:-.04em;font-variation-settings:"opsz" 96;
  background:linear-gradient(180deg,var(--text) 30%,color-mix(in srgb,var(--text) 45%,transparent));-webkit-background-clip:text;background-clip:text;color:transparent}
.due-label{font:500 20px/1.2 var(--f-display);font-style:italic;color:var(--text-2);padding-bottom:12px}
.due-actions{margin-top:auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack-illus{position:absolute;right:26px;top:26px;width:150px;height:120px;pointer-events:none}
.stack-illus span{position:absolute;inset:0;border-radius:10px;background:var(--paper);box-shadow:0 10px 24px -12px rgba(0,0,0,.5);
  background-image:linear-gradient(90deg,transparent 18px,var(--paper-margin) 18px,var(--paper-margin) 19px,transparent 19px),repeating-linear-gradient(180deg,transparent 0 17px,var(--paper-rule) 17px 18px);
  transform-origin:50% 120%;animation:fan 1.2s var(--ease) both}
.stack-illus span:nth-child(1){transform:rotate(-12deg) translate(-18px,6px);animation-delay:.1s;opacity:.55}
.stack-illus span:nth-child(2){transform:rotate(-5deg) translate(-6px,2px);animation-delay:.2s;opacity:.8}
.stack-illus span:nth-child(3){transform:rotate(4deg);animation-delay:.3s}
.stack-illus span:nth-child(3)::after{content:"?";position:absolute;right:14px;top:6px;font:italic 500 44px/1 var(--f-display);color:var(--accent-2)}
@keyframes fan{from{transform:rotate(0) translateY(20px);opacity:0}}
.streak-panel{display:flex;flex-direction:column;gap:16px}
.streak-row{display:flex;align-items:center;gap:16px}
.flame{width:58px;height:58px;flex:none;display:grid;place-items:center;border-radius:18px;background:var(--accent-soft);color:var(--accent);position:relative}
.flame .i{width:30px;height:30px;stroke-width:1.6;fill:rgba(255,178,63,.25);animation:flicker 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.06,1.1) rotate(-2deg)}60%{transform:scale(.97,1.03) rotate(2deg)}}
.big-stat{font:500 40px/1 var(--f-display);letter-spacing:-.02em}
.big-stat small{font:500 14px/1 var(--f-body);color:var(--muted);margin-left:6px;letter-spacing:0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font:400 10px/1 var(--f-mono);color:var(--muted)}
.week i{width:100%;max-width:34px;aspect-ratio:1;border-radius:10px;background:var(--heat-0);display:grid;place-items:center}
.week i.done{background:linear-gradient(145deg,var(--accent),var(--accent-2));box-shadow:0 6px 16px -8px var(--accent-glow)}
.week i.today{outline:1.5px dashed var(--accent);outline-offset:2px}
.goal-row{display:flex;align-items:center;gap:14px}
.ring{--p:0;width:54px;height:54px;flex:none}
.ring circle{fill:none;stroke-width:5}
.ring .rt{stroke:var(--line-2)}
.ring .rv{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1.4s var(--ease)}
.scan-cta{display:flex;align-items:center;gap:18px;cursor:pointer;text-align:left;width:100%;color:inherit;transition:transform .4s var(--spring),border-color .3s}
.scan-cta:hover{transform:translateY(-2px);border-color:rgba(255,178,63,.35)}
.scan-cta .ttl{font:500 22px/1.15 var(--f-display);letter-spacing:-.01em}
.scan-cta .sub{color:var(--text-2);font-size:13.5px;margin-top:4px}
.mini-scan{position:relative;width:86px;height:104px;flex:none;border-radius:10px;background:var(--paper);overflow:hidden;box-shadow:var(--shadow-md);transform:rotate(-4deg)}
.mini-scan i{position:absolute;left:12px;height:5px;border-radius:3px;background:rgba(28,31,43,.22)}
.mini-scan i:nth-child(1){top:16px;width:52px;background:rgba(28,31,43,.5)}
.mini-scan i:nth-child(2){top:30px;width:62px}.mini-scan i:nth-child(3){top:40px;width:48px}.mini-scan i:nth-child(4){top:54px;width:58px}
.mini-scan i:nth-child(5){top:64px;width:40px}.mini-scan i:nth-child(6){top:78px;width:55px}
.mini-scan b{position:absolute;left:0;right:0;height:2px;top:0;background:var(--accent);box-shadow:0 0 14px 3px var(--accent-glow);animation:laser 2.4s ease-in-out infinite}
@keyframes laser{0%{top:4%}50%{top:92%}100%{top:4%}}
.grid-2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width: 1100px){ .hero-grid{grid-template-columns:1fr} .due-panel{grid-row:auto} .grid-2{grid-template-columns:1fr} }
@media (max-width: 620px){ .btn kbd{display:none} .btn-xl{padding:0 18px} .due-actions .btn{flex:1 1 auto} }
@media (max-width: 520px){ .stack-illus{display:none} }
@media (max-width: 760px){ .grid-3{grid-template-columns:1fr} .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))} .stack-illus{width:96px;height:78px;right:18px;top:20px} .due-panel{padding:24px;min-height:0} }

/* Heatmap + bars */
.heat-wrap{overflow-x:auto;padding-bottom:4px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:4px;width:max-content}
.heat i{width:13px;height:13px;border-radius:4px;background:var(--heat-0);animation:pop .5s var(--ease) both}
.heat i[data-l="1"]{background:var(--heat-1)}.heat i[data-l="2"]{background:var(--heat-2)}.heat i[data-l="3"]{background:var(--heat-3)}.heat i[data-l="4"]{background:var(--heat-4)}
.heat i.today{outline:1.5px solid var(--text);outline-offset:1px}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.heat-legend{display:flex;align-items:center;gap:5px;font:400 10px/1 var(--f-mono);color:var(--muted);margin-top:12px}
.heat-legend i{width:11px;height:11px;border-radius:3px}
.bars{display:flex;align-items:flex-end;gap:10px;height:160px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar b{display:block;width:100%;max-width:34px;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 55%,transparent));
  transform-origin:bottom;animation:grow .9s var(--ease) both;min-height:2px}
.bar b.zero{background:var(--line-2)}
.bar span{font:400 10px/1 var(--f-mono);color:var(--muted)}
.bar em{font:500 11px/1 var(--f-mono);font-style:normal;color:var(--text-2);min-height:11px}
.bar span{min-height:10px;white-space:nowrap}
@keyframes grow{from{transform:scaleY(0)}}
.tip{position:fixed;z-index:200;pointer-events:none;padding:8px 10px;border-radius:10px;background:var(--bg-4);border:1px solid var(--line-2);font:500 12px/1.35 var(--f-body);color:var(--text);box-shadow:var(--shadow-md);transform:translate(-50%,calc(-100% - 10px));white-space:nowrap}

/* Decks */
.deck-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.deck{position:relative;display:flex;flex-direction:column;gap:16px;padding:20px;border-radius:var(--radius);cursor:pointer;text-align:left;color:inherit;width:100%;
  background:var(--glass);border:1px solid var(--glass-brd);transition:transform .45s var(--spring),border-color .3s,box-shadow .45s}
.deck:hover{transform:translateY(-4px) rotate(-.4deg);border-color:var(--line-2);box-shadow:var(--shadow-md)}
.deck-top{display:flex;align-items:flex-start;gap:14px}
.glyph{width:54px;height:54px;flex:none;border-radius:15px;background:var(--bg-2);border:1px solid var(--line)}
.deck-name{font:500 21px/1.15 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.deck-meta{font:400 11px/1.4 var(--f-mono);color:var(--muted);margin-top:5px}
.deck-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}
.deck-due{display:flex;gap:12px;font:500 12.5px/1 var(--f-body);color:var(--text-2)}
.deck-due b{font-weight:600}
.mat{height:6px;border-radius:99px;background:var(--line);overflow:hidden;display:flex;gap:2px}
.mat i{height:100%}
.new-deck{display:grid;place-items:center;gap:8px;min-height:170px;border-style:dashed;color:var(--muted);font-weight:500}
.new-deck:hover{color:var(--accent-text)}

/* ───────────────────────── Deck detail ───────────────────────── */
.deck-hero{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.deck-hero .glyph{width:96px;height:96px;border-radius:24px}
.deck-actions{display:flex;flex-wrap:wrap;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:16px 18px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-brd)}
.kpi b{display:block;font:500 30px/1 var(--f-display);letter-spacing:-.02em}
.kpi > span{display:block;margin-top:6px;font:400 10.5px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:760px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1;min-width:200px}
.search .i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:40px}
.clist{display:flex;flex-direction:column;border-radius:var(--radius);border:1px solid var(--glass-brd);background:var(--glass);overflow:hidden}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line);cursor:pointer;transition:background .2s;text-align:left;width:100%;color:inherit}
.crow:first-child{border-top:0}
.crow:hover{background:var(--glass-hi)}
.crow .q{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.crow .a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--muted);margin-top:2px}
.crow .due{font:400 11px/1 var(--f-mono);color:var(--muted);white-space:nowrap}
.rbar{width:54px;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.rbar i{display:block;height:100%;border-radius:99px}
.stdot{width:9px;height:9px;border-radius:50%}
@media (max-width:620px){ .crow{grid-template-columns:auto minmax(0,1fr) auto} .crow .rbar{display:none} }
.empty{display:grid;place-items:center;text-align:center;gap:12px;padding:48px 20px;color:var(--muted)}
.empty .ttl{font:500 24px/1.2 var(--f-display);color:var(--text)}

/* ───────────────────────── Paper card (fiche bristol) ───────────────────────── */
.stage{perspective:1600px;width:100%;display:grid;place-items:center}
.card3d{position:relative;width:min(660px,100%);min-height:clamp(300px,46vh,420px);transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(calc(var(--ry,0deg) + var(--flip,0deg))) translateX(var(--dx,0px)) rotate(var(--rz,0deg));
  transition:transform .85s var(--snap)}
.card3d.dragging{transition:none}
.card3d.flipped{--flip:180deg}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;overflow:hidden;color:var(--paper-ink);
  background-color:var(--paper);
  background-image:
    radial-gradient(260px circle at var(--hx,30%) var(--hy,20%),rgba(255,255,255,.55),transparent 60%),
    linear-gradient(90deg,transparent 52px,var(--paper-margin) 52px,var(--paper-margin) 53.5px,transparent 53.5px),
    repeating-linear-gradient(180deg,transparent 0 31px,var(--paper-rule) 31px 32px),
    linear-gradient(180deg,rgba(0,0,0,0),rgba(120,90,40,.06));
  background-position:0 0,0 0,0 58px,0 0;
  box-shadow:var(--shadow-lg),0 0 0 1px rgba(0,0,0,.05) inset;
  display:flex;flex-direction:column;padding:22px 30px 26px 72px}
.face.back{transform:rotateY(180deg)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='2'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .42  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>")}
.face-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font:500 9.5px/1 var(--f-mono);letter-spacing:.13em;text-transform:uppercase;color:var(--paper-muted);min-height:18px}
.face-head .no{color:var(--pen);opacity:.8}
.face-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:18px 0 8px;min-height:0;overflow:auto}
.q-text{font:500 clamp(21px,2.6vw,28px)/1.32 var(--f-body);letter-spacing:-.012em;text-wrap:balance}
.q-small{font:500 14px/1.45 var(--f-body);color:var(--paper-muted)}
.a-text{font:500 clamp(22px,2.8vw,30px)/1.28 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.extra{font-size:14px;line-height:1.5;color:#4b4a52;border-left:2px solid var(--paper-rule);padding-left:12px}
.cloze{display:inline-block;min-width:2.8em;padding:0 .35em;border-radius:6px;background:rgba(255,178,63,.28);border-bottom:2px solid #E0901E;color:#9A5700;font-weight:600;text-align:center}
.cloze-ans{background:linear-gradient(180deg,transparent 55%,rgba(255,196,80,.65) 55%);padding:0 .12em;color:inherit;font-weight:600}
.pen{font:600 24px/1.1 var(--f-pen);color:var(--pen);transform:rotate(-1.5deg);transform-origin:left}
.pen-in{animation:penIn .9s var(--ease) both}
@keyframes penIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.your{font-size:14px;color:var(--paper-muted)}
.your s{text-decoration-color:var(--pen);text-decoration-thickness:2px}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;border:1.5px solid rgba(28,31,43,.14);background:rgba(255,255,255,.55);text-align:left;color:var(--paper-ink);font-weight:500;font-size:15.5px;transition:all .25s var(--ease)}
.opt:hover{border-color:#E0901E;transform:translateX(3px)}
.opt b{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:rgba(28,31,43,.07);font:600 11px/1 var(--f-mono);flex:none}
.opt.right{border-color:#1F9D6E;background:rgba(31,157,110,.12)}
.opt.right b{background:#1F9D6E;color:#fff}
.opt.wrong{border-color:var(--pen);background:rgba(200,55,45,.08)}
.opt.wrong b{background:var(--pen);color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.occ{position:relative;width:fit-content;max-width:100%;margin:0 auto;border-radius:10px;overflow:hidden;background:#fff;border:1px solid rgba(0,0,0,.08);flex:none}
.occ img{display:block;max-width:100%;width:auto;height:auto;max-height:min(34vh,300px)}
.occ .m{position:absolute;border-radius:5px;background:#9aa3b8;border:1.5px solid #6d7690}
.occ .m.t{background:linear-gradient(135deg,#FFC45E,#F09A2B);border-color:#C97510;box-shadow:0 0 0 3px rgba(255,178,63,.35);display:grid;place-items:center;color:#5a3300;font:700 16px/1 var(--f-display)}
.occ .m.rev{background:transparent;border:2px solid #1F9D6E;box-shadow:0 0 0 3px rgba(31,157,110,.25)}
.card-hint{position:absolute;bottom:14px;right:18px;font:500 9.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--paper-muted);opacity:.7}
.swipe-tint{position:absolute;inset:0;border-radius:18px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:3}

/* ───────────────────────── Study overlay ───────────────────────── */
#study{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:
  radial-gradient(80% 65% at 50% 45%,color-mix(in srgb,var(--bg) 35%,transparent),color-mix(in srgb,var(--bg) 88%,transparent) 90%);
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));
  animation:studyIn .6s var(--ease) both}
@keyframes studyIn{from{opacity:0;transform:scale(1.03)}}
.st-top{display:flex;align-items:center;gap:12px;max-width:980px;width:100%;margin:0 auto}
.st-title{min-width:0;flex:1}
.st-title b{display:block;font:500 17px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-counts{display:flex;gap:10px;font:500 12px/1 var(--f-mono);margin-top:5px}
.st-counts span{display:inline-flex;align-items:center;gap:5px}
.st-counts .cur{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.st-prog{height:3px;max-width:980px;width:100%;margin:14px auto 0;border-radius:99px;background:var(--line);overflow:hidden}
.st-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent-2),var(--accent));box-shadow:0 0 12px var(--accent-glow);transition:width .6s var(--ease)}
.st-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;width:100%;max-width:980px;margin:0 auto;padding:18px 0;min-height:0}
.st-main .stage{flex:none}
.st-bottom{max-width:720px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.answer-box{display:flex;gap:10px;width:min(660px,100%)}
.answer-box .input{height:52px;font-size:16px;background:var(--glass);backdrop-filter:blur(12px)}
.verdict{display:flex;align-items:center;gap:16px;width:min(660px,100%);padding:14px 16px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(14px);animation:rise .5s var(--ease) both}
.verdict .ring{width:56px;height:56px}
.verdict .ring text{font:600 14px var(--f-mono);fill:var(--text)}
.verdict b{display:block;font:600 16px/1.2 var(--f-body)}
.verdict small{display:flex;align-items:center;gap:6px;font:400 11px/1.3 var(--f-mono);color:var(--muted);margin-top:4px}
.verdict .chips{margin-top:8px}
.thinking{display:inline-flex;gap:4px}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:dots 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes dots{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grade{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 8px;border-radius:15px;border:1px solid var(--glass-brd);background:var(--glass);backdrop-filter:blur(14px);
  transition:transform .3s var(--spring),border-color .25s,box-shadow .3s;color:var(--text)}
.grade:hover{transform:translateY(-3px)}
.grade b{font-weight:600;font-size:14.5px}
.grade span{font:400 11px/1 var(--f-mono);color:var(--muted)}
.grade kbd{position:absolute;top:8px;right:9px;font-size:9px;padding:3px 5px}
.grade[data-g="1"]{--gc:var(--again)}.grade[data-g="2"]{--gc:var(--hard)}.grade[data-g="3"]{--gc:var(--good)}.grade[data-g="4"]{--gc:var(--easy)}
.grade b{color:var(--gc)}
.grade:hover,.grade.sugg{border-color:color-mix(in srgb,var(--gc) 55%,transparent);box-shadow:0 14px 30px -16px var(--gc)}
.grade.sugg::after{content:"Suggéré";position:absolute;top:-9px;left:50%;transform:translateX(-50%);font:600 9px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:99px;background:var(--gc);color:var(--bg)}
.reveal-btn{width:100%}
.st-tools{display:flex;gap:8px;align-items:center}
.tutor{width:min(660px,100%);padding:18px 20px;border-radius:18px;background:var(--glass);border:1px solid rgba(255,178,63,.25);backdrop-filter:blur(14px);animation:rise .5s var(--ease) both;max-height:34vh;overflow:auto}
.tutor-h{display:flex;align-items:center;gap:8px;font:500 10.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text);margin-bottom:10px}
.tutor p{margin:0;white-space:pre-wrap;color:var(--text);font-size:15px;line-height:1.6}
@media (max-width:620px){
  .st-top{flex-wrap:wrap;row-gap:10px}
  .st-title{order:2;flex-basis:100%}
  .st-tools{order:1;margin-left:auto}
  .st-tools .icon-btn{width:38px;height:38px}
  .grades{gap:7px}.grade{padding:10px 4px}.grade kbd{display:none}

  linear-gradient(var(--bg-2),var(--bg-2)) padding-box;transition:border-color .3s,background .3s}

/* ── 3. FSRS-5 — l'algorithme de répétition espacée ───────────────────
   R(t,S) = (1 + F·t/S)^-0.5 : probabilité de se souvenir après t jours
   quand la stabilité de la mémoire vaut S jours. Paramètres par défaut FSRS-5. */

  function schedule(srs, g, now = Date.now(), ret = 0.9) {

      else if (g === 3) { c.state = 1; c.due = now + 10 * MIN; }
      else { c.state = 2; c.due = now + ivlDays(c.s, ret) * DAY; }

      else { c.state = 2; c.due = now + Math.max(ivlDays(c.s, ret), 2) * DAY; }
    } else {

      if (g === 1) {
        c.lapses++; c.s = sForget(c.d, c.s, r); c.d = nextD(c.d, 1); c.state = 3; c.due = now + 10 * MIN;
      } else {

        const iv = {}, ss = {};

        iv[2] = Math.min(iv[2], iv[3]); iv[3] = Math.max(iv[3], iv[2] + 1); iv[4] = Math.max(iv[4], iv[3] + 1);

/* ── 4. État & stockage ──────────────────────────────────────────────

    b.className = 'sync ' + state; b.querySelector('span').textContent = txt;
  },
  async connect() {
    if (!window.claude?.use) return;

    try { [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } catch { return; }
    if (!db || !user) return;
    let id = null; try { id = await user.id(); } catch { }
    if (!id) return;

      } else if (!S.demo) {

  assemble(docs) {

    const deckDocs = docs.filter(d => d.id.startsWith('deck_') && !d.id.includes('~'));

  merge(remote) {

  },

const STOP = new Set('le la les l un une des de du d et ou au aux en dans par pour sur avec sans ce cet cette ces se sa son ses leur leurs qui que qu quoi dont lequel laquelle lesquels lesquelles auquel duquel est sont etre c s a y il elle ils elles on ne pas plus tres the an of to and or in on is are be it its for with as by at from that this which'.split(' '));

  if (a === b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}

  const a = normTxt(answer), b = normTxt(expected);
  if (!a) return { score: 0, verdict: 'incorrect', missing: [], comment: '', grade: 1, ai: false };
  const words = String(expected).split(/[\s,;:()«»"'’.!?/]+/).filter(w => w && !STOP.has(normTxt(w)) && normTxt(w).length > 1);
  const ta = a.split(' ').filter(w => !STOP.has(w)).map(stem);
  const tb = words.map(w => stem(normTxt(w)));
  const matched = tb.map(t => ta.some(x => near(x, t)));
  const recall = tb.length ? matched.filter(Boolean).length / tb.length : 0;
  const prec = ta.length ? ta.filter(x => tb.some(t => near(x, t))).length / ta.length : 0;
  const f1 = recall + prec ? 2 * recall * prec / (recall + prec) : 0;

  const missing = [...new Set(words.filter((w, i) => !matched[i]))].sort((x, y) => y.length - x.length).slice(0, 3);

const Neural = {

        p.t += p.v; const a = nodes[p.a], b = nodes[p.b];
        const x = a.x + (b.x - a.x) * p.t, y = a.y + (b.y - a.y) * p.t;
        cx.fillStyle = `rgba(${col.fire},.95)`; cx.beginPath(); cx.arc(x, y, 2.2, 0, 6.283); cx.fill();
        cx.strokeStyle = `rgba(${col.fire},.5)`; cx.lineWidth = 1.6; cx.beginPath(); cx.moveTo(a.x + (b.x - a.x) * Math.max(0, p.t - .25), a.y + (b.y - a.y) * Math.max(0, p.t - .25)); cx.lineTo(x, y); cx.stroke(); cx.lineWidth = 1;
        if (p.t >= 1) {
          b.e = 1;
          if (p.depth > 1) for (const j of this.neighbors(p.b)) if (j !== p.a && Math.random() < .55) next.push({ a: p.b, b: j, t: 0, v: .02 + Math.random() * .02, depth: p.depth - 1 });
        } else next.push(p);
      }
      this.pulses = next.slice(0, 260);
    };
    this.raf = requestAnimationFrame(step);
  }
};

/* ════════════════════════════════════════════════════════════════════
   APP — navigation, vues, composants
   ════════════════════════════════════════════════════════════════════ */
const DECK_COLORS = { amber: '#FFB23F', ice: '#8FB0FF', mint: '#4FD1A5', rose: '#FF7AA2', violet: '#B69CFF', sand: '#E3C08A' };
const LANGS = { fr: 'Français', en: 'Anglais', es: 'Espagnol', de: 'Allemand', it: 'Italien' };
const TTS_LANG = { fr: 'fr-FR', en: 'en-US', es: 'es-ES', de: 'de-DE', it: 'it-IT' };
const TYPE_LABEL = { basic: 'Q/R', cloze: 'Trous', mcq: 'QCM', tf: 'Vrai/Faux', occlusion: 'Image' };

/* ── Composants ────────────────────────────────────────────────────── */
function ring(p, size = 54, sw = 5, label = '') {
  const r = (size - sw) / 2, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="width:${size}px;height:${size}px" aria-hidden="true">
    <circle class="rt" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${sw}"/>
    <circle class="rv" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${sw}" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${c * (1 - clamp(p, 0, 1))}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
    ${label ? `<text x="50%" y="53%" text-anchor="middle" dominant-baseline="middle">${label}</text>` : ''}</svg>`;
}
function glyph(deck, size = 54) {
  const R = rng(hash(deck.id + deck.name)); const col = DECK_COLORS[deck.color] || DECK_COLORS.amber;
  const c = 27, n = 6 + Math.floor(R() * 3);
  const pts = Array.from({ length: n }, (_, i) => { const a = i / n * Math.PI * 2 + R() * .7; const r = 11 + R() * 11; return [c + Math.cos(a) * r, c + Math.sin(a) * r]; });
  let lines = pts.map(([x, y]) => `<line x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`).join('');
  for (let i = 0; i < n; i++) if (R() > .45) { const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % n]; lines += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" opacity=".5"/>`; }
  const dots = pts.map(([x, y], i) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${i % 3 ? 1.6 : 2.3}"/>`).join('');
  return `<svg class="glyph" viewBox="0 0 54 54" style="width:${size}px;height:${size}px" aria-hidden="true">
    <g stroke="${col}" stroke-width="1" opacity=".75">${lines}</g><g fill="${col}">${dots}</g>
    <circle cx="${c}" cy="${c}" r="7" fill="${col}" opacity=".18"/><circle cx="${c}" cy="${c}" r="3.6" fill="${col}"/></svg>`;
}
function matBar(cards) {
  const m = maturity(cards), t = cards.length || 1;
  return `<div class="mat" role="img" aria-label="${m.n} nouvelles, ${m.l} en apprentissage, ${m.y} jeunes, ${m.m} maîtrisées">${['n', 'l', 'y', 'm'].map(k => m[k] ? `<i style="width:${m[k] / t * 100}%;background:${ST_COLORS[k]}" data-tip="${m[k]} ${ST_LABELS[k].toLowerCase()}"></i>` : '').join('')}</div>`;
}
function stateColor(c) { const s = c.srs; return s.state === 0 ? ST_COLORS.n : s.state !== 2 ? ST_COLORS.l : s.s >= 21 ? ST_COLORS.m : ST_COLORS.y; }
function plain(s) { return String(s || '').replace(/\{\{c\d+::(.*?)(?:::.*?)?\}\}/g, '$1').replace(/\*\*|`/g, ''); }
function cardTitle(c) { return c.type === 'cloze' ? plain(c.text) : c.type === 'occlusion' ? (c.front || 'Image') + ' — ' + (c.masks?.[c.maskIdx]?.label || '') : c.front; }
function cardAnswer(c) { return c.type === 'cloze' ? (renderCloze(c.text, c.n).ans) : c.type === 'mcq' ? c.options?.[c.answer] : c.type === 'tf' ? (c.answer ? 'Vrai' : 'Faux') : c.type === 'occlusion' ? c.masks?.[c.maskIdx]?.label : c.back; }

function renderCloze(text, n) {
  const re = /\{\{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g;
  let f = '', b = '', q = '', last = 0, ans = '';
  for (const m of String(text).matchAll(re)) {
    const pre = text.slice(last, m.index); f += md(pre); b += md(pre); q += pre;
    if (+m[1] === n) { ans = m[2]; f += `<span class="cloze">${m[3] ? esc(m[3]) : '[…]'}</span>`; b += `<mark class="cloze-ans">${esc(m[2])}</mark>`; q += '[…]'; }
    else { f += esc(m[2]); b += esc(m[2]); q += m[2]; }
    last = m.index + m[0].length;
  }
  const tail = text.slice(last); f += md(tail); b += md(tail); q += tail;
  return { f, b, q, ans };
}

/* Les deux faces d'une fiche. o.choice = réponse cliquée (QCM / Vrai-Faux). */
function cardFaces(c, o = {}) {
  const extra = c.extra ? `<div class="extra">${md(c.extra)}</div>` : '';
  if (c.type === 'cloze') {
    const r = renderCloze(c.text || '', c.n || 1);
    return { question: r.q, expected: r.ans, front: `<div class="q-text">${r.f}</div>`, back: `<div class="q-text">${r.b}</div>${extra}` };
  }
  if (c.type === 'mcq') {
    const opts = (c.options || []).map((t, i) => `<button class="opt" data-act="choose" data-i="${i}"><b>${'ABCDEF'[i]}</b><span>${md(t)}</span></button>`).join('');
    const optsBack = (c.options || []).map((t, i) => `<div class="opt ${i === c.answer ? 'right' : i === o.choice ? 'wrong' : ''}"><b>${i === c.answer ? '✓' : 'ABCDEF'[i]}</b><span>${md(t)}</span></div>`).join('');
    return { question: c.front, expected: c.options?.[c.answer] || '', front: `<div class="q-text">${md(c.front)}</div><div class="opts">${opts}</div>`, back: `<div class="q-small">${md(c.front)}</div><div class="opts">${optsBack}</div>${c.back ? `<div class="extra">${md(c.back)}</div>` : ''}` };
  }
  if (c.type === 'tf') {
    return {
      question: c.front, expected: c.answer ? 'Vrai' : 'Faux',
      front: `<div class="q-text">${md(c.front)}</div><div class="tf"><button class="opt" data-act="choose" data-i="1"><b>V</b>Vrai</button><button class="opt" data-act="choose" data-i="0"><b>F</b>Faux</button></div>`,
      back: `<div class="q-small">${md(c.front)}</div><div class="a-text">${c.answer ? 'Vrai' : 'Faux'}</div>${c.back ? `<div class="extra">${md(c.back)}</div>` : ''}`
    };
  }
  if (c.type === 'occlusion') {
    const src = S.images[c.img];
    const masks = (rev) => (c.masks || []).map((m, i) => `<div class="m ${i === c.maskIdx ? (rev ? 'rev' : 't') : ''}" style="left:${m.x * 100}%;top:${m.y * 100}%;width:${m.w * 100}%;height:${m.h * 100}%">${i === c.maskIdx && !rev ? '?' : ''}</div>`).join('');
    const im = src ? `<img src="${src}" alt="">` : `<div style="padding:40px;text-align:center">Image introuvable</div>`;
    const label = c.masks?.[c.maskIdx]?.label || '';
    return {
      question: c.front || 'Nommez la zone masquée', expected: label,
      front: `<div class="q-small">${esc(c.front || 'Que cache le masque orange ?')}</div><div class="occ">${im}${masks(false)}</div>`,
      back: `<div class="occ">${im}${masks(true)}</div>${label ? `<div class="a-text" style="font-size:22px">${esc(label)}</div>` : ''}`
    };
  }
  return { question: c.front, expected: c.back, front: `<div class="q-text">${md(c.front)}</div>`, back: `<div class="q-small">${md(c.front)}</div><div class="a-text">${md(c.back)}</div>${extra}` };
}

/* ── Toasts, modales, infobulles ──────────────────────────────────── */
function toast(msg, ic = 'check') {
  const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = icon(ic) + `<span>${esc(msg)}</span>`;
  $('#toasts').append(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, 3200);
}
const Modal = {
  stack: [],
  open(html, cls = '') {
    const back = document.createElement('div'); back.className = 'modal-back';
    back.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;
    back.addEventListener('pointerdown', e => { if (e.target === back) back._downOnBack = true; });
    back.addEventListener('click', e => { if (e.target === back && back._downOnBack) this.close(); back._downOnBack = false; });
    $('#modals').append(back); this.stack.push(back);
    setTimeout(() => back.querySelector('[autofocus]')?.focus() || back.querySelector('.modal').focus?.(), 60);
    return back.querySelector('.modal');
  },
  close() { const b = this.stack.pop(); if (!b) return; b.style.transition = 'opacity .2s'; b.style.opacity = 0; setTimeout(() => b.remove(), 200); b._onclose?.(); },
  get top() { return this.stack[this.stack.length - 1]?.querySelector('.modal'); }
};
const mh = (title, sub = '') => `<div class="modal-h"><div>${sub ? `<div class="eyebrow">${sub}</div>` : ''}<h2 style="margin-top:${sub ? 8 : 0}px">${title}</h2></div><button class="icon-btn" data-act="close" aria-label="Fermer">${icon('x')}</button></div>`;

async function saveFile(filename, data) {
  let dl = null; try { dl = await window.claude?.use?.('downloads'); } catch { }
  if (dl) {
    try { await dl.save({ filename, data }); toast('Fichier prêt : ' + filename, 'download'); return; }
    catch (e) { if (e?.code === 'declined') return; }
  }
  // Repli : afficher le contenu à copier.
  const m = Modal.open(mh('Copiez votre fichier', filename) + `<p class="muted" style="margin-top:0">Le téléchargement direct n'est pas disponible ici. Copiez ce contenu et enregistrez-le sous <b>${esc(filename)}</b>.</p><textarea class="textarea" id="copyArea" style="min-height:260px;font:12px/1.5 var(--f-mono)" readonly>${esc(typeof data === 'string' ? data : '')}</textarea><div class="modal-f"><button class="btn btn-primary" data-act="copyArea">${icon('check')}Copier</button></div>`);
  m.querySelector('#copyArea').select();
}

function countUp(el, to) {
  if (REDUCED || to === 0) { el.textContent = to.toLocaleString('fr-FR'); return; }
  const t0 = performance.now(), dur = 900 + Math.min(600, to * 8), dec = +(el.dataset.dec || 0);

  requestAnimationFrame(tick);
}

function heatmap(weeks = 20) {
  const today = new Date(dayStart() - 4 * HOUR + 12 * HOUR);
  const dow = (today.getDay() + 6) % 7; // 0 = lundi
  const start = new Date(today); start.setDate(start.getDate() - dow - (weeks - 1) * 7);
  let cells = '', i = 0;
  const lvl = r => !r ? 0 : r < 15 ? 1 : r < 35 ? 2 : r < 60 ? 3 : 4;
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1), i++) {
    const k = dayKey(d.getTime() + 4 * HOUR + 1); const l = S.profile.log[k]; const r = l?.r || 0;
    const lab = `${r ? plural(r, 'révision', 'révisions') : 'Aucune révision'} · ${FR_DAYS[d.getDay()].slice(0, 3)}. ${d.getDate()} ${FR_MONTHS[d.getMonth()]}`;
    cells += `<i data-l="${lvl(r)}" class="${k === dayKey() ? 'today' : ''}" data-tip="${lab}" style="animation-delay:${Math.min(i * 6, 700)}ms"></i>`;
  }
  return `<div class="heat-wrap"><div class="heat" role="img" aria-label="Activité des ${weeks} dernières semaines">${cells}</div></div>
    <div class="heat-legend"><span>Moins</span>${[0, 1, 2, 3, 4].map(l => `<i style="background:var(--heat-${l})"></i>`).join('')}<span>Plus</span></div>`;
}
function forecast(days = 7) {
  const cards = S.decks.flatMap(d => d.cards).filter(c => !c.suspended);
  const base = dayStart();
  const counts = Array(days).fill(0);
  for (const c of cards) {
    if (c.srs.state === 0) continue;
    const idx = c.srs.due < base + DAY ? 0 : Math.floor((c.srs.due - base) / DAY);
    if (idx < days) counts[idx]++;
  }
  const max = Math.max(1, ...counts);
  const lab = i => i === 0 ? 'Auj.' : i === 1 ? 'Dem.' : FR_DAYS[new Date(base + i * DAY + 6 * HOUR).getDay()].slice(0, 3) + '.';
  return `<div class="bars" role="img" aria-label="Révisions prévues">${counts.map((n, i) => `<div class="bar" data-tip="${plural(n, 'carte prévue', 'cartes prévues')} · ${lab(i)}"><em>${n && (days <= 10 || n === max) ? n : ''}</em><b class="${n ? '' : 'zero'}" style="height:max(2px, calc((100% - 36px) * ${(n / max).toFixed(3)}));animation-delay:${i * 60}ms"></b><span>${days > 10 && i % 2 ? '' : lab(i)}</span></div>`).join('')}</div>`;
}
function reviewBars(days = 30) {
  const arr = []; for (let i = days - 1; i >= 0; i--) { const t = Date.now() - i * DAY; arr.push([t, S.profile.log[dayKey(t)]?.r || 0]); }
  const max = Math.max(1, ...arr.map(a => a[1]));
  return `<div class="bars" style="gap:4px;height:140px" role="img" aria-label="Révisions des ${days} derniers jours">${arr.map(([t, n], i) => { const d = new Date(t - 4 * HOUR); return `<div class="bar" data-tip="${plural(n, 'révision', 'révisions')} · ${d.getDate()} ${FR_MONTHS[d.getMonth()]}"><b class="${n ? '' : 'zero'}" style="height:max(2px, calc((100% - 18px) * ${(n / max).toFixed(3)}));animation-delay:${i * 18}ms;max-width:16px"></b><span>${i % 7 === 0 || i === days - 1 ? d.getDate() : ''}</span></div>`; }).join('')}</div>`;
}

Hooks.stats = () => {
  const box = $('#curveBox'), inp = $('#curveDays'), out = $('#curveOut'); if (!box) return;
  const cards = S.decks.flatMap(d => d.cards).filter(c => c.srs.state === 2 && c.srs.s > 0);
  const ss = cards.map(c => c.srs.s).sort((a, b) => a - b); const med = ss.length ? ss[Math.floor(ss.length / 2)] : 10;
  const W = 720, H = 240, pl = 40, pr = 16, pt = 14, pb = 28, T = 60;
  const x = t => pl + t / T * (W - pl - pr), y = r => pt + (1 - r) * (H - pt - pb);
  const path = s => Array.from({ length: 61 }, (_, t) => `${t ? 'L' : 'M'}${x(t).toFixed(1)},${y(FSRS.R(t, s)).toFixed(1)}`).join('');
  const once = FSRS.S0(3);
  const draw = () => {
    const t = +inp.value;
    const avg = cards.length ? cards.reduce((a, c) => a + FSRS.retrievability(c.srs, Date.now() + t * DAY), 0) / cards.length : FSRS.R(t, med);
    box.innerHTML = `<svg class="curve" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbes de rétention">
      ${[0, .25, .5, .75, 1].map(r => `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${y(r)}" y2="${y(r)}"/><text x="${pl - 8}" y="${y(r) + 3}" text-anchor="end">${r * 100}%</text>`).join('')}
      ${[0, 10, 20, 30, 40, 50, 60].map(d => `<text x="${x(d)}" y="${H - 8}" text-anchor="middle">${d} j</text>`).join('')}
      <path d="${path(once)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 5"/>
      <path d="${path(med)} L${x(60)},${y(0)} L${x(0)},${y(0)} Z" fill="var(--accent-soft)" stroke="none"/>
      <path d="${path(med)}" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <line x1="${x(t)}" x2="${x(t)}" y1="${pt}" y2="${H - pb}" stroke="var(--line-2)"/>
      <circle cx="${x(t)}" cy="${y(FSRS.R(t, med))}" r="5" fill="var(--accent)" stroke="var(--bg-3)" stroke-width="2"/>
      <circle cx="${x(t)}" cy="${y(FSRS.R(t, once))}" r="4" fill="var(--muted)" stroke="var(--bg-3)" stroke-width="2"/>
      <text class="lbl" x="${x(34)}" y="${y(FSRS.R(34, med)) - 10}">Vos cartes (stabilité médiane ${Math.round(med)} j)</text>
      <text class="lbl" x="${x(44)}" y="${y(FSRS.R(44, once)) + 24}" text-anchor="middle">Notion vue une seule fois</text>
    </svg>`;
    out.innerHTML = `Dans <b class="tnum">${t} j</b>, vous retiendrez en moyenne <b class="tnum" style="color:var(--accent-text)">${Math.round(avg * 100)} %</b> de vos cartes sans réviser, contre ${Math.round(FSRS.R(t, once) * 100)} % pour une notion vue une seule fois.`;
  };
  inp.addEventListener('input', draw); draw();
};

/* Masquage d'image (image occlusion) */
async function compressImage(file, max = 1100) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), q = 0.8, out = '';
    for (let k = 0; k < 6; k++) {
      const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * scale); cv.height = Math.round(img.naturalHeight * scale);
      const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
      out = cv.toDataURL('image/jpeg', q);
      if (out.length < 240000) break; q -= 0.1; scale *= 0.85;
    }
    return out;
  } finally { URL.revokeObjectURL(url); }
}

  const m = Modal.open(`<div id="ocRoot"></div>`, 'wide');

      <p class="muted" style="margin-top:0">Glissez sur l'image pour masquer une légende. Chaque masque devient une carte : les autres restent cachés pendant la question.</p>
      <div class="editor-grid">
        <div class="occ-edit" id="ocImg"><img src="${st.src}" alt="">${st.masks.map((k, i) => `<div class="m" style="left:${k.x * 100}%;top:${k.y * 100}%;width:${k.w * 100}%;height:${k.h * 100}%">${i + 1}</div>`).join('')}</div>

          ${AI.images ? `<button class="btn" id="ocAI">${icon('sparkles')}Détecter les légendes avec l'IA <span class="tag">bêta</span></button><div class="muted" id="ocAIout" style="font-size:13px"></div>` : ''}

      const pos = e => { const r = box.getBoundingClientRect(); return [clamp((e.clientX - r.left) / r.width, 0, 1), clamp((e.clientY - r.top) / r.height, 0, 1)]; };
      box.addEventListener('pointerdown', e => { start = pos(e); el = document.createElement('div'); el.className = 'm draft'; box.append(el); box.setPointerCapture(e.pointerId); });
      box.addEventListener('pointermove', e => { if (!start) return; const [x, y] = pos(e); Object.assign(el.style, { left: Math.min(x, start[0]) * 100 + '%', top: Math.min(y, start[1]) * 100 + '%', width: Math.abs(x - start[0]) * 100 + '%', height: Math.abs(y - start[1]) * 100 + '%' }); });
      box.addEventListener('pointerup', e => { if (!start) return; const [x, y] = pos(e); const k = { x: Math.min(x, start[0]), y: Math.min(y, start[1]), w: Math.abs(x - start[0]), h: Math.abs(y - start[1]), label: '' }; start = null; if (k.w > .015 && k.h > .015) { readLabels(); st.masks.push(k); } draw(); setTimeout(() => m.querySelector(`[data-lab="${st.masks.length - 1}"]`)?.focus(), 30); });
    }
    root.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { readLabels(); st.masks.splice(+b.dataset.rm, 1); draw(); });
    root.querySelector('#ocAI')?.addEventListener('click', async ev => {
      const btn = ev.currentTarget, out = root.querySelector('#ocAIout'); btn.disabled = true; out.innerHTML = '<span class="thinking"><i></i><i></i><i></i></span> Analyse du schéma…';
      try {
        const blob = st.file || dataUrlToBlob(st.src);
        const r = await AI.json(`Voici un schéma légendé. Repère chaque étiquette de texte (légende) visible sur l'image. Pour chacune, donne son texte exact et le rectangle qui l'entoure, en coordonnées relatives à l'image (0 = bord gauche/haut, 1 = bord droit/bas). Réponds uniquement avec un JSON : [{"label": "...", "x": 0.00, "y": 0.00, "w": 0.00, "h": 0.00}] (au plus 20 éléments).`, { images: blob, cache: false });
        const add = (Array.isArray(r) ? r : r?.labels || []).map(o => ({ x: clamp(+o.x || 0, 0, 1), y: clamp(+o.y || 0, 0, 1), w: clamp(+o.w || 0, 0, 1), h: clamp(+o.h || 0, 0, 1), label: String(o.label || '') })).filter(o => o.w > .005 && o.h > .005);
        readLabels(); st.masks.push(...add); draw();
        const o2 = m.querySelector('#ocAIout'); if (o2) o2.textContent = add.length ? `✓ ${add.length} légendes détectées. Ajustez si besoin.` : 'Aucune légende détectée.';
      } catch (e) { out.textContent = AI.fail(e); btn.disabled = false; }
    });
    root.querySelector('#ocSave')?.addEventListener('click', () => {
      readLabels(); st.title = root.querySelector('#ocTitle').value.trim() || 'Nommez la zone masquée';
      if (!st.imgId) { st.imgId = uid('img'); S.images[st.imgId] = st.src; Store.dirty.add('img:' + st.imgId); }
      const note = existing?.note || uid('n');
      if (existing) {
        const kept = st.masks.map((k, i) => { const old = sibs.find(s => s.maskIdx === i); return old ? Object.assign(old, { masks: st.masks, front: st.title }) : mkCard('occlusion', { img: st.imgId, masks: st.masks, maskIdx: i, note, front: st.title, src: 'manuel' }); });
        deck.cards = deck.cards.filter(c => c.note !== note).concat(kept);
      } else {
        if (S.demo) Store.leaveDemo(false);
        deck.cards.push(...st.masks.map((k, i) => mkCard('occlusion', { img: st.imgId, masks: st.masks, maskIdx: i, note, front: st.title, src: 'manuel' })));
      }
      Store.touchDeck(deck); Store.touch('img:' + st.imgId); Modal.close(); App.render(); toast(existing ? 'Cartes mises à jour' : plural(st.masks.length, 'carte créée', 'cartes créées'), 'image');
    });
  };
  const readLabels = () => m.querySelectorAll('[data-lab]').forEach(i => { if (st.masks[+i.dataset.lab]) st.masks[+i.dataset.lab].label = i.value.trim(); });
  draw();
}

/* Import / export */
function parseImport(name, text) {
  const base = name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim() || 'Import';
  const strip = s => String(s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').trim();
  if (/^\s*[\[{]/.test(text)) {
    const j = JSON.parse(text);
    if (j && Array.isArray(j.decks)) return { images: j.images || {}, decks: j.decks.map(d => ({ ...d, id: uid('d'), example: false, cards: (d.cards || []).map(c => ({ ...c, id: uid('c'), srs: c.srs || FSRS.blank(), tags: c.tags || [] })) })) };
    const arr = Array.isArray(j) ? j : j.cards || [];
    return { images: {}, decks: [{ name: base, cards: arr.map(o => mkCard('basic', { front: strip(o.front ?? o.question ?? o.q), back: strip(o.back ?? o.answer ?? o.a), src: 'import' })).filter(c => c.front && c.back) }] };
  }
  const lines = text.split(/\r?\n/).filter(l => l.trim() && !l.startsWith('#'));
  const sep = lines.some(l => l.includes('\t')) ? '\t' : lines.some(l => l.includes(';')) ? ';' : ',';
  const split = l => { if (sep === '\t') return l.split('\t'); const out = []; let cur = '', q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === sep && !q) { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out; };
  const cards = [];
  for (const l of lines) {
    const [a, b, extra] = split(l).map(strip);
    if (!a || !b) continue;
    if (/^(front|recto|question)$/i.test(a)) continue;
    if (/\{\{c\d+::/.test(a)) cards.push(...clozeCards(a, { src: 'import' }));
    else cards.push(mkCard('basic', { front: a, back: b, extra: extra || undefined, src: 'import' }));
  }
  return { images: {}, decks: [{ name: base, cards }] };
}
function csvEscape(s) { s = String(s ?? ''); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function exportDeckCSV(d) {
  const rows = [['recto', 'verso', 'type', 'etiquettes'].join(';')];
  for (const c of d.cards) { if (c.type === 'occlusion') continue; if (c.type === 'cloze' && c.n > 1 && d.cards.some(x => x.note === c.note && x.n < c.n)) continue; rows.push([c.type === 'cloze' ? c.text : c.front, cardAnswer(c), c.type, (c.tags || []).join(' ')].map(csvEscape).join(';')); }
  return rows.join('\n');
}

function openPalette() {
  const m = Modal.open(`<div class="search">${icon('search')}<input class="input" id="palIn" placeholder="Chercher une carte, un paquet, une action…" autocomplete="off" autofocus></div><div class="pal-list" id="palList"></div>`, 'palette');
  const actions = [
    ['Réviser maintenant', 'play', () => Study.start()], ['Scanner un cours', 'camera', () => App.go('scan')], ['Nouvelle carte', 'plus', () => openEditor(null, App.route.v === 'deck' ? App.route.arg : S.decks[0]?.id)],
    ['Nouveau paquet', 'layers', () => openNewDeck()], ['Examen blanc', 'timer', () => App.go('exam')], ['Statistiques', 'chart', () => App.go('stats')],
    ['Importer des cartes', 'upload', () => $('#fileImport').click()], ['Réglages', 'settings', () => App.go('settings')], ['Engram Pro', 'crown', () => openPro()]
  ];
  let items = [], sel = 0;
  const draw = () => {
    const q = normTxt(m.querySelector('#palIn').value);
    const acts = actions.filter(a => !q || normTxt(a[0]).includes(q)).map(a => ({ label: a[0], ic: a[1], run: a[2], sec: 'Actions' }));
    const decks = S.decks.filter(d => !q || normTxt(d.name).includes(q)).slice(0, 6).map(d => ({ label: d.name, ic: 'layers', run: () => App.go('deck', d.id), sec: 'Paquets', meta: plural(d.cards.length, 'carte', 'cartes') }));
    const cards = q.length > 1 ? allCards().filter(c => normTxt(cardTitle(c) + ' ' + cardAnswer(c)).includes(q)).slice(0, 8).map(c => ({ label: cardTitle(c), ic: 'file', run: () => openEditor(c.id), sec: 'Cartes', meta: c._deck.name })) : [];
    items = [...acts, ...decks, ...cards]; sel = clamp(sel, 0, Math.max(0, items.length - 1));
    let last = ''; m.querySelector('#palList').innerHTML = items.map((it, i) => { const h = it.sec !== last ? `<div class="pal-sec">${it.sec}</div>` : ''; last = it.sec; return h + `<button class="pal-item ${i === sel ? 'on' : ''}" data-i="${i}">${icon(it.ic, 'i-sm')}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.label)}</span>${it.meta ? `<small>${esc(it.meta)}</small>` : ''}</button>`; }).join('') || '<div class="empty" style="padding:28px">Rien trouvé.</div>';
  };
  const run = i => { const it = items[i]; if (!it) return; Modal.close(); setTimeout(it.run, 50); };
  m.querySelector('#palIn').addEventListener('input', () => { sel = 0; draw(); });
  m.querySelector('#palIn').addEventListener('keydown', e => { if (e.key === 'ArrowDown') { sel = Math.min(items.length - 1, sel + 1); draw(); e.preventDefault(); } if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); } if (e.key === 'Enter') run(sel); });
  m.querySelector('#palList').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) run(+b.dataset.i); });
  draw();
}

/* Mode écoute : le paquet lu comme un podcast de révision */
function openListen(deckId) {
  const d = deckById(deckId); if (!d) return;
  if (!('speechSynthesis' in window)) { toast('La synthèse vocale n\'est pas disponible sur cet appareil.', 'volume'); return; }
  const cards = shuffle(d.cards.filter(c => c.type !== 'occlusion')).slice(0, 40);
  let i = 0, playing = false, stopFlag = false, rate = 1;
  const m = Modal.open(mh('Mode écoute', esc(d.name)) + `<div style="display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;padding:10px 0 4px">
    <div class="eyebrow tnum" id="lsCount"></div><div id="lsQ" style="font:500 24px/1.3 var(--f-display);min-height:64px;text-wrap:balance"></div><div id="lsA" class="muted" style="min-height:24px;font-size:16px"></div>
    <div style="display:flex;gap:12px;align-items:center"><button class="icon-btn" id="lsRate" style="width:auto;padding:0 12px;font:500 12px var(--f-mono)">1×</button><button class="btn btn-primary btn-xl" id="lsPlay" style="width:64px;padding:0;border-radius:50%">${icon('play')}</button><button class="icon-btn" id="lsNext">${icon('skip')}</button></div>
    <div class="muted" style="font-size:13px">Question, pause de 4 secondes pour répondre dans votre tête, puis la réponse.</div></div>`);
  const say = (text, lang) => new Promise(res => { const u = new SpeechSynthesisUtterance(plain(text)); u.lang = lang; u.rate = rate; u.onend = res; u.onerror = res; speechSynthesis.speak(u); });
  const show = () => { const c = cards[i]; if (!c) return; m.querySelector('#lsCount').textContent = `${i + 1} / ${cards.length}`; m.querySelector('#lsQ').textContent = plain(cardFaces(c).question); m.querySelector('#lsA').textContent = ''; };
  const loop = async () => {
    while (playing && i < cards.length && !stopFlag) {
      const c = cards[i]; show(); const f = cardFaces(c);
      const lq = c.dir === 'fr→en' ? 'fr-FR' : TTS_LANG[d.lang] || 'fr-FR', la = c.dir === 'en→fr' ? 'fr-FR' : c.dir === 'fr→en' ? 'en-US' : lq;
      await say(f.question, lq); if (!playing) break; await sleep(4000 / rate); if (!playing) break;
      m.querySelector('#lsA').textContent = plain(f.expected); await say(f.expected, la); if (!playing) break; await sleep(1200); i++;
    }
    if (i >= cards.length) { playing = false; m.querySelector('#lsPlay').innerHTML = icon('play'); m.querySelector('#lsQ').textContent = 'Écoute terminée. Bravo !'; i = 0; }
  };
  m.querySelector('#lsPlay').onclick = () => { playing = !playing; m.querySelector('#lsPlay').innerHTML = icon(playing ? 'pause' : 'play'); if (playing) loop(); else speechSynthesis.cancel(); };
  m.querySelector('#lsNext').onclick = () => { speechSynthesis.cancel(); i = Math.min(cards.length - 1, i + 1); show(); };
  m.querySelector('#lsRate').onclick = e => { rate = rate === 1 ? 1.25 : rate === 1.25 ? 1.5 : rate === 1.5 ? 0.85 : 1; e.currentTarget.textContent = String(rate).replace('.', ',') + '×'; };
  m.closest('.modal-back')._onclose = () => { stopFlag = true; playing = false; speechSynthesis.cancel(); };
  show();
}
function speak(text, lang = 'fr-FR') { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(plain(text)); u.lang = lang; speechSynthesis.speak(u); } catch { } }

function bootApp() {
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    if (a.tagName === 'A') e.preventDefault();

  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches?.('[role="link"][data-act]')) { e.target.click(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (!Modal.stack.length) openPalette(); return; }
    if (e.key === 'Escape' && Modal.stack.length) { Modal.close(); e.preventDefault(); return; }

    const typing = /input|textarea|select/i.test(e.target.tagName) || e.target.isContentEditable;
    if (Study.active) { Study.key(e, typing); return; }

  });
  // Projecteur qui suit le pointeur sur les panneaux.

  }, { passive: true });

    const r = el.getBoundingClientRect(); tip.textContent = el.dataset.tip; tip.hidden = false;
    tip.style.left = clamp(r.left + r.width / 2, 90, innerWidth - 90) + 'px'; tip.style.top = r.top + 'px';
  });
  addEventListener('scroll', () => tip.hidden = true, { passive: true });
  $('#fileImport').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;

      if (!decks.length) { toast('Aucune carte reconnue. Format attendu : recto;verso par ligne.', 'file'); return; }
      if (S.demo) Store.leaveDemo(false);
      let n = 0;
      for (const [k, v] of Object.entries(parsed.images || {})) if (typeof v === 'string' && v.startsWith('data:image/')) { S.images[k] = v; Store.dirty.add('img:' + k); }
      for (const d of decks) { const nd = { id: d.id || uid('d'), name: d.name, desc: d.desc || '', color: d.color || pick(Object.keys(DECK_COLORS)), lang: d.lang || 'fr', created: Date.now(), updatedAt: Date.now(), cards: d.cards }; S.decks.unshift(nd); n += d.cards.length; Store.touchDeck(nd); }
      Store.touch('profile'); App.go('deck', S.decks[0].id); toast(`${plural(n, 'carte importée', 'cartes importées')}`, 'upload');
    } catch { toast('Fichier illisible. Utilisez un JSON Engram, un CSV ou un TSV.', 'file'); }
  });
  window.addEventListener('beforeunload', () => { if (Store.dirty.size) Store.flush(); });
}

/* ════════════════════════════════════════════════════════════════════
   SESSION DE RÉVISION
   File d'attente façon Anki : cartes en apprentissage d'abord, puis
   révisions, avec les nouvelles intercalées. Correction par l'IA
   (ou localement), prof virtuel après les erreurs, annulation.
   ════════════════════════════════════════════════════════════════════ */
const Study = {
  active: false, queue: [], learn: [], cur: null, deck: null, flipped: false, mode: 'flip', choice: null, verdict: null,
  t0: 0, stats: null, history: [], ctl: null, tutorCtl: null, fails: {}, wake: null, cram: false, total: 0,

  build(deckId, cram) {
    const decks = deckId ? [deckById(deckId)].filter(Boolean) : S.decks;
    const cards = decks.flatMap(d => d.cards.map(c => [c, d])).filter(([c]) => !c.suspended);
    if (cram) {
      // Révision en avance : les cartes les plus fragiles d'abord.
      return cards.filter(([c]) => c.srs.state > 0).sort((a, b) => FSRS.retrievability(a[0].srs) - FSRS.retrievability(b[0].srs)).slice(0, 20)
        .concat(cards.filter(([c]) => c.srs.state === 0).slice(0, 5));
    }
    const now = Date.now();
    const newLeft = Math.max(0, S.profile.settings.newPerDay - (S.profile.log[dayKey()]?.n || 0));
    const learning = cards.filter(([c]) => (c.srs.state === 1 || c.srs.state === 3) && isDue(c, now)).sort((a, b) => a[0].srs.due - b[0].srs.due);
    const reviews = shuffle(cards.filter(([c]) => c.srs.state === 2 && isDue(c, now))).sort((a, b) => FSRS.retrievability(a[0].srs) - FSRS.retrievability(b[0].srs));
    const fresh = cards.filter(([c]) => c.srs.state === 0).slice(0, newLeft);
    // Une seule carte par note le même jour (les « sœurs » attendent demain), comme Anki.
    const seen = new Set(); const dedupe = arr => arr.filter(([c]) => { if (!c.note) return true; if (seen.has(c.note)) return false; seen.add(c.note); return true; });
    const rev = dedupe(reviews), nw = dedupe(fresh);
    const mixed = []; let ni = 0;
    rev.forEach((x, i) => { mixed.push(x); if ((i + 1) % 4 === 0 && ni < nw.length) mixed.push(nw[ni++]); });
    while (ni < nw.length) mixed.push(nw[ni++]);
    return learning.concat(mixed);
  },
  start(o = {}) {
    const items = o.items || this.build(o.deckId, o.cram);
    if (!items.length) {
      toast(o.cram ? 'Aucune carte à réviser dans ce paquet.' : 'Rien à réviser pour le moment. Revenez plus tard !', 'check');
      return;
    }
    this.active = true; this.queue = items.slice(); this.learn = []; this.cram = !!o.cram; this.total = items.length;
    this.deckName = o.title || (o.deckId ? deckById(o.deckId)?.name : 'Toutes les cartes');
    this.mode = S.profile.settings.answerMode; this.history = []; this.fails = {};
    this.stats = { n: 0, ok: 0, xp: 0, t0: Date.now(), g: [0, 0, 0, 0, 0] };
    document.body.classList.add('studying');
    const el = $('#study'); el.hidden = false;
    try { navigator.wakeLock?.request('screen').then(w => this.wake = w).catch(() => { }); } catch { }
    this.next();
  },
  close(silent) {

/* Explosion de particules ambrées à la fin d'une session */
function burst() {
  if (REDUCED) return;
  const cv = $('#burst'); cv.hidden = false; const cx = cv.getContext('2d');
  const dpr = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ['#FFB23F', '#FFD48A', '#FF8A3D', '#93B4FF', '#4FD1A5', '#F3EFE4'];
  const ps = Array.from({ length: 150 }, () => { const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 9; return { x: innerWidth / 2, y: innerHeight * .38, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, r: 2 + Math.random() * 4, c: pick(cols), rot: Math.random() * 6, vr: (Math.random() - .5) * .3, card: Math.random() < .35 }; });
  let t = 0;
  const step = () => {
    t++; cx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) {
      p.vy += .18; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.globalAlpha = Math.max(0, 1 - t / 130); cx.fillStyle = p.c;
      if (p.card) cx.fillRect(-p.r * 1.4, -p.r, p.r * 2.8, p.r * 2); else { cx.beginPath(); cx.arc(0, 0, p.r, 0, 6.283); cx.fill(); }
      cx.restore();
    }
    if (t < 130) requestAnimationFrame(step); else { cx.clearRect(0, 0, innerWidth, innerHeight); cv.hidden = true; }
  };
  requestAnimationFrame(step);
}

    if (opts.length < 2 || !str(o.front || o.question)) return null;
    let ans = typeof o.answer === 'number' ? o.answer : parseInt(o.answer, 10);
