    <section class="sec" id="sAI"><div class="sec-h"><div><h2 class="h2">${t('IA et Mentor')}</h2><p>${t('Création de fiches depuis une photo, correction des réponses, prof virtuel, fiches de synthèse, et Mentor, l\'assistant qui agit dans l\'app pour vous.')}</p></div></div>
    <article class="panel rise"><div class="settings">
      ${setRow(t('Formule'), Pro.on ? (Pro.trial ? t('Essai de Pro Expert : encore {n}.', { n: tp(Pro.daysLeft(), '{n} jour|{n} jours') }) : t('Scans, corrections, Mentor et assistants sans limite.')) : t('Ce mois-ci : {a} sur 3, {b} sur 20 à Mentor, {c} sur 3.', { a: plural(Pro.usage().scan || 0, 'scan|scans'), b: plural(Pro.usage().mentor || 0, 'message|messages'), c: plural(Pro.usage().agent || 0, 'mission|missions') }), `<button class="btn btn-sm ${Pro.on ? '' : 'btn-gilt'}" data-act="go" data-v="pro">${icon('crown', 'i-sm')}${Pro.on ? esc(Pro.name()) : t('Découvrir Pro')}</button>`)}
      ${setRow(t('État'), via, `<span class="pill ${AI.on ? 'on' : ''}"><i></i>${aiTxt}${AI.on ? (AI.images ? ' · ' + t('photos ✓') : ' · ' + t('texte seul')) + (AI.tools ? ' · ' + t('actions ✓') : '') : ''}</span>`)}
      ${setRow(t('Puissance de Mentor'), t(MENTOR_TIERS[s.mentorTier][1]), segCtl('mentorTier', Object.entries(MENTOR_TIERS).map(([k, v]) => [k, t(v[0])]), s.mentorTier))}
      ${setRow(t('Ton de Mentor et du prof'), t(TONES[s.tone].desc), segCtl('tone', Object.entries(TONES).map(([k, v]) => [k, t(v.label)]), s.tone))}
      <div class="set-row col"><div class="t"><b>${t('Ce que Mentor retient de vous')}</b><span>${t('Mentor note ce qui l\'aide à vous accompagner (vos points faibles, vos préférences). Vous pouvez tout relire et effacer.')}</span></div>
        <div class="memory" id="memList">${S.profile.memory.length ? S.profile.memory.map((m, i) => `<div class="mem-row"><span>${esc(m)}</span><button class="icon-btn" data-forget="${i}" aria-label="${esc(t('Oublier'))}">${icon('x', 'i-sm')}</button></div>`).join('') : `<span class="muted" style="font-size:13px">${t('Rien pour le moment.')}</span>`}
        <form class="mem-add" id="memAdd"><input class="input" id="memIn" placeholder="${esc(t('Ex. Je confonds souvent mitose et méiose'))}"><button class="btn btn-sm">${icon('plus', 'i-sm')}${t('Ajouter')}</button></form></div></div>
      <div class="set-row col" id="sServer"><div class="t"><b>${t('Serveur IA (hors de l\'app Claude)')}</b><span>${t("Dans l'app Claude, rien à configurer. Ailleurs, lancez le serveur Engram (dossier engram/server) qui détient votre clé d'API ; l'adresse /api/ai est détectée automatiquement.")}</span></div>
        <div class="two" style="width:100%"><div class="field"><label for="aiSrv">${t('Adresse du serveur')}</label><input class="input" id="aiSrv" value="${esc(s.aiServer)}" placeholder="https://…/api/ai"></div><div class="field"><label for="aiCode">${t("Code d'accès")}</label><input class="input" id="aiCode" type="password" value="${esc(s.aiCode)}" placeholder="${esc(t('Si le serveur en demande un'))}"></div></div>
        <button class="btn btn-sm" id="aiRecheck">${icon('link', 'i-sm')}${t('Se connecter')}</button></div>
    </div></article></section>

    <section class="sec" id="sData"><div class="sec-h"><div><h2 class="h2">${t('Données et intégrations')}</h2></div></div>
    <article class="panel rise"><div class="settings">
      ${setRow(t('Synchronisation'), Store.mode === 'cloud' ? t('Vos paquets sont enregistrés dans votre espace privé et suivent votre compte sur tous vos appareils.') : S.demo ? t("Les exemples restent sur cet appareil. Vos propres paquets seront synchronisés dès leur création, dans l'app Claude.") : t('Enregistré sur cet appareil.'), `<span class="pill ${Store.mode === 'cloud' ? 'on' : ''}"><i></i>${Store.mode === 'cloud' ? t('Synchronisé') : t('Local')}</span>`)}
      ${setRow(t('Intégrations'), t('Anki, Quizlet, Excel, Google Sheets, Notion, PDF, Google Agenda, Outlook et Apple Calendrier : importer, exporter, planifier.'), `<button class="btn btn-sm btn-brass" data-act="go" data-v="links">${icon('link', 'i-sm')}${t('Ouvrir')}</button>`)}
      ${setRow(t('Sauvegarde'), t('Tous vos paquets, notes, examens et profil dans un seul fichier.'), `<button class="btn btn-sm" data-act="backup">${icon('download', 'i-sm')}${t('Exporter (.json)')}</button>`)}
      ${setRow(t("Revoir l'accueil"), t('Relancer la présentation du premier démarrage.'), `<button class="btn btn-sm" data-act="onboard">${icon('eye', 'i-sm')}${t('Revoir')}</button>`)}
      ${setRow(t('Réinitialiser'), S.demo ? t("Retirer les paquets d'exemple et repartir de zéro.") : t('Supprimer définitivement tous vos paquets et votre historique.'), `<button class="btn btn-sm btn-danger" data-act="${S.demo ? 'clearDemo' : 'wipe'}">${icon('trash', 'i-sm')}${S.demo ? t('Effacer les exemples') : t('Tout effacer')}</button>`)}
    </div></article></section>

    <article class="panel rise"><div class="panel-h"><h3 class="h3">${t('Raccourcis clavier')}</h3>${icon('keyboard')}</div>
      <div class="legend" style="gap:10px 22px">${[[t('Espace'), t('Retourner / valider')], ['1 2 3 4', t('Noter la fiche')], [t('A–D · V/F'), t('QCM, vrai/faux')], ['/', t('Parler à Mentor')], ['Ctrl K', t('Recherche')], ['E', t('Modifier')], ['T', t('Lire à voix haute')], ['Z', t('Annuler')], [t('Échap'), t('Quitter')]].map(([k, l]) => `<span><kbd>${k}</kbd>${l}</span>`).join('')}</div>
    </article>`;
};
Hooks.settings = arg => {
  const s = S.profile.settings, st = S.profile.study;
  const bind = (id, key, outId, fmt) => { const el = $('#' + id); el?.addEventListener('input', () => { s[key] = +el.value; $('#' + outId).textContent = fmt(+el.value); Store.touch('profile'); }); };
  bind('setRet', 'retention', 'retOut', v => pct(v));
  bind('setNew', 'newPerDay', 'newOut', v => v);
  bind('setGoal', 'goal', 'goalOut', v => v);
  const look = new Set(['font', 'textSize', 'density', 'cardStyle', 'anim']);
  $$('[data-seg]').forEach(seg => seg.addEventListener('click', e => {
    const b = e.target.closest('[data-val]'); if (!b) return;
    const k = seg.dataset.seg;
    if (k === 'mentorTier' && b.dataset.val === 'complex' && !Pro.expert) { Pro.upsell('expert'); return; }
    s[k] = k === 'textSize' ? +b.dataset.val : b.dataset.val; Store.touch('profile');
    $$('button', seg).forEach(x => x.classList.toggle('on', x === b));
    if (k === 'ambient' && b.dataset.val !== 'off') { Ambient.set(b.dataset.val); setTimeout(() => Ambient.set('off'), 2500); }
    if (look.has(k)) Custom.apply();
    if (['mentorTier', 'tone', 'strict'].includes(k)) { const row = seg.closest('.set-row'); const sp = row?.querySelector('.t span'); if (sp) sp.textContent = k === 'mentorTier' ? t(MENTOR_TIERS[s[k]][1]) : k === 'tone' ? t(TONES[s[k]].desc) : t(STRICT[s[k]].desc) + '. ' + t('La correction accepte synonymes et reformulations selon le niveau choisi.'); }
  }));
  $$('[data-study]').forEach(seg => seg.addEventListener('click', e => { const b = e.target.closest('[data-val]'); if (!b) return; st[seg.dataset.study] = b.dataset.val; Store.touch('profile'); $$('button', seg).forEach(x => x.classList.toggle('on', x === b)); }));
  $$('[data-toggle]').forEach(x => x.addEventListener('click', () => { const k = x.dataset.toggle; s[k] = !s[k]; x.classList.toggle('on', s[k]); x.setAttribute('aria-pressed', s[k]); Store.touch('profile'); if (k === 'desk') Custom.apply(); if (k === 'followPlan') App.chrome(); }));
  $('#skins')?.addEventListener('click', e => { const b = e.target.closest('[data-skin]'); if (!b) return; s.skin = b.dataset.skin; Store.touch('profile'); $$('#skins .skin').forEach(x => x.classList.toggle('on', x === b)); Custom.apply(); });
  $('#accents')?.addEventListener('click', e => { const b = e.target.closest('[data-accent]'); if (!b) return; s.accent = b.dataset.accent; Store.touch('profile'); $$('#accents .accent').forEach(x => x.classList.toggle('on', x === b)); Custom.apply(); });
  $$('[data-setlang]').forEach(b => b.addEventListener('click', () => changeLang(b.dataset.setlang)));
  $('#stName')?.addEventListener('change', e => { st.name = e.target.value.trim().slice(0, 40); Store.touch('profile'); });
  $('#stAim')?.addEventListener('change', e => { st.aim = e.target.value; Store.touch('profile'); });
  $('#stLevel')?.addEventListener('change', e => { st.level = e.target.value; Scan.level = st.level; Store.touch('profile'); });
  $$('#stWeek input').forEach(inp => inp.addEventListener('input', () => { const i = +inp.dataset.wd; st.weekly[i] = +inp.value; $('#wdOut' + i).textContent = inp.value; Store.touch('profile'); }));
  $('#memList')?.addEventListener('click', e => { const b = e.target.closest('[data-forget]'); if (!b) return; S.profile.memory.splice(+b.dataset.forget, 1); Store.touch('profile'); App.render(); });
  $('#memAdd')?.addEventListener('submit', e => { e.preventDefault(); const v = $('#memIn').value.trim(); if (!v) return; S.profile.memory.push(v.slice(0, 200)); Store.touch('profile'); App.render(); });
  $('#aiRecheck')?.addEventListener('click', async () => { s.aiServer = $('#aiSrv').value.trim(); s.aiCode = $('#aiCode').value.trim(); Store.touch('profile'); if (AI.via !== 'claude') { AI.status = 'checking'; await AI.probeServer(); AI.changed(); toast(AI.on ? t('Serveur IA connecté') : t('Serveur IA introuvable'), AI.on ? 'check' : 'x'); App.render(); } });
  $$('.set-nav [data-jump]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); $('#' + a.dataset.jump)?.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' }); }));
  if (arg === 'look') setTimeout(() => $('#sLook')?.scrollIntoView({ block: 'start' }), 60);
};

/* ── Premier lancement : langue, profil, rythme, examen, apparence ─── */
const Onb = {
  step: 0, st: null, N: 5,
  open() { this.step = 0; this.st = { ...S.profile.study, weekly: S.profile.study.weekly.slice(), rhythm: 25, exam: '', date: '', skin: S.profile.settings.skin, tone: S.profile.settings.tone }; const el = $('#onb'); el.hidden = false; this.render(); },
  seal() {
    return `<svg class="onb-seal" viewBox="0 0 200 200" aria-hidden="true"><defs><path id="ringP" d="M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0"/></defs>
      <circle cx="100" cy="100" r="96" fill="none" stroke="var(--brass)" stroke-width="1.5"/><circle cx="100" cy="100" r="62" fill="none" stroke="var(--brass)" stroke-width="1.2"/>
      <g class="spin"><text font-family="Courier Prime, monospace" font-weight="700" font-size="12.5" fill="var(--brass-text)"><textPath href="#ringP" textLength="484" lengthAdjust="spacing">${esc(t('PHOTOGRAPHIEZ · RETENEZ · SALLE DE LECTURE · '))}</textPath></text></g>
      <text x="100" y="126" text-anchor="middle" font-family="Gloock, Georgia, serif" font-size="76" fill="var(--text)">E</text></svg>`;
  },
  render() {
    const el = $('#onb'), o = this.st; const dots = `<div class="dots">${Array.from({ length: this.N }, (_, i) => `<i class="${i === this.step ? 'on' : ''}"></i>`).join('')}</div>`;

  read() { const n = $('#oName'); if (n) this.st.name = n.value.trim().slice(0, 40); const e = $('#oExam'), d = $('#oDate'); if (e) this.st.exam = e.value.trim(); if (d) this.st.date = d.value; },
  click(e) {
    const lb = e.target.closest('[data-onb-lang]'); if (lb) { changeLang(lb.dataset.onbLang); this.render(); return; }
    const ch = e.target.closest('.choice, .skin'); if (ch && ch.parentElement.dataset.grp) {
      this.read(); const grp = ch.parentElement.dataset.grp; this.st[grp] = grp === 'rhythm' ? +ch.dataset.v : ch.dataset.v;
      if (grp === 'skin') { S.profile.settings.skin = this.st.skin; Custom.apply(); }
      this.render(); return;
    }
    const b = e.target.closest('[data-onb]'); if (!b) return;
    this.read();
    const a = b.dataset.onb;
    if (a === 'next') { this.step = Math.min(this.N - 1, this.step + 1); this.render(); }
    else if (a === 'back') { this.step = Math.max(0, this.step - 1); this.render(); }
    else if (a === 'finish') this.finish();
  },
  finish() {
    const o = this.st, p = S.profile;
    const r = o.rhythm; p.study = { ...p.study, name: o.name, aim: o.aim, level: o.level, time: o.time, weekly: [r, r, r, r, r, Math.round(r * 1.3 / 5) * 5, Math.round(r * 0.6 / 5) * 5] };
    p.settings.skin = o.skin; p.settings.tone = o.tone; p.settings.goal = clamp(Math.round(r * 60 / 9 / 10) * 10, 20, 300);
    if (o.date) { p.exams = p.exams.filter(x => !x.example); p.exams.push({ id: uid('x'), name: o.exam || t('Examen'), date: o.date, deckIds: [] }); }
    p.onboarded = true; Scan.level = o.level;
    Store.touch('profile'); Custom.apply();
    const el = $('#onb'); el.style.transition = 'opacity .5s'; el.style.opacity = 0; setTimeout(() => { el.hidden = true; el.style.opacity = ''; el.innerHTML = ''; }, 500);
    App.render(true);
  }
};

/* ════════════════════════════════════════════════════════════════════
   SÉANCE DE RÉVISION
   File d'attente façon Anki (apprentissage → révisions, nouvelles
   intercalées). Chaque note est tamponnée sur la fiche, puis la fiche
   s'envole vers son compartiment de la boîte. Correction par l'IA (ou
   locale), dictée, prof virtuel, annulation, bordereau de fin.
   ════════════════════════════════════════════════════════════════════ */
const Study = {
  active: false, queue: [], learn: [], cur: null, flipped: false, mode: 'flip', choice: null, verdict: null, typed: '',
  order: [], pool: [], t0: 0, stats: null, history: [], ctl: null, tutorCtl: null, fails: {}, wake: null, cram: false, busy: false, tok: 0, scope: [], summaryOn: false,

  build(deckId, cram, weak) {
    const decks = deckId ? [deckById(deckId)].filter(Boolean) : S.decks;
    const cards = decks.flatMap(d => d.cards.map(c => [c, d])).filter(([c]) => !c.suspended);
    if (cram) {
      // Révision en avance : les fiches les plus fragiles d'abord.
      return cards.filter(([c]) => c.srs.state > 0).sort((a, b) => FSRS.retrievability(a[0].srs) - FSRS.retrievability(b[0].srs)).slice(0, 20)
        .concat(cards.filter(([c]) => c.srs.state === 0).slice(0, 5));
    }
    if (weak) {
      // Atelier des points faibles : oubliées plusieurs fois, ou mémoire estimée basse.
      return shuffle(cards.filter(([c]) => c.srs.state > 0 && ((c.srs.lapses || 0) >= 2 || FSRS.retrievability(c.srs) < 0.8 || c.srs.d > 7.5))).slice(0, 25);
    }
    const now = Date.now();
    const learning = cards.filter(([c]) => (c.srs.state === 1 || c.srs.state === 3) && isDue(c, now)).sort((a, b) => a[0].srs.due - b[0].srs.due);
    const reviews = shuffle(cards.filter(([c]) => c.srs.state === 2 && isDue(c, now))).sort((a, b) => FSRS.retrievability(a[0].srs) - FSRS.retrievability(b[0].srs));
    let fresh;
    if (planQuota()) fresh = decks.flatMap(d => d.cards.filter(c => c.srs.state === 0 && !c.suspended).slice(0, newAllowance(d.id)).map(c => [c, d]));
    else fresh = cards.filter(([c]) => c.srs.state === 0).slice(0, newAllowance());
    // Une seule fiche « sœur » par note le même jour, comme dans Anki.
    const seen = new Set(); const dedupe = arr => arr.filter(([c]) => { if (!c.note) return true; if (seen.has(c.note)) return false; seen.add(c.note); return true; });
    const rev = dedupe(reviews), nw = dedupe(fresh);
    const mixed = []; let ni = 0;
    rev.forEach((x, i) => { mixed.push(x); if ((i + 1) % 4 === 0 && ni < nw.length) mixed.push(nw[ni++]); });
    while (ni < nw.length) mixed.push(nw[ni++]);
    return learning.concat(mixed);
  },
  start(o = {}) {
    const items = o.items || this.build(o.deckId, o.cram, o.weak);
    if (!items.length) { toast(o.cram || o.weak ? t('Aucune fiche à réviser dans ce paquet.') : t('Rien à réviser pour le moment. Revenez plus tard !'), 'check'); return; }
    if (Mentor.isOpen) Mentor.close();
    this.active = true; this.summaryOn = false; this.queue = items.slice(); this.learn = []; this.cram = !!o.cram;
    this.deckName = o.title || (o.deckId ? deckById(o.deckId)?.name : o.weak ? t('Points faibles') : t('Toutes les fiches'));
    this.scope = o.deckId ? [deckById(o.deckId)] : [...new Set(items.map(x => x[1]))];
    this.mode = S.profile.settings.answerMode; this.history = []; this.fails = {};
    this.stats = { n: 0, ok: 0, xp: 0, t0: Date.now(), g: [0, 0, 0, 0, 0], wrong: [] }; this.lvl0 = level().i;
    document.body.classList.add('studying');
    $('#study').hidden = false;
    if (!this.lampBound && matchMedia('(hover:hover)').matches) {
      this.lampBound = true; let raf = 0;
      $('#study').addEventListener('pointermove', e => {
        if (raf || REDUCED || e.pointerType === 'touch') return;
        raf = requestAnimationFrame(() => { raf = 0; const el = $('#study'); el.style.setProperty('--lx', (30 + 40 * e.clientX / innerWidth).toFixed(1) + '%'); el.style.setProperty('--ly', (26 + 32 * e.clientY / innerHeight).toFixed(1) + '%'); });
      });
    }
    if (S.profile.settings.ambient !== 'off') Ambient.set(S.profile.settings.ambient);
    try { navigator.wakeLock?.request('screen').then(w => this.wake = w).catch(() => { }); } catch { }
    this.next();
  },
  close(silent) {
    this.active = false; this.summaryOn = false; this.cur = null; this.busy = false; this.tok++;
    this.ctl?.abort(); this.tutorCtl?.abort(); Dictation.stop(); Ambient.stop();
    this.pad?.destroy(); this.scratchPad?.destroy(); this.pad = this.scratchPad = null;
    try { speechSynthesis.cancel(); } catch { }
    try { this.wake?.release(); } catch { } this.wake = null;
    const el = $('#study'); el.hidden = true; el.innerHTML = '';
    document.body.classList.remove('studying');
    if (!silent) App.render();
  },
  counts() {
    const m = { n: 0, l: 0, r: 0 };
    for (const [c] of [...this.queue, ...this.learn.map(l => l.item)]) { if (c.srs.state === 0) m.n++; else if (c.srs.state === 2) m.r++; else m.l++; }
    return m;
  },
  next() {
    this.busy = false;
    const now = Date.now();
    this.learn.sort((a, b) => a.due - b.due);
    let item = null;
    const li = this.learn.findIndex(l => l.due <= now);
    if (li >= 0) item = this.learn.splice(li, 1)[0].item;
    else if (this.queue.length) item = this.queue.shift();
    else if (this.learn.length) item = this.learn.shift().item; // on avance les fiches en apprentissage
    if (!item) return this.summary();
    this.cur = item; this.flipped = false; this.choice = null; this.verdict = null; this.typed = ''; this.inkURL = ''; this.t0 = Date.now();
    this.order = []; this.pool = item[0].type === 'order' ? shuffle((item[0].items || []).map((_, i) => i)) : [];
    this.render(true);
    if (S.profile.settings.tts) this.speakCur();
  },
  typeable(c, f) { return ['basic', 'cloze', 'occlusion'].includes(c.type) && !!f.expected; },
  miniBox() {
    const m = maturity(this.scope.filter(Boolean).flatMap(d => d.cards));
    return `<div class="mini-box" id="miniBox" aria-hidden="true">${COMP.map(k => `<div class="mini-comp" data-c="${k}" style="--c:${ST_COLORS[k]}">${m[k]}</div>`).join('')}</div>`;
  },
  render(enter = false) {
    if (!this.cur) { if (this.summaryOn) this.summary(true); return; }
    const [c, d] = this.cur; const f = cardFaces(c, { choice: this.choice, order: this.order, pool: this.pool });
    const cnt = this.counts(); const kind = c.srs.state === 0 ? 'n' : c.srs.state === 2 ? 'r' : 'l';
    const done = this.stats.n; const prog = done / Math.max(1, done + this.queue.length + this.learn.length + 1);
    const typeable = this.typeable(c, f);
    const showInput = this.mode === 'type' && typeable && !this.flipped;
    const showInk = this.mode === 'ink' && typeable && !this.flipped;
    const amb = S.profile.settings.ambient;
    this.pad?.destroy(); this.pad = null; this.scratchPad?.destroy(); this.scratchPad = null;
    $('#study').innerHTML = `
      <div class="st-top">
        <button class="icon-btn" data-act="st-close" aria-label="${esc(t('Quitter la séance'))}">${icon('x')}</button>
        <div class="st-title"><b>${esc(this.deckName)}</b>
          <div class="st-counts tnum"><span style="color:var(--st-n)" class="${kind === 'n' ? 'cur' : ''}">${t('Nouv.')} ${cnt.n + (kind === 'n' ? 1 : 0)}</span><span style="color:var(--st-l)" class="${kind === 'l' ? 'cur' : ''}">${t('En cours')} ${cnt.l + (kind === 'l' ? 1 : 0)}</span><span style="color:var(--st-m)" class="${kind === 'r' ? 'cur' : ''}">${t('À revoir')} ${cnt.r + (kind === 'r' ? 1 : 0)}</span></div></div>
        <div class="st-tools">
          ${typeable ? `<div class="seg" role="group" aria-label="${esc(t('Façon de répondre'))}"><button class="${this.mode === 'flip' ? 'on' : ''}" data-act="st-mode" data-m="flip" data-tip="${esc(t('Retourner'))}">${icon('flip', 'i-sm')}</button><button class="${this.mode === 'type' ? 'on' : ''}" data-act="st-mode" data-m="type" data-tip="${esc(t('Écrire la réponse'))}">${icon('type', 'i-sm')}</button><button class="${this.mode === 'ink' ? 'on' : ''}" data-act="st-mode" data-m="ink" data-tip="${esc(t('Répondre à la main (stylet)'))}">${icon('nib', 'i-sm')}</button></div>` : ''}
          <button class="icon-btn" data-act="st-scratch" data-tip="${esc(t('Brouillon : annoter au stylet'))}">${icon('scribble')}</button>
          <button class="icon-btn ${amb !== 'off' ? 'on' : ''}" data-act="st-amb" data-tip="${esc(t('Ambiance : {x}', { x: t(AMBIENT_LABEL[amb]) }))}">${icon('music')}</button>
          <button class="icon-btn" data-act="st-speak" data-tip="${esc(t('Lire à voix haute (T)'))}">${icon('volume')}</button>
          <button class="icon-btn" data-act="st-undo" data-tip="${esc(t('Annuler la dernière note (Z)'))}" ${this.history.length ? '' : 'disabled'}>${icon('undo')}</button>
          <button class="icon-btn" data-act="st-edit" data-tip="${esc(t('Modifier la fiche (E)'))}">${icon('pen')}</button>
        </div>
      </div>
      <div class="st-prog"><i style="width:${prog * 100}%"></i></div>
      <div class="st-main ${showInk ? 'ink-on' : ''}">
        <div class="stage ${enter ? 'enter' : ''}" id="stage">
          <div class="card3d ${this.flipped ? 'flipped' : ''}" id="card3d">
            <div class="face front"><div class="face-head"><span>${esc(d.name)} · ${typeLabel(c.type)}${isLeech(c) ? ` · <span style="color:var(--pen)">${t('sangsue')}</span>` : ''}</span><span class="no">${t('N°')} ${cardNo(c)}</span></div>
              <div class="face-body" id="frontBody">${f.front}</div>${!['mcq', 'tf', 'order'].includes(c.type) && !showInput ? `<div class="card-hint">${t('Touchez pour retourner')}</div>` : ''}</div>
            <div class="face back"><div class="face-head"><span>${t('Réponse')} · ${esc(d.name)}</span><span class="no">${t('N°')} ${cardNo(c)}</span></div>
              <div class="face-body">${this.backHTML(f)}</div></div>
            <div class="swipe-tint" id="tint"></div>
          </div>
        </div>
        ${showInk ? `<div class="inkpad" id="inkPad">${inkSurface('inkAns', t('Écrivez votre réponse ici, au stylet ou au doigt'), 'ruled')}
          <div class="ink-row">${Ink.bar({ marker: false, colors: false })}<button type="button" class="btn btn-brass" data-act="st-inkcheck" id="inkGo" disabled>${icon('check')}${AI.images ? t('Faire corriger') : t('Comparer')}</button></div></div>` : ''}
        ${showInput ? `<form class="answer-box" id="ansForm" autocomplete="off"><input class="input" id="ans" placeholder="${esc(t('Votre réponse… (Entrée pour vérifier)'))}" aria-label="${esc(t('Votre réponse'))}">${Dictation.supported ? `<button type="button" class="icon-btn" id="micBtn" style="height:50px;width:50px" data-tip="${esc(t('Dicter la réponse'))}">${icon('mic')}</button>` : ''}<button class="btn btn-brass" style="height:50px">${icon('check')}${t('Vérifier')}</button></form>` : ''}
        <div id="verdictBox" style="display:contents">${this.verdictHTML() + this.tutorOfferHTML()}</div>
        <div id="tutorBox" style="display:contents"></div>
      </div>
      <div class="st-bottom">${this.bottomHTML(showInput || showInk)}</div>
      ${this.miniBox()}`;
    this.bindCard();
    if (showInk) this.pad = mountInk($('#inkPad'), '#inkAns', { onChange: p => { const b = $('#inkGo'); if (b) b.disabled = p.empty(); } });
    this.layout();
    if (showInput) setTimeout(() => $('#ans')?.focus(), 80);
    $('#ansForm')?.addEventListener('submit', e => { e.preventDefault(); this.check(); });
    $('#micBtn')?.addEventListener('click', () => this.dictate());
    requestAnimationFrame(() => $$('#study .rv').forEach(x => x.style.strokeDashoffset = x.dataset.off));
  },
  /* La fiche grandit si son contenu déborde (dans la place disponible), puis le texte est posé sur les lignes. */
  layout() {
    const card = $('#card3d'), main = $('#study .st-main'); if (!card || !main) return;
    const faces = [...card.querySelectorAll('.face')];
    card.style.height = ''; card.style.minHeight = '';
    faces.forEach(f => Ruling.snap(f, f.querySelector('.face-body'), false));
    const need = Math.max(...faces.map(f => { const b = f.querySelector('.face-body'); return b ? f.clientHeight - b.clientHeight + b.scrollHeight + 2 : 0; }));
    const items = [...main.children].flatMap(k => getComputedStyle(k).display === 'contents' ? [...k.children] : [k]).filter(k => k.offsetHeight);
    const ms = getComputedStyle(main), gap = parseFloat(ms.rowGap) || 0;
    const used = items.reduce((a, k) => a + k.offsetHeight, 0) + gap * Math.max(0, items.length - 1) + (parseFloat(ms.paddingTop) || 0) + (parseFloat(ms.paddingBottom) || 0);
    const base = card.offsetHeight, room = base + main.clientHeight - used;
    const h = Math.max(Math.min(Math.max(base, need), room), 220);
    if (Math.abs(h - base) > 1) { card.style.minHeight = '0px'; card.style.height = h + 'px'; }
    faces.forEach(f => Ruling.snap(f, f.querySelector('.face-body')));
    card.querySelectorAll('img').forEach(im => { if (!im.complete) im.addEventListener('load', () => this.layout(), { once: true }); });
  },
  backHTML(f) {
    const v = this.verdict;
    if (this.inkURL) return `<div class="your your-ink"><span>${t('Votre réponse :')}</span><img src="${this.inkURL}" alt="${esc(this.typed || t('Réponse manuscrite'))}" class="${v && v.verdict === 'incorrect' ? 'wrong' : ''}">${this.typed ? `<small>${t("Lu par l'IA :")} ${esc(this.typed)}</small>` : ''}</div>${f.back}${v?.comment ? `<div class="pen pen-in">${esc(v.comment)}</div>` : ''}`;
    return `${this.typed ? `<div class="your">${t('Votre réponse :')} ${v && v.verdict === 'incorrect' ? `<s>${esc(this.typed)}</s>` : esc(this.typed)}</div>` : ''}${f.back}${v?.comment ? `<div class="pen pen-in">${esc(v.comment)}</div>` : ''}`;
  },
  bottomHTML(showInput) {
    const [c] = this.cur;
    if (this.flipped) {
      const prev = FSRS.preview(c.srs, Date.now(), S.profile.settings.retention);

    if (!this.flipped && c.type === 'mcq' && k.length === 1 && 'abcd'.includes(k)) { this.choose('abcd'.indexOf(k)); return; }
    if (!this.flipped && c.type === 'tf' && k.length === 1) { const tk = trueLbl()[0].toLowerCase(), fk = falseLbl()[0].toLowerCase(); if (k === tk || k === fk) { this.choose(k === tk ? 1 : 0); return; } }
    if (k === 'z') { e.preventDefault(); this.undo(); return; }
    if (k === 'e') { e.preventDefault(); openEditor(c.id); return; }
    if (k === 't') { this.speakCur(); return; }
  },
  // Fin de séance : un bordereau s'imprime, puis le tampon « séance validée ».
  summary(redraw = false) {
    this.summaryOn = true; this.cur = null; this.busy = false; Ambient.stop();

          <div class="c">${esc(this.deckName)}</div>
          <hr>
          ${ln(t('Fiches révisées'), num(s.n))}${ln(t('Réussite'), pct(acc / 100))}${ln(t('Durée'), t('{n} min', { n: mins }))}${ln(t('XP gagnés'), '+' + num(s.xp))}${ln(t('Série'), plural(streak(), 'jour|jours'))}
          <hr>

        </div>

        </div>
      </div>`;
    if (redraw) return;
    if (s.n) { Sound.play('print'); setTimeout(() => this.summaryOn && Sound.play('stamp'), 1550); }

function genHTML(r, i) {

const DEF_VERBS = 'est|sont|désigne|désignent|correspond à|correspondent à|signifie|permet de|permettent de|a lieu|se déroule|fixe|produit|is|are|means|refers to|allows|takes place|occurs|produces|fixes|releases|es|son|significa|designa|permite|permiten|tiene lugar|ocurre|produce|fija|libera|ist|sind|bedeutet|bezeichnet|ermöglicht|findet|erzeugt|fixiert|é|são|designa|ocorre|produz|fixa|libera';

  const title = hasTitle ? lines[0] : t('Cours');

  const flat = lines.map(l => /[.!?]$/.test(l) ? l : l + '.').join(' ');
  const sentences = flat.split(/(?<=[.!?])\s+(?=[A-ZÀ-ÖØ-Ý0-9«¿¡„"])/).map(s => s.trim()).filter(s => s.length > 25 && s.length < 280);

  for (const l of lines) { const m = l.match(/^[-•*\d.)\s]*([^:–—]{2,60}?)\s*[:–—]\s+(.{8,})$/); if (m) defs.push([m[1].trim(), m[2].trim().replace(/\.$/, '')]); }

  for (const [x, d] of defs) out.basic.push({ type: 'basic', front: t('Que désigne le terme « {t} » ?', { t: x }), back: cap(d) });
  const re = new RegExp(`^(.{3,70}?)\\s+(${DEF_VERBS})\\s+(.{6,})$`, 'i');
  for (const s of sentences) {
    if (defs.some(([x]) => s.startsWith(x))) continue;
    const m = s.match(re);
    if (m) out.basic.push({ type: 'basic', front: `${cap(m[1])} ${m[2]}… ?`, back: cap(m[3].replace(/\.$/, '')) });
  }
  for (const s of sentences) {
    const numb = s.match(/\b\d{1,4}(?:[.,]\d+)?\s?(?:%|°C|km|kg|ans|years|años|Jahre|anos|siècles?)?(?=[\s.,;]|$)/);
    let target = numb?.[0]?.trim();
    if (!target) { const ws = s.split(/\s+/).map(w => w.replace(/^[«"„(']+|[.,;:!?)»"“']+$/g, '')).filter(w => w.length >= 7 && !STOP.has(normTxt(w))); target = ws.sort((a, b) => b.length - a.length)[0]; }

  }

}

function matchBuild() {
  const decks = Game.deckId ? [deckById(Game.deckId)].filter(Boolean) : S.decks;
  const pool = shuffle(decks.flatMap(d => d.cards).filter(c => ['basic', 'cloze', 'mcq'].includes(c.type)).map(c => { const f = cardFaces(c); return [plain(f.question), plain(f.expected)]; }).filter(([q, a]) => q && a && q.length < 110 && a.length < 70));
  const seen = new Set(); const pairs = [];
  for (const [q, a] of pool) { const k = normTxt(a); if (seen.has(k)) continue; seen.add(k); pairs.push([q, a]); if (pairs.length === 6) break; }
  Game.tiles = shuffle(pairs.flatMap(([q, a], k) => [{ k, t: q, ans: false }, { k, t: a, ans: true }]));
  Game.sel = null; Game.found = 0; Game.penalty = 0; Game.result = null; Game.pairs = pairs.length;
}

function buildExam() {
  const decks = Game.deckId ? [deckById(Game.deckId)].filter(Boolean) : S.decks;
  const pool = (Game.only || decks.flatMap(d => d.cards.map(c => [c, d]))).filter(([c]) => !['occlusion', 'order'].includes(c.type));
  const ans = (Game.only ? S.decks.flatMap(d => d.cards.map(c => [c, d])) : pool).filter(([c]) => !['occlusion', 'order'].includes(c.type)).filter(([c]) => !['mcq', 'tf'].includes(c.type)).map(([c, d]) => [plain(cardFaces(c).expected), d]).filter(([x]) => x && x.length < 120);
  const qs = [];
  for (const [c, d] of shuffle(pool)) {
    if (qs.length >= Game.n) break;
    if (c.type === 'mcq') { qs.push({ c, d, q: c.front, opts: shuffle(c.options.map((x, i) => ({ t: x, ok: i === c.answer }))), expl: c.back }); continue; }
    if (c.type === 'tf') { qs.push({ c, d, q: c.front, opts: [{ t: trueLbl(), ok: !!c.answer }, { t: falseLbl(), ok: !c.answer }], expl: c.back }); continue; }
    const f = cardFaces(c); const right = plain(f.expected); if (!right || right.length > 120) continue;
    // Distracteurs crédibles : même paquet d'abord, même nature (date/chiffre ou texte), longueur proche.
    const seen = new Set([normTxt(right)]); const digits = /\d/.test(right);
    const score = ([x, dd]) => (dd === d ? 0 : 1000) + (/\d/.test(x) === digits ? 0 : 200) + Math.abs(x.length - right.length);
    const others = ans.filter(([x]) => { const k = normTxt(x); if (seen.has(k)) return false; seen.add(k); return true; }).sort((a, b) => score(a) - score(b)).slice(0, 5).map(([x]) => x);
    const picks = shuffle(others).slice(0, 3); if (!picks.length) continue;
    qs.push({ c, d, q: plain(f.question), opts: shuffle([{ t: right, ok: true }, ...picks.map(x => ({ t: x, ok: false }))]), expl: c.extra || '' });
  }
  return qs;
}

/* ════════════════════════════════════════════════════════════════════
   PROGRAMME PERSONNALISÉ
   Simule les 28 prochains jours : révisions déjà prévues par FSRS,
   révisions induites par chaque nouvelle fiche, temps disponible jour

// Après son introduction, une nouvelle fiche revient en moyenne à J+1, J+3, J+9, J+25.
const ECHO = [[1, 0.35], [3, 1], [9, 0.9], [25, 0.8]];

    const decks = S.decks.map(d => ({ d, fresh: 0, done: log.nd?.[d.id] || 0, dl: this.deckDeadline(d) }));
    for (const x of decks) for (const c of x.d.cards) {
      if (c.suspended) continue;
      if (c.srs.state === 0) { x.fresh++; continue; }
      const idx = c.srs.due < base + DAY ? 0 : Math.floor((c.srs.due - base) / DAY);
      if (idx < days) rev[idx]++;
    }
    const remaining = Object.fromEntries(decks.map(x => [x.d.id, x.fresh + x.done]));
    const out = [];
    for (let i = 0; i < days; i++) {
      const date = new Date(base + i * DAY + 6 * HOUR);
      const wd = (date.getDay() + 6) % 7;
      const avail = wk[wd] || 0;
      const load = rev[i] + echo[i];
      const doneRev = i === 0 ? Math.max(0, (log.r || 0) - (log.n || 0)) : 0;
      let budget = Math.max(0, avail - (load + doneRev) * sec.rev / 60);
      const quota = {}; let newN = 0, urgent = false;
      // 1. Paquets avec examen : ce qu'il faut pour tout avoir vu à temps.
      for (const x of decks.filter(y => y.dl && remaining[y.d.id] > 0).sort((a, b) => a.dl.days - b.dl.days)) {
        const left = Math.max(1, x.dl.days - 2 - i);
        const need = Math.min(remaining[x.d.id], Math.ceil(remaining[x.d.id] / left));
        quota[x.d.id] = need; newN += need; budget -= need * sec.nw / 60;
        if (x.dl.days - 2 - i <= 0) urgent = true;
      }
      // 2. Les autres paquets se partagent le temps restant (plafond : réglage « nouvelles par jour »).
      const free = decks.filter(y => !y.dl && remaining[y.d.id] > 0);
      let room = Math.min(S.profile.settings.newPerDay, Math.max(0, Math.floor(budget * 60 / sec.nw)));
      if (!S.profile.settings.followPlan) room = 0;
      // Les nouvelles déjà vues aujourd'hui comptent dans le quota du jour.
      if (i === 0) for (const y of free) if (y.done) { const n = Math.min(y.done, remaining[y.d.id]); quota[y.d.id] = n; newN += n; room -= n; budget -= n * sec.nw / 60; }
      while (room > 0 && free.some(y => remaining[y.d.id] - (quota[y.d.id] || 0) > 0)) {
        for (const y of free) { if (room <= 0) break; if (remaining[y.d.id] - (quota[y.d.id] || 0) > 0) { quota[y.d.id] = (quota[y.d.id] || 0) + 1; newN++; room--; budget -= sec.nw / 60; } }
      }
      for (const [id, n] of Object.entries(quota)) { remaining[id] -= n; for (const [dd, w] of ECHO) echo[i + dd] += n * w; }
      const min = ((load + doneRev) * sec.rev + newN * sec.nw) / 60;
      out.push({ i, date, key: dayKey(date.getTime() + 4 * HOUR), avail, rev: Math.round(load), newN, min: Math.round(min), quota, urgent, over: min > avail + 3, exams: upcomingExams().filter(x => daysUntil(x.date) === i) });
    }
    const v = { days: out, remaining, sec };
    this.cache = { k, v };
    return v;
  },
  todayQuota() { return S.decks.length ? this.compute().days[0].quota : null; },
  todayNewTotal() { const q = this.todayQuota() || {}; return Object.values(q).reduce((a, b) => a + b, 0); },
  readiness(x) {
    if (!x) return null;
    const cards = examCards(x); if (!cards.length) return null;
    const at = keyToDate(x.date).getTime() + 9 * HOUR;
    const idle = cards.reduce((a, c) => a + (c.srs.state === 0 ? 0 : FSRS.retrievability(c.srs, at)), 0) / cards.length;
    const days = daysUntil(x.date), P = this.compute(Math.max(1, Math.min(28, days + 1)));
    const ids = new Set(x.deckIds?.length ? x.deckIds : S.decks.map(d => d.id));
    const planned = P.days.slice(0, Math.max(0, days - 1)).reduce((a, d) => a + Object.entries(d.quota).reduce((s, [id, n]) => s + (ids.has(id) ? n : 0), 0), 0);
    const seen = cards.filter(c => c.srs.state > 0).length;
    const coverage = Math.min(1, (seen + planned) / cards.length);
    const follow = coverage * Math.min(0.98, S.profile.settings.retention + 0.03);
    return { idle, follow, coverage, total: cards.length, seen, planned };
  },
  advice() {
    const P = this.compute(14), out = [];
    const over = P.days.filter(d => d.over);
    if (over.length) { const d = over[0]; out.push(['clock', t('{day} : {m} min prévues pour {a} disponibles. Ajoutez un peu de temps ce jour-là ou avancez des révisions la veille.', { day: cap(fmtDate(d.date, { weekday: 'long', day: 'numeric' })), m: d.min, a: d.avail })]); }
    for (const x of upcomingExams().slice(0, 3)) {
      const r = this.readiness(x); if (!r) continue;
      if (r.coverage < 0.95) {
        const days = Math.max(1, daysUntil(x.date) - 2), missing = r.total - r.seen - r.planned;
        const extra = Math.ceil(missing * P.sec.nw / 60 / days);
        out.push(['target', t('« {exam} » : à ce rythme, {p} des fiches seront vues à temps. Ajoutez environ {m} min par jour pour tout couvrir.', { exam: x.name, p: pct(r.coverage), m: extra })]);
      }
    }
    const leeches = S.decks.flatMap(d => d.cards).filter(isLeech).length;
    if (leeches >= 3) out.push(['bulb', t("{n} fiches ont été oubliées 4 fois ou plus. Passez-les à l'atelier des points faibles, ou demandez à Mentor de les reformuler.", { n: leeches })]);
    if (!upcomingExams().length) out.push(['cal', t("Ajoutez une date d'examen : le programme dosera les nouvelles fiches pour être prêt à temps.")]);
    const week = S.profile.study.weekly.reduce((a, b) => a + b, 0);
    if (week < 60) out.push(['clock', t('{m} min par semaine, c\'est peu pour retenir durablement : visez au moins 10 minutes par jour.', { m: week })]);
    if (!out.length) out.push(['check', t('Tout est sous contrôle. Tenez le rythme : la régularité compte plus que la durée.')]);
    return out;
  },
  blocks() {
    const c = todayCounts(), q = this.todayQuota() || {}, l = S.profile.log[dayKey()] || {};
    const learn = S.decks.flatMap(d => d.cards).filter(x => (x.srs.state === 1 || x.srs.state === 3) && isDue(x)).length;
    const rv = S.decks.map(d => [d, d.cards.filter(x => x.srs.state === 2 && isDue(x)).length]).filter(x => x[1]);
    const nw = S.decks.map(d => [d, S.profile.settings.followPlan ? Math.max(0, (q[d.id] || 0) - (l.nd?.[d.id] || 0)) : 0]).filter(x => x[1]);

  },
  todayStrip() {
    if (!S.decks.length) return '';
    const P = this.compute(7), d0 = P.days[0], b = this.blocks();
    const spent = Math.round((S.profile.log[dayKey()]?.ms || 0) / 60000);

      <div class="ps-h"><div><div class="kicker">${t('Programme du jour')}${S.profile.settings.followPlan ? '' : ' · ' + t('désactivé')}</div><h3 class="h2" style="font-size:clamp(24px,2.4vw,30px)">${left ? t('Encore {m} min, sur {a} prévues.', { m: left, a: d0.avail }) : t('Programme bouclé pour aujourd\'hui.')}</h3></div>

      <div class="ps-bar" aria-hidden="true"><i style="width:${fill * 100}%"></i></div>
      ${chips.length ? `<div class="ps-chips">${chips.map(([name, n, col, isNew]) => `<span class="ps-chip" style="--c:${col}"><i></i>${esc(name)} <b class="tnum">${isNew ? '+' : ''}${n}</b>${isNew ? ` <small>${t('nouv.')}</small>` : ''}</span>`).join('')}</div>` : ''}
    </section>`;
  },
  icsText(days = 28) {
    const P = this.compute(days); const [h, m] = STUDY_HOUR[S.profile.study.time] || STUDY_HOUR.evening;
    const pad = n => String(n).padStart(2, '0');
    const loc = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
    const ds = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
    const escI = s => String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1');
    // Lignes pliées à 75 octets (RFC 5545), sans couper un caractère multi-octet.
    const enc = new TextEncoder();
    const fold = line => { const out = []; let cur = '', n = 0; for (const ch of line) { const b = enc.encode(ch).length; if (n + b > 75) { out.push(cur); cur = ' ' + ch; n = 1 + b; } else { cur += ch; n += b; } } out.push(cur); return out.join('\r\n'); };
    const now = new Date(); const stamp = now.toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
    const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Engram//Study plan//' + LANG.toUpperCase(), 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Engram'];
    for (const d of P.days) {

      const st = new Date(d.date); st.setHours(h, m, 0, 0); const en = new Date(st.getTime() + Math.max(10, d.min) * MIN);
      const decks = Object.entries(d.quota).map(([id, n]) => `${deckById(id)?.name}: +${n}`).join(', ');
      L.push('BEGIN:VEVENT', `UID:engram-${d.key}-${hash(d.key + S.profile.study.time)}@engram.app`, `DTSTAMP:${stamp}`, `DTSTART:${loc(st)}`, `DTEND:${loc(en)}`,
        fold('SUMMARY:' + escI(t('Engram · {m} min — {r}, {n}', { m: d.min, r: plural(d.rev, 'révision|révisions'), n: plural(d.newN, 'nouvelle|nouvelles') }))),
        fold('DESCRIPTION:' + escI(t('Programme Engram du jour.') + (decks ? '\n' + decks : ''))),
        'BEGIN:VALARM', 'ACTION:DISPLAY', 'TRIGGER:-PT10M', 'DESCRIPTION:Engram', 'END:VALARM', 'END:VEVENT');
    }
    for (const x of upcomingExams()) {
      const d = keyToDate(x.date), e = new Date(d.getTime() + DAY);
      L.push('BEGIN:VEVENT', `UID:engram-exam-${x.id}@engram.app`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${ds(d)}`, `DTEND;VALUE=DATE:${ds(e)}`, fold('SUMMARY:' + escI('📝 ' + x.name)), 'END:VEVENT');
    }
    L.push('END:VCALENDAR');
    return L.join('\r\n') + '\r\n';
  },

};

   INTÉGRATIONS
   · Anki : import des paquets .apkg (ancien et nouveau format, avec
     images et historique de révision) et export en .apkg.
   · Quizlet, Excel, Notion, Google Sheets : coller une liste.

   · Agenda : .ics et liens Google Agenda / Outlook.
   Les bibliothèques ne sont chargées qu'au moment où l'on s'en sert.

const CDN = 'https://cdn.jsdelivr.net/npm/';

  jszip: ['jszip@3.10.1/dist/jszip.min.js', () => window.JSZip],
  sql: ['sql.js@1.10.3/dist/sql-asm.js', () => window.initSqlJs],
  zstd: ['fzstd@0.1.1/umd/index.js', () => window.fzstd],

  jspdf: ['jspdf@2.5.2/dist/jspdf.umd.min.js', () => window.jspdf]

const _libs = {};
function lib(name) {
  const [path, get] = LIBS[name];

  return _libs[name] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = CDN + path; s.async = true; s.crossOrigin = 'anonymous';
    s.onload = () => get() ? res(get()) : rej(new Error('lib ' + name));

    document.head.append(s);

}
const ZSTD_MAGIC = [0x28, 0xb5, 0x2f, 0xfd];

}

/** Une ligne par fiche, en texte brut : question, réponse, note, paquet. */
function flatCards(decks) {
  const clean = s => plain(String(s ?? '')).replace(/\s*\n+\s*/g, ' / ').replace(/\t/g, ' ').trim();
  const rows = [];
  for (const d of decks) for (const c of d.cards) {
    if (c.type === 'occlusion') continue;
    let q = c.front;
    if (c.type === 'cloze') q = renderCloze(c.text || '', c.n || 1).q;
    else if (c.type === 'mcq') q = `${c.front} (${(c.options || []).map((o, i) => `${'ABCDEF'[i]}. ${o}`).join(' · ')})`;
    else if (c.type === 'tf') q = `${c.front} (${trueLbl()} / ${falseLbl()})`;
    const a = clean(cardAnswer(c)), extra = clean(c.type === 'basic' || c.type === 'cloze' ? c.extra : c.back);
    if (clean(q) && a) rows.push([clean(q), a, extra, d.name]);
  }
  return rows;
}

async function importFile(f, kind = '') {
  const name = f.name.toLowerCase();
  try {
    if (/\.(apkg|colpkg)(\.zip)?$/.test(name) || (kind === 'anki' && /\.zip$/.test(name))) return await importAnki(f);
    if (kind === 'anki') { toast(t("Ce fichier n'est pas un paquet Anki : choisissez un fichier .apkg ou .colpkg."), 'layers'); return; }
    if (/\.pdf$/.test(name) || f.type === 'application/pdf') { Scan.tab = 'pdf'; App.go('scan'); return loadPdfForScan(f); }
    if (/^image\//.test(f.type)) { Scan.tab = 'photo'; Scan.files = [f]; Scan.urls = [URL.createObjectURL(f)]; App.go('scan'); return; }
    const text = await f.text();
    if (kind === 'backup' && !/^\s*[\[{]/.test(text)) { toast(t("Ce fichier n'est pas une sauvegarde Engram (.json)."), 'file'); return; }
    addImported(parseImport(f.name, text));
  } catch (e) { console.warn(e); toast(t('Fichier illisible. Utilisez un paquet Anki, un JSON Engram, un CSV ou un TSV.'), 'file'); }
}
function addImported(parsed, opts = {}) {
  const decks = parsed.decks.filter(d => d.cards.length);
  if (!decks.length) { toast(t('Aucune fiche reconnue. Format attendu : recto;verso par ligne.'), 'file'); return null; }
  if (S.demo) Store.leaveDemo(false);
  for (const [k, v] of Object.entries(parsed.images || {})) if (typeof v === 'string' && v.startsWith('data:image/')) { S.images[k] = v; Store.dirty.add('img:' + k); }
  let n = 0; const made = [];
  for (const d of decks) {
    const into = opts.into && deckById(opts.into);
    if (into) { into.cards.push(...d.cards); n += d.cards.length; Store.touchDeck(into); made.push(into); continue; }
    const nd = { id: uid('d'), name: d.name, desc: d.desc || '', color: DECK_COLORS[d.color] ? d.color : pick(Object.keys(DECK_COLORS)), lang: d.lang || LANG, created: Date.now(), updatedAt: Date.now(), cards: d.cards, notes: d.notes || [] };
    S.decks.unshift(nd); n += d.cards.length; Store.touchDeck(nd); made.push(nd);
  }
  if (parsed.exams) for (const x of parsed.exams) if (!S.profile.exams.some(y => y.id === x.id)) S.profile.exams.push(x);
  S.profile.flags.importer = 1;
  Store.touch('profile'); App.go(made.length === 1 ? 'deck' : 'library', made.length === 1 ? made[0].id : null);
  toast(plural(n, 'fiche importée|fiches importées'), 'upload'); checkBadges();
  return made;
}
/* CSV, TSV, texte d'Anki, JSON Engram ou liste de paires */
function parseImport(name, text) {
  const base = name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim() || t('Import');
  if (/^\s*[\[{]/.test(text)) {
    const j = JSON.parse(text);
    if (j && Array.isArray(j.decks)) return { images: j.images || {}, exams: j.profile?.exams, decks: j.decks.map(d => ({ ...d, id: uid('d'), example: false, cards: (d.cards || []).map(c => ({ ...c, id: uid('c'), srs: c.srs || FSRS.blank(), tags: c.tags || [] })) })) };
    const arr = Array.isArray(j) ? j : j.cards || [];
    return { images: {}, decks: [{ name: base, cards: arr.map(o => mkCard('basic', { front: htmlToText(o.front ?? o.question ?? o.q ?? o.term), back: htmlToText(o.back ?? o.answer ?? o.a ?? o.definition), src: 'import' })).filter(c => c.front && c.back) }] };
  }
  const head = {}; for (const l of text.split(/\r?\n/)) { const m = l.match(/^#(\w[\w ]*):(.*)$/); if (m) head[m[1].trim().toLowerCase()] = m[2].trim(); }
  const sepName = { tab: '\t', comma: ',', semicolon: ';', pipe: '|', colon: ':', space: ' ' }[head.separator?.toLowerCase()];
  const rows = parseDelimited(text.split(/\r?\n/).filter(l => !l.startsWith('#')).join('\n'), sepName);
  return { images: {}, decks: [{ name: base, cards: rowsToCards(rows) }] };
}
/** Découpe un texte délimité (guillemets CSV gérés) ; le séparateur est deviné s'il n'est pas donné. */
function parseDelimited(text, sep) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const pipe = lines.filter(l => /^\s*\|.*\|\s*$/.test(l));
  if (!sep && pipe.length && pipe.length >= lines.length * 0.6) {
    const cells = l => l.trim().replace(/^\||\|$/g, '').replace(/\\\|/g, '\u0001').split('|').map(x => x.replace(/\u0001/g, '|').trim());
    return pipe.map(cells).filter(r => !r.every(x => /^:?-{2,}:?$/.test(x)));
  }
  if (!sep) {
    // Le séparateur présent sur le plus de lignes l'emporte (dans cet ordre de préférence en cas d'égalité).
    const score = x => lines.slice(0, 30).filter(l => l.includes(x)).length;
    const best = ['\t', ' - ', ' – ', ' — ', ';', ',', ' : ', ':', '='].map(x => [x, score(x)]).sort((a, b) => b[1] - a[1])[0];
    sep = best[1] ? best[0] : '\t';
  }
  if (sep.length > 1) return lines.map(l => { const i = l.indexOf(sep); return i < 0 ? [l] : [l.slice(0, i), l.slice(i + sep.length)]; });
  const out = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; continue; }
    if (ch === '"' && cur === '') q = true;
    else if (ch === sep) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); if (row.some(x => x.trim())) out.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  row.push(cur); if (row.some(x => x.trim())) out.push(row);
  return out;
}
function rowsToCards(rows, o = {}) {
  const cards = [];
  for (const r of rows) {
    let [a, b, extra] = r.map(x => htmlToText(x));
    a = (a || '').replace(/^(?:[-*•–—]|\d{1,3}[.)])\s+/, '');
    if (!a || /^(front|recto|question|term|terme|pregunta|frage|pergunta|vorderseite)$/i.test(a)) continue;

        for (const ord of ords) {
          const src = clozeNums ? sibs.find(x => x.n === ord + 1) || c : c; const s = src.srs;
          let type = 0, queue = src.suspended ? -1 : 0, due = nNotes, ivl = 0;
          if (s.state === 2) { type = 2; queue = src.suspended ? -1 : 2; due = Math.max(0, Math.round((s.due - crt * 1000) / DAY)); ivl = Math.max(1, Math.round((s.due - s.last) / DAY)); }
          insC.run([++cid, id, did, ord, nowS, -1, type, queue, due, ivl, s.state === 2 ? Math.round(clamp(2500 - (s.d - 5) * 300, 1300, 3500)) : 0, s.reps || 0, s.lapses || 0, 0, 0, 0, 0, s.state === 2 ? JSON.stringify({ s: +s.s.toFixed(2), d: +s.d.toFixed(2) }) : '']);
        }
      }
    }
    insN.free(); insC.free();
    db.run('INSERT INTO col VALUES (1,?,?,?,11,0,0,0,?,?,?,?,?)', [crt, now, now, JSON.stringify(conf), JSON.stringify(models), JSON.stringify(decksJ), JSON.stringify(dconf), '{}']);
    P.set(t('Compression…'));
    const zip = new JSZip(); zip.file('collection.anki2', db.export()); db.close();
    zip.file('media', JSON.stringify(media));
    for (const [name, blob] of mediaFiles) zip.file(name, blob);
    const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
    Modal.close();
    const base = deckList.length === 1 ? slug(deckList[0].name) : 'engram';
    await saveFile(base + '.apkg', blob, { alt: base + '.apkg.zip', altNote: t('Enregistré en .zip (seul format permis ici) : renommez-le en .apkg, puis ouvrez-le avec Anki.') });
    return nNotes;
  } catch (e) { console.warn(e); Modal.close(); toast(t("Export Anki impossible (connexion requise la première fois pour charger l'outil)."), 'layers'); }
}

const csvEscape = s => { s = String(s ?? ''); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function exportDeckCSV(decks) {
  decks = [].concat(decks); const many = decks.length > 1;
  const rows = [[t('recto'), t('verso'), 'type', t('étiquettes'), ...(many ? [t('paquet')] : [])].join(';')];
  for (const d of decks) for (const c of d.cards) { if (c.type === 'occlusion') continue; if (c.type === 'cloze' && d.cards.some(x => x.note === c.note && x.n < c.n)) continue; rows.push([c.type === 'cloze' ? c.text : c.front, cardAnswer(c), c.type, (c.tags || []).join(' '), ...(many ? [d.name] : [])].map(csvEscape).join(';')); }
  return rows.join('\n');
}

/* ── Fiches à imprimer (PDF recto-verso) ───────────────────────────── */
// Polices standard du PDF : on remplace ce que l'encodage Windows-1252 ne sait pas écrire.
const SUPS = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const pdfSafe = s => String(s || '').replace(/→/g, '->').replace(/←/g, '<-').replace(/≈/g, '~').replace(/≤/g, '<=').replace(/≥/g, '>=').replace(/×/g, 'x').replace(/Σ/g, 'Sum ')
  .replace(/[₀-₉]/g, c => String(c.charCodeAt(0) - 8320)).replace(/[⁰⁴-⁹]/g, c => '^' + SUPS.indexOf(c)).replace(/[‘’]/g, "'").replace(/[“”„]/g, '"')
  .replace(/[^\x00-\xff€…–—•™Œœ‚ƒ†‡ˆ‰Š‹šŸŽž]/g, '?');
async function printCards(d) {
  const P = progressModal(t('Fiches à imprimer'));
  try {
    const { jsPDF } = await lib('jspdf');
    P.set(t('Mise en page…'));
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const W = 210, H = 297, cols = 2, rows = 4, mx = 12, my = 14, cw = (W - 2 * mx) / cols, ch = (H - 2 * my) / rows;
    const cards = d.cards.filter(c => c.type !== 'occlusion');
    const face = (c, back) => {
      const f = cardFaces(c);
      if (c.type === 'mcq') return back ? `${'ABCDEF'[c.answer]}. ${c.options[c.answer]}${c.back ? '\n\n' + plain(c.back) : ''}` : `${plain(c.front)}\n\n${c.options.map((o, i) => `${'ABCDEF'[i]}. ${o}`).join('\n')}`;
      if (c.type === 'tf') return back ? `${c.answer ? trueLbl() : falseLbl()}${c.back ? '\n\n' + plain(c.back) : ''}` : `${plain(c.front)}\n\n${trueLbl()} / ${falseLbl()}${LANG === 'fr' ? ' ?' : '?'}`;
      if (c.type === 'order') return back ? c.items.map((x, i) => `${i + 1}. ${x}`).join('\n') : `${plain(c.front)}\n\n${shuffle(c.items).map(x => '• ' + x).join('\n')}`;
      if (c.type === 'cloze') return back ? plain(c.text) : f.question;
      return back ? plain(c.back) + (c.extra ? '\n\n' + plain(c.extra) : '') : plain(c.front);
    };
    const drawCell = (c, x, y, back) => {
      doc.setLineDashPattern([1.2, 1.4], 0); doc.setDrawColor(170); doc.rect(x, y, cw, ch);
      doc.setLineDashPattern([], 0);
      doc.setFont('courier', 'bold'); doc.setFontSize(6.5); doc.setTextColor(120);
      doc.text(pdfSafe(`ENGRAM · ${d.name}`.toUpperCase()).slice(0, 48), x + 5, y + 6);
      doc.setTextColor(195, 52, 42); doc.text(`N° ${cardNo(c)}${back ? ' · ' + pdfSafe(t('Réponse')).toUpperCase() : ''}`, x + cw - 5, y + 6, { align: 'right' });
      if (!back) { doc.setDrawColor(208, 70, 58); doc.setLineWidth(0.3); doc.line(x + 12, y + 9, x + 12, y + ch - 4); }
      doc.setTextColor(29, 28, 24); doc.setFont('helvetica', back ? 'normal' : 'bold');
      let size = 13, lines;
      const txt = pdfSafe(face(c, back));
      for (; size >= 7; size -= 0.5) { doc.setFontSize(size); lines = doc.splitTextToSize(txt, cw - 26); if (lines.length * size * 0.42 < ch - 20) break; }
      const blockH = lines.length * size * 0.42; doc.text(lines, x + (back ? 8 : 16), y + 10 + (ch - 14 - blockH) / 2 + size * 0.35);
    };
    const per = cols * rows;
    for (let p = 0; p * per < cards.length; p++) {
      const chunk = cards.slice(p * per, (p + 1) * per);
      if (p) doc.addPage();
      chunk.forEach((c, i) => drawCell(c, mx + (i % cols) * cw, my + Math.floor(i / cols) * ch, false));
      doc.addPage(); // verso : colonnes inversées pour l'impression recto-verso (bord long)
      chunk.forEach((c, i) => drawCell(c, mx + (cols - 1 - (i % cols)) * cw, my + Math.floor(i / cols) * ch, true));
    }
    doc.setProperties({ title: d.name, creator: 'Engram' });
    const blob = doc.output('blob'); Modal.close();
    await saveFile(slug(d.name) + '-cards.pdf', blob);
  } catch (e) { console.warn(e); Modal.close(); toast(t("Impossible de préparer le PDF (connexion requise la première fois pour charger l'outil)."), 'printer'); }
}

/* ── PDF de cours → texte (ou pages en images pour l'IA) ───────────── */
async function loadPdfForScan(f) {
  Scan.pdf = { name: f.name, pages: 0, text: '', images: [], status: t('Ouverture du PDF…') }; if (App.route.v === 'scan') App.render();
  try {
    await lib('pdfWorker'); const pdfjs = await lib('pdf');
    const data = new Uint8Array(await f.arrayBuffer());
    const doc = await pdfjs.getDocument({ data, isEvalSupported: false, disableFontFace: true, useSystemFonts: false }).promise;
    Scan.pdf.pages = doc.numPages;
    let text = '';
    for (let p = 1; p <= Math.min(doc.numPages, 80); p++) {
      const page = await doc.getPage(p); const tc = await page.getTextContent();
      let line = '';
      for (const it of tc.items) { line += it.str; if (it.hasEOL) { text += line.trimEnd() + '\n'; line = ''; } else if (it.str && !/\s$/.test(it.str)) line += ' '; }
      text += line.trim() + '\n\n';
      Scan.pdf.status = t('Lecture de la page {a} / {b}…', { a: p, b: doc.numPages }); const st = $('.drop b'); if (st && p % 5 === 0) st.textContent = Scan.pdf.status;
    }
    Scan.pdf.text = text.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
    if (Scan.pdf.text.length < 200) {
      // PDF scanné : on photographie les premières pages pour l'IA.
      const max = Math.min(doc.numPages, AI.limits?.images?.maxCount || 5);
      for (let p = 1; p <= max; p++) {
        const page = await doc.getPage(p); const vp0 = page.getViewport({ scale: 1 }); const vp = page.getViewport({ scale: Math.min(2.2, 1500 / vp0.width) });
        const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
        await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
        Scan.pdf.images.push(await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85)));
        if (p === 1) Scan.pdf.thumb = cv.toDataURL('image/jpeg', 0.6);
      }
      Scan.pdf.status = AI.images ? t('PDF scanné : {n} pages seront lues par l\'IA.', { n: Scan.pdf.images.length }) : t("Ce PDF ne contient pas de texte (pages scannées) : il faut l'IA pour le lire.");
    } else Scan.pdf.status = '';
    doc.destroy?.();
  } catch (e) { console.warn(e); Scan.pdf.status = t('PDF illisible, ou lecteur PDF indisponible (connexion requise la première fois).'); }
  S.profile.flags.importer = 1;
  if (App.route.v === 'scan') App.render();
}

/* ── Glisser-déposer un fichier n'importe où ───────────────────────── */
function bootDrop() {
  let depth = 0;
  addEventListener('dragenter', e => { if (![...(e.dataTransfer?.types || [])].includes('Files') || App.route.v === 'scan') return; depth++; document.body.classList.add('dropping'); });
  addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; document.body.classList.remove('dropping'); } });
  addEventListener('dragover', e => { if ([...(e.dataTransfer?.types || [])].includes('Files') && App.route.v !== 'scan') e.preventDefault(); });
  addEventListener('drop', e => {
    depth = 0; document.body.classList.remove('dropping');
    if (App.route.v === 'scan' || e.defaultPrevented) return;
    const f = e.dataTransfer?.files?.[0]; if (!f) return; e.preventDefault();
    if (/^image\//.test(f.type)) { App.go('scan'); Scan.tab = 'photo'; Scan.files = [f]; Scan.urls = [URL.createObjectURL(f)]; App.render(); return; }
    importFile(f);
  });
}

  "<b>L'IA lit</b> la page et repère définitions, dates, formules et mots-clés.": ["<b>The AI reads</b> the page and spots definitions, dates, formulas and keywords.","<b>La IA lee</b> la página y detecta definiciones, fechas, fórmulas y palabras clave.","<b>Die KI liest</b> die Seite und erkennt Definitionen, Daten, Formeln und Schlüsselwörter.","<b>A IA lê</b> a página e identifica definições, datas, fórmulas e palavras-chave."],

  "Les fiches suivent les règles de la répétition espacée : une idée par fiche, réponse courte, question sans ambiguïté.": ["The cards follow the rules of spaced repetition: one idea per card, short answer, unambiguous question.","Las tarjetas siguen las reglas de la repetición espaciada: una idea por tarjeta, respuesta corta, pregunta sin ambigüedad.","Die Karten folgen den Regeln der verteilten Wiederholung: eine Idee pro Karte, kurze Antwort, eindeutige Frage.","Os cartões seguem as regras da repetição espaçada: uma ideia por cartão, resposta curta, pergunta sem ambiguidade."],

  "Aucune fiche trouvée : le texte doit contenir des définitions (« terme : explication »), des phrases avec « est / sont », des dates ou des chiffres.": ["No cards found: the text needs definitions (\"term: explanation\"), sentences with \"is / are\", dates or figures.","No se encontraron tarjetas: el texto debe contener definiciones («término: explicación»), frases con «es / son», fechas o cifras.","Keine Karten gefunden: Der Text braucht Definitionen („Begriff: Erklärung“), Sätze mit „ist / sind“, Daten oder Zahlen.","Nenhum cartão encontrado: o texto precisa ter definições (“termo: explicação”), frases com “é / são”, datas ou números."],

  "Se tester est la façon la plus efficace d'apprendre. Les jeux ne modifient pas le calendrier de vos fiches.": ["Testing yourself is the most effective way to learn. Games don't change your cards' schedule.","Ponerse a prueba es la forma más eficaz de aprender. Los juegos no modifican el calendario de tus tarjetas.","Sich selbst abzufragen ist die wirksamste Art zu lernen. Spiele ändern den Plan deiner Karten nicht.","Testar-se é a forma mais eficaz de aprender. Os jogos não alteram o calendário dos seus cartões."],
  "Associez chaque question à sa réponse, le plus vite possible. Une erreur coûte une seconde.": ["Match each question to its answer, as fast as you can. A mistake costs one second.","Empareja cada pregunta con su respuesta lo más rápido posible. Un error cuesta un segundo.","Ordne jeder Frage so schnell wie möglich ihre Antwort zu. Ein Fehler kostet eine Sekunde.","Associe cada pergunta à sua resposta o mais rápido possível. Um erro custa um segundo."],

  "Un QCM chronométré tiré de vos fiches, noté comme le jour J. Les mauvaises réponses proposées viennent de vos autres fiches : elles sont crédibles.": ["A timed multiple-choice test drawn from your cards, graded like the real thing. The wrong options come from your other cards: they're believable.","Un test cronometrado sacado de tus tarjetas, calificado como el día D. Las respuestas incorrectas vienen de tus otras tarjetas: son creíbles.","Ein Multiple-Choice-Test auf Zeit aus deinen Karten, bewertet wie am Tag X. Die falschen Antworten stammen aus deinen anderen Karten: Sie sind glaubwürdig.","Um teste cronometrado tirado dos seus cartões, avaliado como no dia D. As respostas erradas vêm dos seus outros cartões: são críveis."],

  "Pas assez de fiches pour un examen : il en faut au moins 4.": ["Not enough cards for an exam: you need at least 4.","No hay suficientes tarjetas para un examen: hacen falta al menos 4.","Nicht genug Karten für eine Prüfung: Du brauchst mindestens 4.","Não há cartões suficientes para uma prova: é preciso pelo menos 4."],

  "{day} : {m} min prévues pour {a} disponibles. Ajoutez un peu de temps ce jour-là ou avancez des révisions la veille.": ["{day}: {m} min planned for {a} available. Add a little time that day or move some reviews to the day before.","{day}: {m} min previstos para {a} disponibles. Añade algo de tiempo ese día o adelanta repasos la víspera.","{day}: {m} Min. geplant bei {a} verfügbaren. Plane an dem Tag etwas mehr Zeit ein oder zieh Wiederholungen auf den Vortag vor.","{day}: {m} min previstos para {a} disponíveis. Acrescente um pouco de tempo nesse dia ou adiante revisões na véspera."],
  "« {exam} » : à ce rythme, {p} des fiches seront vues à temps. Ajoutez environ {m} min par jour pour tout couvrir.": ["\"{exam}\": at this pace, {p} of the cards will be seen in time. Add about {m} min a day to cover everything.","«{exam}»: a este ritmo, el {p} de las tarjetas se verá a tiempo. Añade unos {m} min al día para cubrirlo todo.","„{exam}“: In diesem Tempo werden {p} der Karten rechtzeitig gesehen. Plane etwa {m} Min. mehr pro Tag ein, um alles abzudecken.","“{exam}”: neste ritmo, {p} dos cartões serão vistos a tempo. Acrescente cerca de {m} min por dia para cobrir tudo."],
  "{n} fiches ont été oubliées 4 fois ou plus. Passez-les à l'atelier des points faibles, ou demandez à Mentor de les reformuler.": ["{n} cards have been forgotten 4 times or more. Send them to the weak-spot workshop, or ask Mentor to rephrase them.","{n} tarjetas se han olvidado 4 veces o más. Llévalas al taller de puntos débiles o pide a Mentor que las reformule.","{n} Karten wurden 4-mal oder öfter vergessen. Schick sie in die Schwachstellen-Werkstatt oder bitte Mentor, sie umzuformulieren.","{n} cartões foram esquecidos 4 vezes ou mais. Leve-os à oficina dos pontos fracos ou peça ao Mentor para reformulá-los."],
  "Ajoutez une date d'examen : le programme dosera les nouvelles fiches pour être prêt à temps.": ["Add an exam date: the programme will pace new cards so you're ready in time.","Añade una fecha de examen: el programa dosificará las tarjetas nuevas para que llegues a tiempo.","Füge ein Prüfungsdatum hinzu: Das Programm dosiert neue Karten, damit du rechtzeitig bereit bist.","Adicione uma data de prova: o programa vai dosar os cartões novos para você chegar pronto."],
  "{m} min par semaine, c'est peu pour retenir durablement : visez au moins 10 minutes par jour.": ["{m} min a week is little for lasting memory: aim for at least 10 minutes a day.","{m} min a la semana es poco para recordar a largo plazo: apunta al menos a 10 minutos al día.","{m} Min. pro Woche sind wenig für dauerhaftes Behalten: Peile mindestens 10 Minuten pro Tag an.","{m} min por semana é pouco para memorizar de verdade: mire pelo menos 10 minutos por dia."],
  "Tout est sous contrôle. Tenez le rythme : la régularité compte plus que la durée.": ["Everything is under control. Keep the pace: regularity matters more than duration.","Todo está bajo control. Mantén el ritmo: la regularidad cuenta más que la duración.","Alles im Griff. Halte das Tempo: Regelmäßigkeit zählt mehr als Dauer.","Tudo sob controle. Mantenha o ritmo: a regularidade conta mais que a duração."],

  "Scannez un cours ou importez un paquet : le programme se construit tout seul.": ["Scan a course or import a deck: the programme builds itself.","Escanea un curso o importa un mazo: el programa se construye solo.","Scanne einen Kurs oder importiere einen Stapel: Das Programm baut sich von selbst.","Escaneie uma aula ou importe um baralho: o programa se monta sozinho."],
  "Calculé chaque jour à partir de vos examens, du temps dont vous disposez et de l'état de votre mémoire. Il ajuste le nombre de nouvelles fiches de chaque paquet pour que tout soit vu à temps, sans vous submerger.": ["Computed every day from your exams, the time you have and the state of your memory. It adjusts the number of new cards in each deck so everything is seen in time, without overwhelming you.","Calculado cada día a partir de tus exámenes, del tiempo del que dispones y del estado de tu memoria. Ajusta el número de tarjetas nuevas de cada mazo para que todo se vea a tiempo, sin agobiarte.","Jeden Tag neu berechnet aus deinen Prüfungen, deiner verfügbaren Zeit und dem Zustand deines Gedächtnisses. Es passt die Zahl neuer Karten pro Stapel an, damit alles rechtzeitig drankommt, ohne dich zu überfordern.","Calculado todo dia a partir das suas provas, do tempo disponível e do estado da sua memória. Ele ajusta o número de cartões novos de cada baralho para que tudo seja visto a tempo, sem sobrecarregar você."],

  "Chaque semaine, Mentor relit votre programme, vos examens et vos points faibles, et vous écrit quelques lignes pour la suite.": ["Every week, Mentor reads your programme, exams and weak spots, and writes you a few lines for what comes next.","Cada semana, Mentor revisa tu programa, tus exámenes y tus puntos débiles, y te escribe unas líneas para lo que viene.","Jede Woche liest Mentor dein Programm, deine Prüfungen und Schwachstellen und schreibt dir ein paar Zeilen für die nächsten Tage.","Toda semana, o Mentor relê seu programa, suas provas e seus pontos fracos, e escreve algumas linhas para o que vem."],
  "Disponible avec l'IA (app Claude ou serveur Engram). En attendant, les conseils ci-dessous sont calculés sur votre appareil.": ["Available with AI (Claude app or Engram server). Meanwhile, the advice below is computed on your device.","Disponible con la IA (app de Claude o servidor de Engram). Mientras tanto, los consejos de abajo se calculan en tu dispositivo.","Mit KI verfügbar (Claude-App oder Engram-Server). Bis dahin werden die Tipps unten auf deinem Gerät berechnet.","Disponível com a IA (app do Claude ou servidor do Engram). Enquanto isso, as dicas abaixo são calculadas no seu aparelho."],

  "Ce jour-là dépasse votre temps disponible : c'est la dernière ligne droite avant un examen, ou le temps prévu est trop court.": ["This day exceeds your available time: it's the home stretch before an exam, or the planned time is too short.","Este día supera tu tiempo disponible: es la recta final antes de un examen, o el tiempo previsto es demasiado corto.","Dieser Tag übersteigt deine verfügbare Zeit: Es ist der Endspurt vor einer Prüfung, oder die geplante Zeit ist zu knapp.","Este dia passa do seu tempo disponível: é a reta final antes de uma prova, ou o tempo previsto é curto demais."],

  "Mentor peut se tromper : relisez ses fiches. Chaque action peut être annulée.": ["Mentor can make mistakes: check its cards. Every action can be undone.","Mentor puede equivocarse: revisa sus tarjetas. Cada acción se puede deshacer.","Mentor kann sich irren: Prüfe seine Karten. Jede Aktion lässt sich rückgängig machen.","O Mentor pode errar: confira os cartões dele. Toda ação pode ser desfeita."],
  "Je suis Mentor, votre assistant d'étude. Pour que je puisse répondre et agir, ouvrez Engram dans l'app Claude, ou branchez le serveur Engram (Réglages → IA et Mentor). En attendant, voici des raccourcis utiles.": ["I'm Mentor, your study assistant. So I can answer and act, open Engram in the Claude app, or connect the Engram server (Settings → AI and Mentor). Meanwhile, here are some handy shortcuts.","Soy Mentor, tu asistente de estudio. Para que pueda responder y actuar, abre Engram en la app de Claude o conecta el servidor de Engram (Ajustes → IA y Mentor). Mientras tanto, aquí tienes atajos útiles.","Ich bin Mentor, dein Lernassistent. Damit ich antworten und handeln kann, öffne Engram in der Claude-App oder verbinde den Engram-Server (Einstellungen → KI und Mentor). Bis dahin hier ein paar nützliche Abkürzungen.","Sou o Mentor, seu assistente de estudos. Para eu poder responder e agir, abra o Engram no app do Claude ou conecte o servidor do Engram (Ajustes → IA e Mentor). Enquanto isso, aqui vão alguns atalhos úteis."],
  "Bonjour {name} !": ["Hello {name}!","¡Hola, {name}!","Hallo {name}!","Olá, {name}!"],
  "Bonjour !": ["Hello!","¡Hola!","Hallo!","Olá!"],
  "Je suis Mentor. Je connais vos paquets, vos examens et votre programme, et je peux agir pour vous : créer des fiches sur n'importe quel sujet, bâtir un planning jusqu'au jour J, retravailler vos points faibles, changer l'apparence de l'app… Dites-moi simplement ce dont vous avez besoin.": ["I'm Mentor. I know your decks, your exams and your programme, and I can act for you: create cards on any topic, build a schedule up to the big day, rework your weak spots, change how the app looks… Just tell me what you need.","Soy Mentor. Conozco tus mazos, tus exámenes y tu programa, y puedo actuar por ti: crear tarjetas sobre cualquier tema, preparar un planning hasta el día D, trabajar tus puntos débiles, cambiar el aspecto de la app… Dime simplemente qué necesitas.","Ich bin Mentor. Ich kenne deine Stapel, deine Prüfungen und dein Programm und kann für dich handeln: Karten zu jedem Thema erstellen, einen Plan bis zum Tag X bauen, deine Schwachstellen überarbeiten, das Aussehen der App ändern… Sag mir einfach, was du brauchst.","Sou o Mentor. Conheço seus baralhos, suas provas e seu programa, e posso agir por você: criar cartões sobre qualquer tema, montar um cronograma até o dia D, trabalhar seus pontos fracos, mudar a aparência do app… É só dizer do que você precisa."],

  "Avec Pro, Mentor répond et agit pour vous sans limite.": ["With Pro, Mentor answers and acts for you without limits.","Con Pro, Mentor responde y actúa por ti sin límite.","Mit Pro antwortet und handelt Mentor unbegrenzt für dich.","Com o Pro, o Mentor responde e age por você sem limite."],
  "Avec Pro, les six assistants travaillent pour vous sans limite. Les analyses sans IA restent libres.": ["With Pro, the six assistants work for you without limits. Analyses without AI stay free.","Con Pro, los seis asistentes trabajan para ti sin límite. Los análisis sin IA siguen siendo libres.","Mit Pro arbeiten die sechs Assistenten unbegrenzt für dich. Analysen ohne KI bleiben frei.","Com o Pro, os seis assistentes trabalham para você sem limite. As análises sem IA continuam livres."],
  "Avec Pro, photographiez autant de cours que vous voulez : pages manuscrites, PDF, notes au stylet.": ["With Pro, photograph as many courses as you like: handwritten pages, PDFs, pen notes.","Con Pro, fotografía todos los cursos que quieras: páginas manuscritas, PDF, notas con lápiz.","Mit Pro fotografierst du so viele Kurse, wie du willst: handschriftliche Seiten, PDFs, Stiftnotizen.","Com o Pro, fotografe quantas aulas quiser: páginas manuscritas, PDF, anotações com a caneta."],
  "Avec l'IA, je vérifie aussi le fond : questions ambiguës, erreurs, fiches à scinder.": ["With AI, I also check the substance: ambiguous questions, mistakes, cards to split.","Con la IA, también reviso el fondo: preguntas ambiguas, errores, tarjetas que dividir.","Mit KI prüfe ich auch den Inhalt: mehrdeutige Fragen, Fehler, Karten zum Aufteilen.","Com a IA, também verifico o conteúdo: perguntas ambíguas, erros, cartões a dividir."],

  "C'est une question : le point d'interrogation aide à la lire comme telle.": ["It is a question: a question mark helps read it as one.","Es una pregunta: el signo de interrogación ayuda a leerla como tal.","Es ist eine Frage: Das Fragezeichen hilft, sie als solche zu lesen.","É uma pergunta: o ponto de interrogação ajuda a lê-la como tal."],
  "C'est {p} de moins que la semaine d'avant : rien de grave, reprenez le fil.": ["That is {p} less than the week before: nothing serious, just pick up the thread.","Es un {p} menos que la semana anterior: nada grave, retoma el hilo.","Das sind {p} weniger als in der Woche davor: nicht schlimm, knüpf einfach wieder an.","São {p} a menos que na semana anterior: nada grave, retome o ritmo."],
  "C'est {p} de plus que la semaine d'avant.": ["That is {p} more than the week before.","Es un {p} más que la semana anterior.","Das sind {p} mehr als in der Woche davor.","São {p} a mais que na semana anterior."],

  "Ce mois-ci : {a} sur 3, {b} sur 20 à Mentor, {c} sur 3.": ["This month: {a} of 3, {b} of 20 to Mentor, {c} of 3.","Este mes: {a} de 3, {b} de 20 a Mentor, {c} de 3.","Diesen Monat: {a} von 3, {b} von 20 an Mentor, {c} von 3.","Este mês: {a} de 3, {b} de 20 ao Mentor, {c} de 3."],
  "Cet assistant rédige : il a besoin de l'IA. Ouvrez Engram dans l'app Claude, ou branchez le serveur Engram (Réglages → IA et Mentor).": ["This assistant writes, so it needs AI. Open Engram in the Claude app, or connect the Engram server (Settings → AI and Mentor).","Este asistente redacta: necesita la IA. Abre Engram en la app de Claude o conecta el servidor de Engram (Ajustes → IA y Mentor).","Dieser Assistent schreibt, also braucht er die KI. Öffne Engram in der Claude-App oder verbinde den Engram-Server (Einstellungen → KI und Mentor).","Este assistente escreve: ele precisa da IA. Abra o Engram no app do Claude ou conecte o servidor do Engram (Ajustes → IA e Mentor)."],
  "Cette fonction fait partie de Pro": ["This feature is part of Pro","Esta función forma parte de Pro","Diese Funktion gehört zu Pro","Este recurso faz parte do Pro"],
  "Cette semaine : {r} en {d}, {m}.": ["This week: {r} over {d}, {m}.","Esta semana: {r} en {d}, {m}.","Diese Woche: {r} an {d}, {m}.","Esta semana: {r} em {d}, {m}."],
  "Cette semaine, le fichier est resté fermé.": ["This week, the cabinet stayed closed.","Esta semana, el fichero se quedó cerrado.","Diese Woche blieb die Kartei zu.","Esta semana, o fichário ficou fechado."],
  "Chacun son métier. Lancez-les quand vous voulez, ou laissez l'autopilote les réveiller.": ["Each has a trade. Run them whenever you like, or let the autopilot wake them up.","Cada uno tiene su oficio. Lánzalos cuando quieras o deja que el piloto automático los despierte.","Jeder hat sein Handwerk. Starte sie, wann du willst, oder lass den Autopiloten sie wecken.","Cada um tem seu ofício. Acione-os quando quiser ou deixe o piloto automático acordá-los."],
  "Changements annulés": ["Changes undone","Cambios deshechos","Änderungen rückgängig gemacht","Alterações desfeitas"],
  "Chaque assistant lit vos fiches et votre historique, puis propose. Rien ne change sans votre accord, et tout s'annule d'un clic.": ["Each assistant reads your cards and your history, then suggests. Nothing changes without your say-so, and everything undoes in one click.","Cada asistente lee tus tarjetas y tu historial, y luego propone. Nada cambia sin tu permiso, y todo se deshace con un clic.","Jeder Assistent liest deine Karten und deinen Verlauf und macht dann Vorschläge. Nichts ändert sich ohne dein Okay, und alles lässt sich mit einem Klick rückgängig machen.","Cada assistente lê seus cartões e seu histórico e depois propõe. Nada muda sem sua permissão, e tudo se desfaz com um clique."],
  "Chaque lundi, il fait le point : ce qui progresse, ce qui glisse, où vous en êtes pour l'examen, et trois priorités.": ["Every Monday, it takes stock: what is improving, what is slipping, where you stand for the exam, and three priorities.","Cada lunes hace balance: lo que avanza, lo que se escapa, cómo vas para el examen y tres prioridades.","Jeden Montag zieht er Bilanz: was vorangeht, was abrutscht, wo du für die Prüfung stehst, und drei Prioritäten.","Toda segunda, ele faz o balanço: o que avança, o que escorrega, como você está para a prova e três prioridades."],
  "Chaque matin, le Planificateur prépare votre séance ; chaque lundi, le Chroniqueur fait le bilan de la semaine.": ["Every morning, the Planner prepares your session; every Monday, the Chronicler reviews your week.","Cada mañana, el Planificador prepara tu sesión; cada lunes, el Cronista hace el balance de la semana.","Jeden Morgen bereitet der Planer deine Sitzung vor; jeden Montag zieht der Chronist Bilanz über die Woche.","Toda manhã, o Planejador prepara sua sessão; toda segunda, o Cronista faz o balanço da semana."],
  "Chaque matin, le Planificateur prépare votre séance. Chaque lundi, le Chroniqueur fait le bilan de la semaine. Ils travaillent à l'ouverture de l'app, sans rien modifier.": ["Every morning, the Planner prepares your session. Every Monday, the Chronicler reviews your week. They work when you open the app, without changing anything.","Cada mañana, el Planificador prepara tu sesión. Cada lunes, el Cronista hace el balance de la semana. Trabajan al abrir la app, sin modificar nada.","Jeden Morgen bereitet der Planer deine Sitzung vor. Jeden Montag zieht der Chronist Bilanz über die Woche. Sie arbeiten beim Öffnen der App, ohne etwas zu ändern.","Toda manhã, o Planejador prepara sua sessão. Toda segunda, o Cronista faz o balanço da semana. Eles trabalham quando você abre o app, sem alterar nada."],

  "Claude, d'Anthropic : par votre compte Claude dans l'app Claude, ou par le serveur Engram ailleurs. Sans IA, Engram continue de fonctionner avec ses méthodes locales.": ["Claude, by Anthropic: through your Claude account in the Claude app, or through the Engram server elsewhere. Without AI, Engram keeps working with its local methods.","Claude, de Anthropic: con tu cuenta de Claude en la app de Claude, o con el servidor de Engram en otros sitios. Sin IA, Engram sigue funcionando con sus métodos locales.","Claude von Anthropic: über dein Claude-Konto in der Claude-App oder anderswo über den Engram-Server. Ohne KI funktioniert Engram mit seinen lokalen Methoden weiter.","Claude, da Anthropic: pela sua conta Claude no app do Claude ou pelo servidor do Engram em outros lugares. Sem IA, o Engram continua funcionando com seus métodos locais."],
