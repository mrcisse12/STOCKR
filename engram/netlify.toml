# ── Engram sur Netlify ────────────────────────────────────────────────
# Créez un site Netlify à partir de ce dépôt avec « Base directory » = engram
# (Site configuration → Build & deploy → Build settings), puis ajoutez la
# variable ANTHROPIC_API_KEY (Site configuration → Environment variables).
# Le site de STOCKR, à la racine du dépôt, n'est pas touché.

[build]
  command = "npm ci --prefix server && node netlify/build.mjs"
  publish = "_site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self)"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
