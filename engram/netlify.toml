# ── Engram sur Netlify ────────────────────────────────────────────────
# Créez un site Netlify à partir de ce dépôt avec « Base directory » = engram
# (Site configuration → Build & deploy → Build settings), puis ajoutez la
# variable ANTHROPIC_API_KEY (Site configuration → Environment variables).
# Le site de STOCKR, à la racine du dépôt, n'est pas touché.
#
# « npm ci » installe le SDK Claude dans engram/node_modules (package.json de
# ce dossier) : c'est là que Netlify le cherche pour l'emballer avec la
# fonction /api/ai. Installé seulement dans server/, il restait dehors et
# l'IA ne marchait pas en ligne (vérifié avec netlify build, lot 12).

[build]
  command = "npm ci && node netlify/build.mjs"
  publish = "_site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self)"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
